<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PI Transfer Tracker</title>
<link rel="icon" href="favicon.png" />
<style>
:root {
  --primary: #2a6ebb; --primary-dark: #233f76; --primary-darker: #172a4f;
  --primary-light: #50a0d6; --primary-lighter: #8bc2e4; --primary-bg: #cfdbed;
  --accent: #303c9d; --sky: #309bdb;
  --success: #16a34a; --success-bg: #f0fdf4;
  --warning: #d97706; --warning-bg: #fffbeb;
  --danger: #dc2626; --danger-bg: #fef2f2;
  --info: #0891b2; --info-bg: #ecfeff;
  --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0; --gray-300: #cbd5e1;
  --gray-400: #94a3b8; --gray-500: #64748b; --gray-600: #475569; --gray-700: #334155;
  --gray-800: #1e293b; --gray-900: #0f172a;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-50); color: var(--gray-800); font-size: 14px; line-height: 1.5; }

/* Navbar */
.navbar { position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg, var(--primary-darker), var(--primary-dark)); height: 64px; box-shadow: 0 2px 8px rgba(23,42,79,.3); display: flex; align-items: center; padding: 0 24px; color: white; }
.navbar .logo { height: 40px; filter: brightness(1.1); margin-right: 16px; }
.navbar .brand { display: flex; flex-direction: column; line-height: 1.2; }
.navbar .brand-title { font-weight: 600; font-size: 15px; }
.navbar .brand-sub { font-size: 12px; opacity: .85; }
.navbar .spacer { flex: 1; }
.navbar .user { font-size: 13px; opacity: .9; }

/* Tabs */
.tabs { display: flex; gap: 4px; background: white; padding: 0 24px; border-bottom: 1px solid var(--gray-200); box-shadow: var(--shadow); }
.tab { padding: 14px 18px; border: none; background: none; font-size: 14px; color: var(--gray-600); cursor: pointer; border-bottom: 3px solid transparent; font-weight: 500; }
.tab:hover { color: var(--primary); }
.tab.active { color: var(--sky); border-bottom-color: var(--sky); }

/* Layout */
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 600; color: var(--gray-900); }

/* Buttons */
.btn { padding: 8px 16px; border: 1px solid transparent; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: white; color: var(--gray-700); border-color: var(--gray-300); }
.btn-secondary:hover { background: var(--gray-50); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* Cards */
.card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.card-header { padding: 14px 18px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.card-body { padding: 18px; }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filters input, .filters select { padding: 7px 10px; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 13px; background: white; }

/* Table */
table { width: 100%; background: white; border-collapse: collapse; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
thead { background: var(--gray-100); }
th { text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--gray-200); }
td { padding: 12px; border-bottom: 1px solid var(--gray-100); font-size: 13px; }
tbody tr { cursor: pointer; transition: background .1s; }
tbody tr:hover { background: var(--primary-bg); }

/* Status badges */
.badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-new { background: var(--info-bg); color: var(--info); }
.badge-verified { background: var(--primary-bg); color: var(--primary-dark); }
.badge-progress { background: var(--warning-bg); color: var(--warning); }
.badge-pending-clar { background: #fde68a; color: #92400e; }
.badge-needs-formula { background: #fee2e2; color: #b91c1c; }
.badge-ready { background: #fef3c7; color: #92400e; }
.badge-shipped { background: var(--success-bg); color: var(--success); }
.badge-delivered { background: #dbeafe; color: #1e40af; }
.badge-received { background: #d1fae5; color: #065f46; }
.badge-canceled { background: var(--gray-200); color: var(--gray-600); }
.badge-cold { background: var(--info-bg); color: var(--info); margin-left: 4px; }

/* Form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.form-grid.single { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--gray-700); text-transform: uppercase; letter-spacing: .03em; }
.form-group input, .form-group select, .form-group textarea { padding: 9px 10px; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: white; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(42,110,187,.15); }
.form-group textarea { resize: vertical; min-height: 70px; }
.form-group .hint { font-size: 11px; color: var(--gray-500); }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal { background: white; border-radius: 12px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 2; }
.modal-title { font-size: 18px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 24px; color: var(--gray-500); cursor: pointer; line-height: 1; }
.modal-body { padding: 22px; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: white; }

/* Sections */
.section { margin-top: 20px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--primary-bg); }

/* Items list */
.item-row { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.item-row.unverified { border-left: 4px solid var(--warning); }
.item-row.verified { border-left: 4px solid var(--success); }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.item-title { font-weight: 600; color: var(--gray-800); }
.item-sub { font-size: 12px; color: var(--gray-500); }

/* Comments */
.comment { background: var(--gray-50); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
.comment-meta { display: flex; gap: 10px; font-size: 12px; color: var(--gray-500); margin-bottom: 4px; }
.comment-author { font-weight: 600; color: var(--primary-dark); }
.comment-body { font-size: 13px; color: var(--gray-800); }
.comment-scope { display: inline-block; background: var(--primary-bg); color: var(--primary-dark); font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 600; }

/* Empty state */
.empty { text-align: center; padding: 50px 20px; color: var(--gray-500); }
.empty h3 { color: var(--gray-700); margin-bottom: 6px; }

/* Status select inline */
select.status-select { font-size: 12px; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--gray-300); }

.pill-warn { background: var(--warning-bg); color: var(--warning); padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.pill-danger { background: var(--danger-bg); color: var(--danger); padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }

/* SLA indicators */
.sla-ok { color: var(--success); }
.sla-warn { color: var(--warning); font-weight: 600; }
.sla-breach { color: var(--danger); font-weight: 700; }
tr.row-sla-breach { background: var(--danger-bg) !important; }
tr.row-sla-warn { background: var(--warning-bg) !important; }

/* Global search */
.global-search { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); color: white; padding: 7px 12px; border-radius: 6px; font-size: 13px; width: 240px; }
.global-search::placeholder { color: rgba(255,255,255,.7); }
.global-search:focus { outline: none; background: rgba(255,255,255,.25); }
.global-results { position: absolute; top: 58px; right: 200px; background: white; color: var(--gray-800); border-radius: var(--radius); box-shadow: var(--shadow-md); max-height: 400px; overflow-y: auto; width: 380px; z-index: 150; border: 1px solid var(--gray-200); }
.global-result { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--gray-100); font-size: 13px; }
.global-result:hover { background: var(--primary-bg); }
.global-result .meta { font-size: 11px; color: var(--gray-500); }

/* User switcher */
.user-switcher { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); color: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-right: 10px; cursor: pointer; }
.user-switcher option { color: var(--gray-800); }

/* KPI card */
.kpi-card { background: white; border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 16px; box-shadow: var(--shadow); }
.kpi-label { font-size: 11px; color: var(--gray-500); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.kpi-value { font-size: 26px; font-weight: 700; color: var(--primary-dark); }
.kpi-sub { font-size: 11px; color: var(--gray-500); margin-top: 4px; }

/* Photo thumbnails */
.photo-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.photo-thumb { width: 72px; height: 72px; border-radius: 6px; border: 1px solid var(--gray-300); background-size: cover; background-position: center; position: relative; }
.photo-thumb .rm { position: absolute; top: -6px; right: -6px; background: var(--danger); color: white; border-radius: 50%; width: 18px; height: 18px; border: none; font-size: 11px; cursor: pointer; line-height: 1; }

/* Mobile */
@media (max-width: 900px) {
  .navbar { padding: 0 12px; flex-wrap: wrap; height: auto; min-height: 64px; }
  .navbar .logo { height: 32px; }
  .navbar .brand-title { font-size: 13px; }
  .navbar .brand-sub { font-size: 11px; }
  .navbar .global-search { width: 100%; margin-top: 8px; order: 10; }
  .navbar .user-switcher { font-size: 11px; }
  .tabs { overflow-x: auto; padding: 0 8px; }
  .tab { padding: 12px 12px; font-size: 13px; white-space: nowrap; }
  .container { padding: 12px; }
  .page-title { font-size: 18px; }
  .form-grid { grid-template-columns: 1fr; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
  .modal { max-height: 95vh; }
  .modal-body { padding: 14px; }
}

/* Barcode scan input */
.scan-bar { display: flex; gap: 8px; align-items: center; background: var(--primary-bg); padding: 10px 14px; border-radius: var(--radius); margin-bottom: 14px; }
.scan-bar input { flex: 1; padding: 9px 12px; border: 1px solid var(--primary-light); border-radius: 6px; font-size: 14px; font-family: monospace; }
.scan-bar .label { font-weight: 600; color: var(--primary-dark); font-size: 13px; }
</style>
</head>

// Pharmacy shipping-day helpers. Backward compatible:
//   - new shape: addr.shippingDays = [2, 4] (e.g., Tue + Thu)
//   - old shape: addr.shippingDay = 2 (single)
function getShippingDays(addr) {
  if (!addr) return [];
  if (Array.isArray(addr.shippingDays)) return addr.shippingDays.filter(n => typeof n === 'number');
  if (typeof addr.shippingDay === 'number') return [addr.shippingDay];
  return [];
}
function nextShippingDayFrom(addr, fromDate) {
  const days = getShippingDays(addr);
  if (days.length === 0) return null;
  for (let i = 1; i <= 7; i++) {
    const d = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate() + i);
    if (days.includes(d.getDay())) return d;
  }
  return null;
}
function latestShippingDayAtOrBefore(addr, endDate) {
  const days = getShippingDays(addr);
  if (days.length === 0) return null;
  for (let i = 0; i < 7; i++) {
    const d = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate() - i);
    if (days.includes(d.getDay())) return d;
  }
  return null;
}

function slaStatus(t) {
  // Anticipated-date-based alerting (replaces the old per-status hour limits).
  // - breach = anticipated ship date passed and still not shipped
  // - warn   = anticipated ship date is today or tomorrow and not shipped yet
  // - ok     = anticipated date is set, in the future
  // - none   = no anticipated date set, or already shipped / canceled
  if (!t.anticipatedShipDate) return { state: 'none', hoursOver: 0 };
  if (['Shipped','Delivered','Canceled'].includes(t.status)) return { state: 'none', hoursOver: 0 };
  const today = todayLocal();
  const ant = t.anticipatedShipDate.slice(0,10);
  if (ant < today) {
    const daysOver = Math.floor((Date.parse(today) - Date.parse(ant)) / 86400000);
    return { state: 'breach', daysOver };
  }
  const t2 = new Date();
  t2.setDate(t2.getDate() + 1);
  const tomorrow = `${t2.getFullYear()}-${String(t2.getMonth()+1).padStart(2,'0')}-${String(t2.getDate()).padStart(2,'0')}`;
  if (ant <= tomorrow) return { state: 'warn', daysOver: 0 };
  return { state: 'ok', daysOver: 0 };
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(s) {
  if (!s) return '—';
  const d = parseDateLocal(s);
  return d ? d.toLocaleDateString() : (typeof s === 'string' ? s : '—');
}
// Parse a date string in a timezone-safe way. YYYY-MM-DD plain dates are
// treated as local-calendar dates (not UTC midnight) so users in EST/CST/MST
// all see the same calendar day. Full ISO timestamps (with T and time) are
// parsed normally as instants in time.
function parseDateLocal(s) {
  if (!s) return null;
  if (typeof s === 'string') {
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
// Today's date as YYYY-MM-DD in the user's local calendar (NOT UTC).
// Critical for EST/CST/MST users — a UTC-based "today" lands on tomorrow's
// date for anyone who logs in after ~7pm local time, which made transfers
// look overdue and stored receipt dates one day late.
function todayLocal() {
  return toDateISO(new Date());
}
// Format a Date as YYYY-MM-DD in the LOCAL calendar (vs .toISOString() which gives UTC).
// Use this anywhere we need to emit a date-only string for storage or display.
function toDateISO(d) {
  if (!d) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function docListForTransfer(t, kind) {

  const fallbackPages = (t.pageImages || []).filter(p => p.kind === pageImageKind && p.blobName);
  return files.map(f => {
    const url = f.dataUrl || (f.blobName ? blobUrl(f.blobName) : null);
    if (url) return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="color:var(--primary)">${escapeHtml(f.name)}</a>`;
    if (fallbackPages.length) {

}
// Build a bulk shipment ID like BULK-20260529-CPL-001.
// Sequence is per-day per-destination to make collisions unlikely without a real DB.
function generateBulkShipmentId(toLocation, dateISO) {
  const code = PHARMACY_CODES[toLocation] || (toLocation || 'XX').replace(/\s+/g,'').slice(0,3).toUpperCase();
  const dateStr = (dateISO || new Date().toISOString()).slice(0,10).replace(/-/g,'');
  // Count existing bulks today to this destination for the sequence
  const prefix = `BULK-${dateStr}-${code}-`;
  const existing = SHIPMENTS.filter(s => (s.bulkShipmentId||'').startsWith(prefix)).length;
  const seq = String(existing + 1).padStart(3, '0');
  return prefix + seq;
}

  const html = ['<!DOCTYPE html><html><head><title>Print</title><style>',

  const out = [html];
  items.forEach(it => {
    out.push('<div class="doc">');
    if (it.summaryHtml) {
      // Cover-page summary: render its own HTML body
      out.push(it.summaryHtml);

function updateIncomingBadge() {
  const count = SHIPMENTS.filter(s => s.toLocation === CURRENT_USER.location && s.status !== 'Received').length;
  const b = document.getElementById('incomingBadge');
  if (b) { if (count > 0) { b.textContent = count; b.style.display = 'inline-block'; } else { b.style.display = 'none'; } }
  const ab = document.getElementById('actionsBadge');
  if (ab) {
    const today = todayLocal();
    const cancelN = visibleTransfers().filter(t => t.status === 'Canceled' && !t.cancelAcknowledged).length;
    const deliveredN = visibleShipments().filter(s => s.toLocation === CURRENT_USER.location && s.status === 'Delivered').length;
    const lateN = visibleTransfers().filter(t => t.anticipatedShipDate && t.anticipatedShipDate.slice(0,10) < today && !['Shipped','Delivered','Canceled'].includes(t.status)).length;
    const heldN = visibleTransfers().filter(t => DELAY_STATUSES.includes(t.status)).length;
    const n = cancelN + deliveredN + lateN + heldN;
    if (n > 0) { ab.textContent = n; ab.style.display = 'inline-block'; } else { ab.style.display = 'none'; }
  }
}
function updateSLABadge() {
  const breaches = visibleTransfers().filter(t => slaStatus(t).state === 'breach').length;

  const count = breaches + questions;
  const b = document.getElementById('slaBadge');

      <select id="f-fill"><option value="">All fill locations</option>${LOCATIONS.map(l=>`<option ${l===state.filterFill?'selected':''}>${l}</option>`).join('')}</select>
      <input id="f-med" placeholder="Filter by medication…" value="${escapeHtml(state.filterMed||'')}" style="min-width:180px" />
      <span style="width:1px;height:24px;background:var(--gray-300);margin:0 4px"></span>
      <button class="btn btn-secondary btn-sm" id="f-saveDefault" title="Save current filters as your default view (this browser, your account)" style="padding:3px 9px;font-size:11px">💾 Save as default</button>
      <button class="btn btn-secondary btn-sm" id="f-resetAll" title="Clear every filter and reset to all transfers" style="padding:3px 9px;font-size:11px">↺ Reset</button>
      <div style="flex:1"></div>
      <label class="checkbox-row" style="font-size:12px"><input type="checkbox" id="selectAllPrint" /> Select all visible for print</label>
    </div>
    <div class="filters" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;border-top:1px dashed var(--gray-200);padding-top:6px">
      <span style="display:inline-flex;align-items:center;gap:4px"><label style="font-size:12px;color:var(--gray-600)">Created</label>
        <input type="date" id="f-dateFrom" value="${escapeHtml(state.dateFrom||'')}" title="Created from" />
        <input type="date" id="f-dateTo" value="${escapeHtml(state.dateTo||'')}" title="Created to" /></span>
      <span style="display:inline-flex;align-items:center;gap:4px"><label style="font-size:12px;color:var(--gray-600)">Ant ship</label>
        <input type="date" id="f-antShipFrom" value="${escapeHtml(state.filterAntShipFrom||'')}" title="Anticipated ship from" />
        <input type="date" id="f-antShipTo" value="${escapeHtml(state.filterAntShipTo||'')}" title="Anticipated ship to" /></span>
      <span style="display:inline-flex;align-items:center;gap:4px"><label style="font-size:12px;color:var(--gray-600)">Shipped</label>
        <input type="date" id="f-shippedFrom" value="${escapeHtml(state.filterShipFrom||'')}" title="Ship date from" />
        <input type="date" id="f-shippedTo" value="${escapeHtml(state.filterShipTo||'')}" title="Ship date to" /></span>
      ${(state.dateFrom||state.dateTo||state.filterAntShipFrom||state.filterAntShipTo||state.filterShipFrom||state.filterShipTo)?'<button class="btn btn-secondary btn-sm" id="clearDateRange">Clear dates</button>':''}
    </div>
    ${filtered.length === 0 ? `<div class="empty"><h3>No transfers match</h3><p>Try clearing filters.</p></div>` : `
    <table>
      <thead><tr>
        <th style="width:30px"></th>
        <th>ID</th><th>Patient</th><th>Medication</th><th>From → Fill</th><th>Ship To</th><th>Status</th><th>SLA</th>
        <th>Transfer Date</th><th>Ant Ship</th><th>Ship Date</th><th>Tracking</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${filtered.map(t => {
          const sla = slaStatus(t);
          const rowClass = sla.state === 'breach' ? 'row-sla-breach' : (sla.state === 'warn' ? 'row-sla-warn' : '');
          const slaCell = sla.state === 'breach' ? `<span class="pill-danger" title="Anticipated ship date passed">⚠ ${sla.daysOver}d late</span>` : sla.state === 'warn' ? `<span class="pill-warn" title="Anticipated ship date is today or tomorrow">Ship soon</span>` : sla.state === 'ok' ? `<span class="sla-ok">On track</span>` : '<span class="item-sub">—</span>';
          const cancelWarn = (t.status === 'Canceled' && !t.cancelAcknowledged) ? '<span class="pill-danger" style="margin-left:4px">⚠ unack</span>' : '';
          return `<tr class="${rowClass}" data-id="${t.id}">
            <td onclick="event.stopPropagation()"><input type="checkbox" class="print-pick" data-pick="${t.id}" ${state.printSelection.has(t.id)?'checked':''} /></td>
            <td><code style="font-family:monospace;font-size:12px;font-weight:600;color:var(--primary-dark)">${t.id}</code></td>
            <td>${t.isBulkPickup ? `<strong style="color:var(--primary-dark)">📦 BULK PICKUP</strong> <span class="badge badge-verified" style="font-size:10px">${escapeHtml(String(t.bulkScriptCount||'?'))} scripts</span>${cancelWarn}${t.bulkDescription?`<div class="item-sub">${escapeHtml(t.bulkDescription.slice(0,60))}</div>`:''}` : `<strong>${escapeHtml(t.patientName)}</strong> <span class="badge ${t.transferType==='Refill'?'badge-verified':'badge-new'}" style="font-size:10px">${t.transferType==='Refill'?'Refill':'New'}</span>${t.coldItem?'<span class="badge badge-cold">Cold</span>':''}${cancelWarn}<div class="item-sub">DOB ${fmtDate(t.patientDOB)}</div>`}</td>
            <td>${(() => {
              const drugs = (t.items || []).map(i => i.drug).filter(Boolean);
              if (t.isBulkPickup) return '<span class="item-sub">—</span>';
              if (drugs.length === 0) return '<span class="item-sub">—</span>';
              const first = drugs[0];
              const truncated = first.length > 40 ? first.slice(0,40)+'…' : first;
              const more = drugs.length > 1 ? `<div class="item-sub">+${drugs.length-1} more</div>` : '';
              return `<span title="${escapeHtml(drugs.join(', '))}">${escapeHtml(truncated)}</span>${more}`;
            })()}</td>
            <td>${escapeHtml(t.originLocation)} → ${escapeHtml(t.fillLocation)}</td>
            <td>${escapeHtml(t.shipTo)}${t.pickupAtPharmacy?`<div class="item-sub" style="color:var(--primary-dark);font-weight:600">📍 ${escapeHtml(t.pickupLocation||'?')}${t.isBulkPickup?' · BULK':''}</div>`:(t.shipCity?`<div class="item-sub">${escapeHtml(t.shipCity)}, ${escapeHtml(t.shipState)}</div>`:'')}</td>
            <td onclick="event.stopPropagation()"><select class="row-status status-select" data-status-id="${t.id}" style="font-size:11px;padding:3px 4px">${STATUSES.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></td>
            <td>${slaCell}</td>
            <td>${fmtDate(t.createdAt)}</td>
            <td>${fmtDate(t.anticipatedShipDate)}</td>
            <td>${fmtDate(t.dateShipped)}</td>
            <td>${escapeHtml(t.trackingNumber||'—')}</td>
            <td onclick="event.stopPropagation()" style="white-space:nowrap">
              <button class="btn btn-secondary btn-sm" data-view-tx="${t.id}" title="View transfer details" style="padding:3px 7px;font-size:11px">👁 View</button>
              <button class="btn btn-secondary btn-sm" data-edit-tx="${t.id}" title="Edit transfer" style="padding:3px 7px;font-size:11px">✏️ Edit</button>
              <button class="btn btn-primary btn-sm" data-rcvrx-tx="${t.id}" title="Enter Receiving Rx #" style="padding:3px 7px;font-size:11px">💊 Rx #</button>
              ${t.paid === 'Paid'
                ? `<span title="Paid${t.paidBy?' by '+escapeHtml(t.paidBy):''}${t.paidAt?' on '+fmtDate(t.paidAt):''}" style="display:inline-block;padding:3px 9px;font-size:11px;font-weight:700;background:#16a34a;color:white;border-radius:4px">✓ Paid</span>`
                : `<button class="btn btn-primary btn-sm" data-paid-tx="${t.id}" title="Click to mark this transfer Paid / Charged" style="padding:3px 9px;font-size:11px;font-weight:600">💲 Mark Paid / Charged</button>`}
              <button class="btn btn-secondary btn-sm" data-ask="${t.id}" title="Ask a question on this transfer" style="padding:3px 7px;font-size:11px">❓ Ask</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  `;
  document.getElementById('f-search').addEventListener('input', e => { state.search = e.target.value; renderTransfers(); });
  document.getElementById('f-status').addEventListener('change', e => { state.filterStatus = e.target.value; renderTransfers(); });
  document.getElementById('f-showCompleted').addEventListener('change', e => { state.showCompleted = e.target.checked; renderTransfers(); });
  // Save current filters as the default view (this browser, this user)
  const saveBtn = document.getElementById('f-saveDefault');
  if (saveBtn) saveBtn.onclick = () => {
    if (saveDefaultView()) {
      saveBtn.textContent = '✓ Saved';
      setTimeout(() => { saveBtn.textContent = '💾 Save as default'; }, 1500);
    }
  };
  // Reset every filter (does NOT delete the saved default — that requires clearing
  // localStorage manually OR saving a fresh empty default by clicking Save while empty)
  const resetBtn = document.getElementById('f-resetAll');
  if (resetBtn) resetBtn.onclick = () => {
    state.filterStatus = '';
    state.showCompleted = false;
    state.filterType = '';
    state.filterPaid = '';
    state.filterOrigin = '';
    state.filterFill = '';
    state.filterMed = '';
    state.filterAntShipFrom = '';
    state.filterAntShipTo = '';
    state.filterShipFrom = '';
    state.filterShipTo = '';
    state.dateFrom = '';
    state.dateTo = '';
    state.search = '';
    renderTransfers();
  };
  document.getElementById('f-type').addEventListener('change', e => { state.filterType = e.target.value; renderTransfers(); });
  document.getElementById('f-paid').addEventListener('change', e => { state.filterPaid = e.target.value; renderTransfers(); });
  document.getElementById('f-origin').addEventListener('change', e => { state.filterOrigin = e.target.value; renderTransfers(); });
  document.getElementById('f-fill').addEventListener('change', e => { state.filterFill = e.target.value; renderTransfers(); });
  document.getElementById('f-med').addEventListener('input', e => { state.filterMed = e.target.value; renderTransfers(); });
  document.getElementById('f-antShipFrom').addEventListener('change', e => { state.filterAntShipFrom = e.target.value; renderTransfers(); });
  document.getElementById('f-antShipTo').addEventListener('change', e => { state.filterAntShipTo = e.target.value; renderTransfers(); });
  document.getElementById('f-shippedFrom').addEventListener('change', e => { state.filterShipFrom = e.target.value; renderTransfers(); });
  document.getElementById('f-shippedTo').addEventListener('change', e => { state.filterShipTo = e.target.value; renderTransfers(); });
  document.getElementById('f-dateFrom').addEventListener('change', e => { state.dateFrom = e.target.value; renderTransfers(); });
  document.getElementById('f-dateTo').addEventListener('change', e => { state.dateTo = e.target.value; renderTransfers(); });
  document.getElementById('f-sortBy').addEventListener('change', e => { state.sortBy = e.target.value; renderTransfers(); });
  const clearDates = document.getElementById('clearDateRange');
  if (clearDates) clearDates.onclick = () => {
    state.dateFrom = ''; state.dateTo = '';
    state.filterAntShipFrom = ''; state.filterAntShipTo = '';
    state.filterShipFrom = ''; state.filterShipTo = '';
    renderTransfers();
  };
  root.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.classList.contains('print-pick')) return;
    if (e.target.dataset && e.target.dataset.ask) return; // let the ask link handle it
    openTransfer(+tr.dataset.id);
  }));
  root.querySelectorAll('[data-ask]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    openAskQuestionModal(+a.dataset.ask);
  }));
  root.querySelectorAll('[data-view-tx]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openTransfer(+b.dataset.viewTx);
  }));
  root.querySelectorAll('[data-edit-tx]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    editTransferDirectly(+b.dataset.editTx);
  }));
  root.querySelectorAll('[data-rcvrx-tx]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openReceivingRxModal(+b.dataset.rcvrxTx);
  }));
  root.querySelectorAll('[data-paid-tx]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = +b.dataset.paidTx;
    const t = TRANSFERS.find(x => x.id === id);
    if (!t) return;
    t.paid = 'Paid';
    t.paidBy = CURRENT_USER.name;
    t.paidAt = new Date().toISOString();
    apiUpdateTransfer(t);
    logAudit('mark_paid', 'transfer', t.id);
    renderTransfers();
  }));
  // Inline status change from the Transfers table — no need to open the detail modal
  root.querySelectorAll('[data-status-id]').forEach(sel => sel.addEventListener('change', e => {
    e.stopPropagation();
    const id = +sel.dataset.statusId;
    const t = TRANSFERS.find(x => x.id === id);
    if (!t) return;
    const newStatus = sel.value;
    const oldStatus = t.status;
    if (newStatus === 'Canceled' && t.status !== 'Canceled') onTransferCanceled(t);
    t.status = newStatus;
    apiUpdateTransfer(t);
    logAudit('status_change', 'transfer', t.id, { from: oldStatus, to: newStatus });
    if (DELAY_STATUSES.includes(newStatus) && !DELAY_STATUSES.includes(oldStatus)) {
      notifyTeamsStatusDelay(t, oldStatus, newStatus);
    }
    renderTransfers();
  }));
  root.querySelectorAll('.print-pick').forEach(cb => cb.onchange = e => {
    const id = +cb.dataset.pick;
    if (cb.checked) state.printSelection.add(id); else state.printSelection.delete(id);
    renderTransfers();
  });
  const selAll = document.getElementById('selectAllPrint');
  if (selAll) selAll.onchange = () => {
    if (selAll.checked) filtered.forEach(t => state.printSelection.add(t.id));
    else filtered.forEach(t => state.printSelection.delete(t.id));
    renderTransfers();
  };
  const clr = document.getElementById('printClear');
  if (clr) clr.onclick = () => { state.printSelection.clear(); renderTransfers(); };
  const psbtn = document.getElementById('printSelected');
  if (psbtn) psbtn.onclick = () => batchPrintTransfers([...state.printSelection]);
  // Restore focus to whichever input the user was typing in before the re-render
  if (wasFocused) {
    const el = document.getElementById(wasFocused);
    if (el) {
      el.focus();
      if (focusedCaret != null && el.setSelectionRange) {
        try { el.setSelectionRange(focusedCaret, focusedCaret); } catch {}
      }
    }
  }
}

// Collect every printable document attached to a transfer. Handles three storage paths:
//  (1) entries with an inline dataUrl (single-upload form)
//  (2) entries with a blobName reference (server-stored)
//  (3) bulk-upload transfers where pkSheets/hardCopies are metadata-only — falls back to
//      transfer.pageImages (per-page PNGs in blob storage), filtered by kind
// Each doc gets the standard transfer-ID stamp metadata for the print banner.
function getPrintableDocsForTransfer(t) {
  const meta = `${t.originLocation} → ${t.fillLocation}${t.transferType==='Refill'?' · Refill':''}`;
  const stampCommon = { transferId: t.id, patientName: t.patientName, transferMeta: meta };
  const docs = [];
  const resolveSrc = (f) => f.dataUrl || (f.blobName ? blobUrl(f.blobName) : null);

  const pks = t.pkSheets || (t.pkSheet ? [t.pkSheet] : []);
  const hcs = t.hardCopies || (t.hardCopy ? [t.hardCopy] : []);

  // PK sheets — use the upload entry if it has data, otherwise fall back to pageImages with kind=transfer
  const pksWithData = pks.filter(f => resolveSrc(f));
  if (pksWithData.length) {
    pksWithData.forEach((f, idx) => docs.push({
      ...stampCommon,
      title: `PK Transfer Sheet${pksWithData.length>1?' '+(idx+1):''}`,
      name: f.name, type: f.type, dataUrl: resolveSrc(f)
    }));
  } else if (pks.length) {
    // Metadata-only entries — use blob page images instead
    const transferPages = (t.pageImages||[]).filter(p => p.kind === 'transfer' && p.blobName);
    transferPages.forEach((p) => docs.push({
      ...stampCommon,
      title: `PK Transfer Sheet — page ${p.pageNum}`,
      name: `page-${p.pageNum}.png`, type: 'image/png',
      dataUrl: blobUrl(p.blobName)
    }));
    if (transferPages.length === 0) {
      docs.push({ ...stampCommon, title: `PK Transfer Sheet — ${pks[0].name}`, name: pks[0].name, type: pks[0].type, dataUrl: null });
    }
  }

  // Hard copies — same pattern
  const hcsWithData = hcs.filter(f => resolveSrc(f));
  if (hcsWithData.length) {
    hcsWithData.forEach((f, idx) => docs.push({
      ...stampCommon,
      title: `Hard Copy${hcsWithData.length>1?' '+(idx+1):''}`,
      name: f.name, type: f.type, dataUrl: resolveSrc(f)
    }));
  } else if (hcs.length) {
    const hcPages = (t.pageImages||[]).filter(p => p.kind === 'hardcopy' && p.blobName);
    hcPages.forEach((p) => docs.push({
      ...stampCommon,
      title: `Hard Copy — page ${p.pageNum}`,
      name: `page-${p.pageNum}.png`, type: 'image/png',
      dataUrl: blobUrl(p.blobName)
    }));
    if (hcPages.length === 0) {
      docs.push({ ...stampCommon, title: `Hard Copy — ${hcs[0].name}`, name: hcs[0].name, type: hcs[0].type, dataUrl: null });
    }
  }

  // CC form (only attached when billing is Credit Card and the form was uploaded)
  if (t.ccForm && resolveSrc(t.ccForm)) {
    docs.push({
      ...stampCommon,
      title: 'Credit Card Authorization (signed)',
      name: t.ccForm.name, type: t.ccForm.type, dataUrl: resolveSrc(t.ccForm)
    });
  }

  if (docs.length === 0) {
    docs.push({ ...stampCommon, title: '(no documents attached)', name: '', type: '', dataUrl: null });
  }
  return docs;
}

// Pre-print prompt: ask the user for the anticipated ship date.
// Calls onProceed(newDate) where newDate is the entered date string or null
// (Cancel returns nothing — onProceed is never called).
// Note: this helper does NOT mutate transfers or call apiUpdateTransfer — the
// caller is responsible for applying the date AND any other changes (e.g.,
// status auto-advance) in a single combined PUT per transfer, to avoid races.
function askAntShipDateBeforePrint(transfers, onProceed) {
  if (!transfers || transfers.length === 0) { onProceed(null); return; }
  const root = document.getElementById('modalRoot');
  const existing = transfers.map(t => t.anticipatedShipDate).filter(Boolean).sort().pop() || '';
  const patientCount = transfers.length;
  const patientList = transfers.slice(0, 5).map(t => t.patientName || '(bulk)').join(', ') + (transfers.length > 5 ? `, +${transfers.length-5} more` : '');
  root.innerHTML = `<div class="modal-overlay" id="aspOverlay"><div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div><div class="modal-title">Anticipated Ship Date</div><div class="item-sub">${patientCount} transfer${patientCount===1?'':'s'} · ${escapeHtml(patientList)}</div></div>
      <button class="modal-close" id="aspClose">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;margin:0 0 10px">Set the anticipated ship date for these transfers before printing. Leave blank and click <strong>Skip</strong> if you're not sure yet.</p>
      <div class="form-group"><label>Anticipated Ship Date</label><input type="date" id="aspDate" value="${escapeHtml(existing)}" autofocus /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="aspCancel">Cancel</button>
      <button class="btn btn-secondary" id="aspSkip">Skip — print without setting</button>
      <button class="btn btn-primary" id="aspApply">Apply &amp; Print</button>
    </div>
  </div></div>`;
  const close = () => { root.innerHTML = ''; if (state.openTransferId) renderModal(); };
  document.getElementById('aspClose').onclick = close;
  document.getElementById('aspCancel').onclick = close;
  document.getElementById('aspOverlay').onclick = e => { if (e.target.id === 'aspOverlay') close(); };
  document.getElementById('aspSkip').onclick = () => { close(); onProceed(null); };
  document.getElementById('aspApply').onclick = () => {
    const v = document.getElementById('aspDate').value || null;
    close();
    onProceed(v);
  };
  const inp = document.getElementById('aspDate');
  if (inp) inp.focus();
}

// Batch-print PK transfer sheets + hard copies for selected transfers.
// After the print window opens, auto-advance any 'New' transfers to 'In Progress'.
// All mutations (anticipated ship date + status auto-advance) are combined
// into a single PUT per transfer to avoid the race where two back-to-back
// fire-and-forget PUTs can arrive out of order and revert the status.
function batchPrintTransfers(ids) {
  if (!ids.length) return;
  const transfers = ids.map(id => TRANSFERS.find(t => t.id === id)).filter(Boolean);
  askAntShipDateBeforePrint(transfers, (newDate) => {
    // Mutate locally first, then fire ONE PUT per transfer.
    let advanced = 0;
    transfers.forEach(t => {
      if (newDate) t.anticipatedShipDate = newDate;
      if (t.status === 'New') { t.status = 'In Progress'; advanced++; }
      apiUpdateTransfer(t);
    });
    const docs = transfers.flatMap(getPrintableDocsForTransfer);
    printDocs(docs);
    state.printSelection.clear();
    if (advanced) {
      setTimeout(() => {
        alert(`Print queue opened. ${advanced} transfer(s) auto-advanced to "In Progress".`);
        render();
      }, 300);
    } else {
      render();
    }
  });
}

  };
}

// =====================================================================
// Alerts tab — open questions + transfers past their status time limits
// =====================================================================
// A question is "open" if it's the last comment on the transfer (nobody has replied yet).
// We surface ones where the asker is NOT at the current user's location (i.e., the user
// is on the team that's being asked), and also show questions asked by current user as
// info so they can track their own pending questions.
function openQuestionsForUser() {
  const mine = []; // questions current user (or their location) needs to answer
  const asked = []; // questions current user asked, still awaiting reply
  visibleTransfers().forEach(t => {
    if (!t.comments || !t.comments.length) return;
    const last = t.comments[t.comments.length - 1];
    if (!last.isQuestion || last.resolved) return;
    // Determine if it's "ours to answer": current user is at one of the transfer's locations and NOT the asker
    const userLoc = CURRENT_USER.location;
    const involvedLocs = [t.originLocation, t.fillLocation].filter(Boolean);
    const askerName = last.author;
    const isMine = involvedLocs.includes(userLoc) && askerName !== CURRENT_USER.name;
    const askedByMe = askerName === CURRENT_USER.name;
    if (CURRENT_USER.role === 'admin') {
      // Admins see all open questions
      mine.push({ t, q: last });
    } else if (isMine) {
      mine.push({ t, q: last });
    } else if (askedByMe) {
      asked.push({ t, q: last });
    }
  });
  return { mine, asked };
}

function renderSLA() {
  const root = document.getElementById('view-sla');
  const issues = visibleTransfers().map(t => ({ t, sla: slaStatus(t) })).filter(x => x.sla.state === 'breach' || x.sla.state === 'warn').sort((a,b) => (a.sla.state==='breach'?0:1) - (b.sla.state==='breach'?0:1));
  const { mine, asked } = openQuestionsForUser();
  const totalAlerts = issues.length + mine.length;
  root.innerHTML = `
    <div class="page-header"><div class="page-title">Alerts <span style="font-weight:400;color:var(--gray-500);font-size:14px">(${totalAlerts})</span></div></div>

    <div class="card"><div class="card-header">Open Questions${mine.length?` <span class="badge badge-progress">${mine.length} awaiting your answer</span>`:''}</div><div class="card-body">
      ${mine.length === 0 ? `<div class="empty" style="padding:20px"><h3>🎉 No open questions for you</h3></div>` : `
      <table style="box-shadow:none;font-size:13px"><thead><tr>
        <th>Patient</th><th>From → Fill</th><th>Asked By</th><th>When</th><th>Question</th><th></th>
      </tr></thead><tbody>
        ${mine.map(({t,q}) => `<tr style="background:var(--warning-bg)" data-open-q="${t.id}">
          <td><strong>${escapeHtml(t.patientName)}</strong></td>
          <td>${escapeHtml(t.originLocation)} → ${escapeHtml(t.fillLocation)}</td>
          <td>${escapeHtml(q.author)}</td>
          <td>${new Date(q.ts).toLocaleString()}</td>
          <td>${escapeHtml((q.body||'').replace(/^❓\s*/,'').slice(0,120))}${(q.body||'').length>120?'…':''}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-secondary btn-sm" data-resolve="${t.id}" data-cid="${q.id}" title="Dismiss without replying (use when resolved in person / Teams chat)">✓ Resolved</button>
            <button class="btn btn-primary btn-sm" data-answer="${t.id}">Answer →</button>
          </td>
        </tr>`).join('')}
      </tbody></table>`}
    </div></div>

    ${asked.length ? `<div class="card"><div class="card-header">Questions You've Asked <span class="item-sub" style="font-weight:400;text-transform:none;letter-spacing:0">— waiting on a reply</span></div><div class="card-body">
      <table style="box-shadow:none;font-size:13px"><thead><tr><th>Patient</th><th>Sent To</th><th>When</th><th>Question</th><th></th></tr></thead><tbody>
        ${asked.map(({t,q}) => `<tr data-open-q="${t.id}">
          <td><strong>${escapeHtml(t.patientName)}</strong></td>
          <td>${escapeHtml([t.originLocation, t.fillLocation].filter(l => l && l !== CURRENT_USER.location).join(', '))}</td>
          <td>${new Date(q.ts).toLocaleString()}</td>
          <td>${escapeHtml((q.body||'').replace(/^❓\s*/,'').slice(0,120))}${(q.body||'').length>120?'…':''}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-secondary btn-sm" data-resolve="${t.id}" data-cid="${q.id}" title="Mark resolved (got answer outside the app)">✓ Resolved</button>
            <button class="btn btn-secondary btn-sm" data-answer="${t.id}">View</button>
          </td>
        </tr>`).join('')}
      </tbody></table>
    </div></div>` : ''}

    <div class="card"><div class="card-header">Transfers Past Status Time Limit ${issues.length?`<span class="badge badge-canceled">${issues.length}</span>`:''}</div><div class="card-body">
      <p class="item-sub" style="margin-bottom:10px">Transfers that have sat in their current status longer than allowed. Adjust limits in Admin.</p>
      ${issues.length === 0 ? `<div class="empty" style="padding:20px"><h3>🎉 All transfers within their time limits</h3></div>` : `
        <table style="box-shadow:none;font-size:13px"><thead><tr><th>Status</th><th>Patient</th><th>Status</th><th>Age</th><th>Origin</th><th>Assigned</th></tr></thead><tbody>
          ${issues.map(({t,sla}) => {
            const hoursIn = Math.round((Date.now() - new Date(t.createdAt).getTime()) / 3600000);
            return `<tr class="row-sla-${sla.state}" data-id="${t.id}">
              <td>${sla.state==='breach'?`<span class="pill-danger">⚠ Overdue</span>`:`<span class="pill-warn">Approaching</span>`}</td>
              <td><strong>${escapeHtml(t.patientName)}</strong></td>
              <td><span class="badge ${STATUS_BADGE[t.status]}">${t.status}</span></td>
              <td>${hoursIn}h (limit ${SLA_RULES[t.status]||'—'}h)</td>
              <td>${escapeHtml(t.originLocation)}</td>
              <td>${escapeHtml(t.assignedTo||'Unassigned')}</td>
            </tr>`;
          }).join('')}
        </tbody></table>`}
    </div></div>
  `;
  root.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => openTransfer(+tr.dataset.id));
  root.querySelectorAll('[data-open-q]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('[data-answer]')) return;
    openTransfer(+tr.dataset.openQ);
  });
  root.querySelectorAll('[data-answer]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    openTransfer(+b.dataset.answer);
  });
  root.querySelectorAll('[data-resolve]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const tid = +b.dataset.resolve;
    const cid = +b.dataset.cid;
    const t = TRANSFERS.find(x => x.id === tid);
    if (!t) return;
    const c = (t.comments||[]).find(x => x.id === cid);
    if (!c) return;
    c.resolved = true;
    c.resolvedBy = CURRENT_USER.name;
    c.resolvedAt = new Date().toISOString();
    apiUpdateTransfer(t);
    renderSLA();
    render();
  });
}

    <div class="card"><div class="card-header">Document Templates <span class="item-sub" style="font-weight:400;text-transform:none;letter-spacing:0">— preview what prints from the portal</span></div><div class="card-body">

          <td><button class="btn btn-secondary btn-sm" data-doc-preview="cc-print">🖨 Print-blank preview</button> <button class="btn btn-secondary btn-sm" data-doc-preview="cc-fill">✏️ Fill-on-screen preview</button></td>
        </tr>
        <tr>
          <td><strong>Bulk Shipment Packing Slip</strong><div class="item-sub" style="font-weight:400">Single page, letter, with barcode</div></td>
          <td class="item-sub">Printed when a bulk pharmacy-to-pharmacy shipment is created. Includes manifest of all transfers in the box plus a scannable barcode for receiving.</td>
