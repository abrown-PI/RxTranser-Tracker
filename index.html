  const printAttachBtn = document.getElementById('printAttachmentsBtn');
  if (printAttachBtn) printAttachBtn.addEventListener('click', () => {
    askAntShipDateBeforePrint([t], (newDate) => {
      if (newDate) { t.anticipatedShipDate = newDate; apiUpdateTransfer(t); }
      printDocs(getPrintableDocsForTransfer(t));
    });
  });
  const printSummaryBtn = document.getElementById('printSummaryBtn');
  if (printSummaryBtn) printSummaryBtn.addEventListener('click', () => printDocs([{
    summaryHtml: buildSummarySheetHtml(t),
    transferId: t.id, patientName: t.patientName,
    transferMeta: `${t.originLocation} → ${t.fillLocation}${t.transferType==='Refill'?' · Refill':''}`,
    title: 'Transfer Summary'
  }]));
  document.getElementById('editTransferBtn').addEventListener('click', () => {
    // Deep-clone the transfer into the draft so user can cancel without affecting the original
    state.draft = JSON.parse(JSON.stringify(t));
    state.editingTransferId = t.id;
    state.newMode = 'single';
    closeModal();
    document.querySelector('.tab[data-tab=new]').click();
  });
  const deleteBtn = document.getElementById('deleteTransferBtn');
  if (deleteBtn) deleteBtn.addEventListener('click', async () => {
    const confirmed = confirm(`Delete this transfer permanently?\n\nPatient: ${t.patientName}\nRx: ${t.items.map(i => i.drug || i.rxNumber || 'item').filter(Boolean).join(', ')}\n\nThis cannot be undone.`);
    if (!confirmed) return;
    // Remove from in-memory + delete from backend
    const idx = TRANSFERS.findIndex(x => x.id === t.id);
    if (idx !== -1) TRANSFERS.splice(idx, 1);
    await apiDeleteTransfer(t.id);
    logAudit('delete_transfer', 'transfer', t.id);
    closeModal();
    render();
  });
  document.getElementById('postComment').addEventListener('click', async () => {
    const body = document.getElementById('newCommentBody').value.trim();
    if (!body) return;
    const scope = document.getElementById('newCommentScope').value;
    const notify = document.getElementById('notifyTeams').checked;
    t.comments.push({ id: nextId(), itemId: scope ? +scope : null, author: CURRENT_USER.name, ts: new Date().toISOString(), body });
    apiUpdateTransfer(t);
    if (notify) await notifyTeamsAboutQuestion(t, body);
    renderModal();
  });
}

function renderItems(t) {
  const wrap = document.getElementById('itemsList');
  const canFillReceiving = CURRENT_USER.role === 'admin' || CURRENT_USER.location === t.fillLocation;
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:6px 14px;background:var(--primary-bg);border-radius:6px">
      <span style="font-size:12px;color:var(--primary-dark);font-weight:600;text-transform:uppercase;letter-spacing:.03em">Total Rx in transfer</span>
      <span style="font-size:18px;font-weight:700;color:var(--primary-dark)">${t.items.length}</span>
    </div>
  ` + t.items.map(i => `
    <div class="item-row">
      <div class="item-head">
        <div><span class="item-title">${escapeHtml(i.drug||'(no drug name)')}</span> <span class="item-sub">${i.qty?'· '+escapeHtml(i.qty):''} · Origin Rx ${escapeHtml(i.rxNumber||'—')}</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <label style="font-size:11px;color:var(--gray-600);text-transform:uppercase;font-weight:600">Receiving Rx #:</label>
          ${canFillReceiving
            ? `<input data-rcvrx="${i.id}" value="${escapeHtml(i.receivingRxNumber||'')}" placeholder="Type here" style="padding:4px 8px;border:1px solid var(--gray-300);border-radius:4px;font-family:monospace;width:140px" />`
            : `<span style="font-family:monospace;font-size:13px;color:var(--gray-700)">${escapeHtml(i.receivingRxNumber||'—')}</span>`}
        </div>
      </div>
      ${i.notes?`<div style="font-size:12px;color:var(--gray-700);line-height:1.6;padding-top:4px"><strong>Notes:</strong> ${escapeHtml(i.notes)}</div>`:''}
    </div>
  `).join('');
  wrap.querySelectorAll('[data-rcvrx]').forEach(el => {
    el.addEventListener('change', () => {
      const id = +el.dataset.rcvrx;
      const item = t.items.find(x => x.id === id);
      if (item) {
        item.receivingRxNumber = el.value.trim();
        apiUpdateTransfer(t);
      }
    });
  });
}

function renderComments(t) {
  const wrap = document.getElementById('commentsList');
  if (!t.comments.length) { wrap.innerHTML = '<div class="item-sub" style="padding:10px">No messages yet.</div>'; return; }
  wrap.innerHTML = t.comments.map(c => {
    const item = c.itemId ? t.items.find(i => i.id === c.itemId) : null;
    const isOpenQuestion = c.isQuestion && !c.resolved;
    const resolvedBadge = c.isQuestion && c.resolved
      ? `<span class="badge badge-verified" style="font-size:10px">✓ Resolved${c.resolvedBy?` by ${escapeHtml(c.resolvedBy)}`:''}</span>`
      : '';
    const resolveBtn = isOpenQuestion
      ? `<button class="btn btn-secondary btn-sm" data-resolve-comment="${c.id}" style="font-size:11px;padding:2px 8px;margin-left:6px" title="Mark resolved without replying">✓ Mark resolved</button>`
      : '';
    return `<div class="comment">
      <div class="comment-meta">
        <span class="comment-author">${escapeHtml(c.author)}</span>
        <span>${new Date(c.ts).toLocaleString()}</span>
        ${item?`<span class="comment-scope">${escapeHtml(item.drug||'Rx '+item.id)}</span>`:''}
        ${resolvedBadge}
        ${resolveBtn}
      </div>
      <div class="comment-body">${escapeHtml(c.body)}</div>
    </div>`;
  }).join('');
  // Wire up the inline resolve buttons in the comment list
  wrap.querySelectorAll('[data-resolve-comment]').forEach(b => b.onclick = () => {
    const cid = +b.dataset.resolveComment;
    const c = (t.comments||[]).find(x => x.id === cid);
    if (!c) return;
    c.resolved = true;
    c.resolvedBy = CURRENT_USER.name;
    c.resolvedAt = new Date().toISOString();
    apiUpdateTransfer(t);
    renderComments(t);
    updateSLABadge();
  });
}

function editShip(t) {
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.zIndex = 300;
  overlay.innerHTML = `<div class="modal" style="max-width:500px">
    <div class="modal-header"><div class="modal-title">Edit Ship / Tracking</div><button class="modal-close" id="editClose">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid single">
        <div class="form-group"><label>Tx Emailed Date</label><input type="date" id="e-tx" value="${escapeHtml(t.txEmailedDate||'')}" /></div>
        <div class="form-group"><label>Date Received at Fill Location</label><input type="date" id="e-rcvErie" value="${escapeHtml(t.dateReceivedAtErie||'')}" /></div>
        <div class="form-group"><label>Date Shipped</label><input type="date" id="e-dateShipped" value="${escapeHtml(t.dateShipped||'')}" /></div>
        <div class="form-group"><label>Tracking Number</label><div style="padding:8px 10px;background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:4px;font-family:monospace;font-size:13px">${t.trackingNumber ? escapeHtml(t.trackingNumber) : '<span style="color:var(--gray-500);font-style:italic">auto-pulled from FedEx once shipped</span>'}</div></div>
        <div class="form-group"><label>Date Received by Patient</label><input type="date" id="e-rcvPt" value="${escapeHtml(t.dateReceivedByPatient||'')}" /></div>
        <div class="form-group"><label>Paid</label><select id="e-paid">${['Pending','HealNow','Paid','Pay in Store'].map(o=>`<option ${o===t.paid?'selected':''}>${o}</option>`).join('')}</select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="editCancel">Cancel</button>
      <button class="btn btn-primary" id="editSave">Save</button>
    </div>
  </div>`;
  root.appendChild(overlay);
  overlay.querySelector('#editClose').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#editCancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#editSave').addEventListener('click', () => {
    t.txEmailedDate = overlay.querySelector('#e-tx').value || null;
    t.dateReceivedAtErie = overlay.querySelector('#e-rcvErie').value || null;
    t.dateShipped = overlay.querySelector('#e-dateShipped').value || null;
    t.dateReceivedByPatient = overlay.querySelector('#e-rcvPt').value || null;
    t.paid = overlay.querySelector('#e-paid').value;
    apiUpdateTransfer(t);
    overlay.remove();
    renderModal();
    render();
  });
}

// =====================================================================
// Shipments tab
// =====================================================================
const SHIP_STATUS_BADGE = { 'Pending':'badge-new','In Transit':'badge-progress','Delivered':'badge-shipped','Received':'badge-delivered' };

function transferSummary(id) { const t = TRANSFERS.find(x => x.id === id); return t ? `${t.patientName} (${t.items.length} Rx)` : `#${id}`; }

function renderShipments() {
  const root = document.getElementById('view-shipments');
  // Capture which input the user was typing in BEFORE we blow away the DOM
  // (root.innerHTML = ... destroys all child elements and clears focus).
  const wasFocused = (document.activeElement && document.activeElement.id) || null;
  const focusedCaret = (wasFocused && document.activeElement.selectionStart != null) ? document.activeElement.selectionStart : null;
  // direction: '' = both incoming + outgoing, 'in' = only to my location, 'out' = only from my location
  if (!state.shipFilter) state.shipFilter = { direction: '', search: '', dateFrom: '', dateTo: '' };
  // Migrate legacy `mine` flag to the new direction filter
  if (state.shipFilter.mine !== undefined) {
    if (state.shipFilter.mine) state.shipFilter.direction = 'in';
    delete state.shipFilter.mine;
  }
  const myLoc = CURRENT_USER.location;
  const filtered = visibleShipments().filter(s => {
    if (state.shipFilter.direction === 'in' && s.toLocation !== myLoc) return false;
    if (state.shipFilter.direction === 'out' && s.fromLocation !== myLoc) return false;
    if (state.shipFilter.search) {
      const q = state.shipFilter.search.toLowerCase();
      if (!(s.trackingNumber||'').toLowerCase().includes(q) && !s.toLocation.toLowerCase().includes(q) && !s.fromLocation.toLowerCase().includes(q)) return false;
    }
    if (state.shipFilter.dateFrom) { if (!s.shipDate || s.shipDate < state.shipFilter.dateFrom) return false; }
    if (state.shipFilter.dateTo) { if (!s.shipDate || s.shipDate > state.shipFilter.dateTo) return false; }
    return true;
  });
  root.innerHTML = `
    <div class="page-header">
      <div class="page-title">Shipments <span style="font-weight:400;color:var(--gray-500);font-size:14px">(${filtered.length})</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="item-sub" id="fedexStatusPill" style="font-size:12px"></span>
        <button class="btn btn-secondary" id="pullFedexBtn" title="Pull recent shipments from FedEx and auto-match by ship-to address">📦 Pull from FedEx</button>
        <button class="btn btn-primary" id="newShipBtn">+ Create Shipment</button>
      </div>
    </div>

    <div class="scan-bar">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:160px">
        <span class="label">📦 To receive an incoming shipment:</span>
        <span style="font-size:11px;color:var(--gray-600);font-weight:400">Scan barcode here OR find the row below and click Receive</span>
      </div>
      <input id="shipScan" placeholder="Focus here and scan the FedEx barcode (or the packing slip barcode) — opens the shipment to check in" autocomplete="off" />
      <span class="item-sub" id="shipScanHint"></span>
    </div>

    <div class="filters">
      <input placeholder="Filter tracking / location" id="shipSearch" value="${escapeHtml(state.shipFilter.search)}" style="min-width:240px" />
      <div style="display:inline-flex;gap:0;border:1px solid var(--gray-300);border-radius:6px;overflow:hidden">
        <button id="shipDirAll" style="padding:5px 12px;font-size:12px;border:0;background:${state.shipFilter.direction===''?'var(--primary)':'white'};color:${state.shipFilter.direction===''?'white':'var(--gray-700)'};font-weight:600;cursor:pointer">All</button>
        <button id="shipDirIn" style="padding:5px 12px;font-size:12px;border:0;border-left:1px solid var(--gray-300);background:${state.shipFilter.direction==='in'?'var(--success)':'white'};color:${state.shipFilter.direction==='in'?'white':'var(--gray-700)'};font-weight:600;cursor:pointer">← Incoming</button>
        <button id="shipDirOut" style="padding:5px 12px;font-size:12px;border:0;border-left:1px solid var(--gray-300);background:${state.shipFilter.direction==='out'?'var(--primary-dark)':'white'};color:${state.shipFilter.direction==='out'?'white':'var(--gray-700)'};font-weight:600;cursor:pointer">→ Outgoing</button>
      </div>
      <span style="display:flex;align-items:center;gap:6px">
        <label style="font-size:12px;color:var(--gray-600)">Ship date from:</label>
        <input type="date" id="shipDateFrom" value="${escapeHtml(state.shipFilter.dateFrom||'')}" />
        <label style="font-size:12px;color:var(--gray-600)">to:</label>
        <input type="date" id="shipDateTo" value="${escapeHtml(state.shipFilter.dateTo||'')}" />
        ${(state.shipFilter.dateFrom||state.shipFilter.dateTo)?'<button class="btn btn-secondary btn-sm" id="shipDateClear" style="padding:2px 8px;font-size:11px">Clear dates</button>':''}
      </span>
    </div>

    ${filtered.length === 0 ? `<div class="empty"><h3>No shipments match</h3></div>` : `
    <table><thead><tr>
      <th style="width:90px">Direction</th><th>From → To</th><th>Type</th><th>Carrier</th><th>BULK ID</th><th>FedEx Tracking</th><th>Transfers</th><th>Status</th><th>Ship Date</th><th>Delivered</th><th>Action</th>
    </tr></thead><tbody>
      ${filtered.map(s => {
        const isIncoming = s.toLocation === myLoc;
        const isOutgoing = s.fromLocation === myLoc;
        // Show the Receive button only when the box is actually here (Delivered).
        // For In Transit shipments, there's nothing to check in yet.
        const canReceive = isIncoming && s.status === 'Delivered';
        const dirChip = isIncoming
          ? '<span style="display:inline-block;padding:3px 8px;font-size:11px;font-weight:700;background:#dcfce7;color:#166534;border-radius:4px">← Incoming</span>'
          : isOutgoing
            ? '<span style="display:inline-block;padding:3px 8px;font-size:11px;font-weight:700;background:#dbeafe;color:#1e40af;border-radius:4px">→ Outgoing</span>'
            : '<span class="item-sub">—</span>';
        const txCount = (s.transferIds||[]).length;
        return `<tr data-ship="${s.id}">
        <td>${dirChip}</td>
        <td><strong>${escapeHtml(s.fromLocation)}</strong> → ${escapeHtml(s.toLocation)}</td>
        <td>${escapeHtml(s.destinationType)}</td>
        <td>${escapeHtml(s.carrier)}${s.labelGenerated?' <span class="badge badge-verified" style="font-size:10px">Label auto-generated</span>':''}</td>
        <td style="font-family:monospace;font-size:12px">${s.bulkShipmentId?`<span style="color:var(--primary-dark);font-weight:600">${escapeHtml(s.bulkShipmentId)}</span>`:'<span class="item-sub">—</span>'}</td>
        <td style="font-family:monospace;font-size:12px">${escapeHtml(s.trackingNumber||'—')}</td>
        <td><span style="font-weight:600">${txCount}</span> <span class="item-sub" style="font-size:11px">${txCount===1?'transfer':'transfers'}</span></td>
        <td><span class="badge ${SHIP_STATUS_BADGE[s.status]}">${s.status}</span>${s.receivedBy?`<div class="item-sub">by ${escapeHtml(s.receivedBy)}</div>`:''}</td>
        <td>${fmtDate(s.shipDate)}</td>
        <td>${fmtDate(s.deliveredDate)}</td>
        <td>${canReceive?`<button class="btn btn-primary btn-sm" data-receive-btn="${s.id}">📦 Receive</button>`:'<span class="item-sub">—</span>'}</td>
      </tr>`;
      }).join('')}
    </tbody></table>`}
  `;
  document.getElementById('newShipBtn').addEventListener('click', openCreateShipment);
  document.getElementById('pullFedexBtn').addEventListener('click', openFedexPullModal);
  updateFedexStatusPill();
  document.getElementById('shipDirAll').onclick = () => { state.shipFilter.direction = ''; renderShipments(); };
  document.getElementById('shipDirIn').onclick = () => { state.shipFilter.direction = 'in'; renderShipments(); };
  document.getElementById('shipDirOut').onclick = () => { state.shipFilter.direction = 'out'; renderShipments(); };
  document.getElementById('shipSearch').addEventListener('input', e => { state.shipFilter.search = e.target.value; renderShipments(); });
  document.getElementById('shipDateFrom').addEventListener('change', e => { state.shipFilter.dateFrom = e.target.value; renderShipments(); });
  document.getElementById('shipDateTo').addEventListener('change', e => { state.shipFilter.dateTo = e.target.value; renderShipments(); });
  const clrDates = document.getElementById('shipDateClear');
  if (clrDates) clrDates.onclick = () => { state.shipFilter.dateFrom = ''; state.shipFilter.dateTo = ''; renderShipments(); };
  root.querySelectorAll('tr[data-ship]').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.closest('[data-receive-btn]')) return;
    openShipment(+tr.dataset.ship);
  }));
  root.querySelectorAll('[data-receive-btn]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openShipment(+b.dataset['receiveBtn']); }));

  const scan = document.getElementById('shipScan');
  // Restore whichever input had focus before the re-render. If the user was
  // typing in the search box, don't snatch focus back to the scan barcode.
  if (wasFocused && wasFocused !== 'shipScan') {
    const target = document.getElementById(wasFocused);
    if (target) {
      target.focus();
      if (focusedCaret != null && target.setSelectionRange) {
        try { target.setSelectionRange(focusedCaret, focusedCaret); } catch {}
      }
    }
  } else {
    // No prior focus or scan was the active input — auto-focus the scanner
    scan.focus();
  }
  scan.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = scan.value.trim();
    if (!q) return;
    // Try bulk shipment ID first, then tracking number
    const qNorm = q.replace(/\s/g,'').toUpperCase();
    const match = SHIPMENTS.find(s => (s.bulkShipmentId||'').toUpperCase() === qNorm)
               || SHIPMENTS.find(s => (s.trackingNumber||'').replace(/\s/g,'') === q.replace(/\s/g,''));
    if (match) { scan.value=''; document.getElementById('shipScanHint').textContent = ''; openShipment(match.id); }
    else { document.getElementById('shipScanHint').textContent = `✗ No shipment with that barcode "${q}"`; document.getElementById('shipScanHint').style.color = 'var(--danger)'; }
  });
}

function openCreateShipment() {
  const root = document.getElementById('modalRoot');
  // Sort state for the Transfers-to-Include picker (persisted on the modal element so it survives renderUI calls)
  if (!openCreateShipment._sort) openCreateShipment._sort = 'patient';
  const renderUI = () => {
    const destType = document.getElementById('cm-destType')?.value || 'Pharmacy';
    const toLoc = document.getElementById('cm-to')?.value || LOCATIONS[0];
    const antShipBefore = document.getElementById('cm-antBefore')?.value || '';
    let availableTransfers = visibleTransfers().filter(t => {
      if (SHIPMENTS.some(s => s.transferIds.includes(t.id) && s.status !== 'Canceled')) return false;
      // Only In Progress is eligible. New transfers must be processed first.
      if (t.status !== 'In Progress') return false;
      if (t.canceledAt && !t.cancelAcknowledged) return false;
      if (antShipBefore && (!t.anticipatedShipDate || t.anticipatedShipDate > antShipBefore)) return false;
      if (destType === 'Pharmacy') {
        if (t.shipTo !== 'Pharmacy') return false;
        // Regular transfer: shipment heads back to the origin pharmacy.
        if (t.originLocation === toLoc) return true;
        // Pickup-mode order (originating pharmacy = filling pharmacy, patient
        // picks up at a different pharmacy). The box still goes to the pickup
        // pharmacy, so it belongs on that pharmacy's outbound shipment.
        if (t.pickupAtPharmacy && t.pickupLocation === toLoc) return true;
        return false;
      }
      return t.shipTo === 'Patient';
    });
    const sortBy = openCreateShipment._sort;
    availableTransfers.sort((a,b) => {
      if (sortBy === 'patient') return (a.patientName||'').localeCompare(b.patientName||'');
      if (sortBy === 'dateAsc') return new Date(a.createdAt) - new Date(b.createdAt);
      return new Date(b.createdAt) - new Date(a.createdAt); // dateDesc default
    });
    const box = document.getElementById('cm-transfersBox');
    if (!box) return;
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap">
        <div style="font-size:13px;color:var(--gray-600)">
          ${destType === 'Pharmacy' ? `Open transfers headed back to <strong>${escapeHtml(toLoc)}</strong>:` : 'Open transfers shipping directly to patients:'}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <label style="font-size:12px;color:var(--gray-600)">Sort by:</label>
          <select id="cm-sort" style="font-size:12px;padding:4px 6px">
            <option value="patient" ${sortBy==='patient'?'selected':''}>Patient name</option>
            <option value="dateDesc" ${sortBy==='dateDesc'?'selected':''}>Transfer date (newest first)</option>
            <option value="dateAsc" ${sortBy==='dateAsc'?'selected':''}>Transfer date (oldest first)</option>
          </select>
        </div>
      </div>
      ${availableTransfers.length === 0 ? '<div class="item-sub">No open transfers match this destination.</div>' : `
      <div style="max-height:300px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:6px">
        ${availableTransfers.map(t => {
          return `<div class="checkbox-row" style="padding:10px;border-bottom:1px solid var(--gray-100)">
            <input type="checkbox" class="cm-t" value="${t.id}" />
            <div style="flex:1">
              <strong>${escapeHtml(t.patientName)}</strong> <span class="badge ${STATUS_BADGE[t.status]}" style="font-size:10px">${t.status}</span>${t.coldItem?'<span class="badge badge-cold">Cold</span>':''}
              <div class="item-sub">${t.items.length} Rx · ${t.items.map(i=>escapeHtml(i.drug)).join(', ').slice(0,80)}</div>
              <div class="item-sub">Transfer date: ${fmtDate(t.createdAt)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="margin-top:6px"><a href="#" id="cm-selectAll" style="font-size:12px;color:var(--primary)">Select all</a></div>`}
    `;
    const sa = document.getElementById('cm-selectAll');
    if (sa) sa.onclick = e => { e.preventDefault(); document.querySelectorAll('.cm-t').forEach(c => c.checked = true); };
    const sortSel = document.getElementById('cm-sort');
    if (sortSel) sortSel.onchange = e => { openCreateShipment._sort = e.target.value; renderUI(); };
  };

  root.innerHTML = `<div class="modal-overlay" id="cmOverlay"><div class="modal" style="max-width:720px">
    <div class="modal-header"><div class="modal-title">Create Shipment</div><button class="modal-close" id="cmClose">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>From</label><select id="cm-from">${LOCATIONS.map(l=>`<option ${l===CURRENT_USER.location?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="form-group"><label>Destination Type</label><select id="cm-destType"><option>Pharmacy</option><option>Patient</option></select></div>
        <div class="form-group full" id="cm-toWrap"><label>To Pharmacy</label><select id="cm-to">${LOCATIONS.map(l=>`<option>${l}</option>`).join('')}</select><div class="hint">Picking a pharmacy will auto-list that location's open transfers below.</div></div>
        <div class="form-group full"><label>Carrier</label><select id="cm-carrier"><option>FedEx</option><option>UPS</option><option>USPS</option><option>Courier</option></select><div class="hint">Tracking is pulled from FedEx automatically via the Customer Reference field on the WorldShip label — don't type it here.</div></div>
      </div>
      <div class="section">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px">
          <div class="section-title" style="border:none;padding:0;margin:0">Transfers to Include</div>
          <div style="display:flex;align-items:center;gap:6px">
            <label style="font-size:12px;color:var(--gray-600)">Anticipated ship on or before:</label>
            <input type="date" id="cm-antBefore" style="padding:4px 6px;font-size:12px" />
            <button type="button" class="btn btn-secondary btn-sm" id="cm-antClear" style="padding:2px 8px;font-size:11px">Clear</button>
          </div>
        </div>
        <div id="cm-transfersBox"></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" id="cmCancel">Cancel</button><button class="btn btn-primary" id="cmSave">Create Shipment</button></div>
  </div></div>`;

  const close = () => root.innerHTML = '';
  document.getElementById('cmClose').onclick = close;
  document.getElementById('cmCancel').onclick = close;
  document.getElementById('cmOverlay').onclick = e => { if (e.target.id === 'cmOverlay') close(); };
  document.getElementById('cm-destType').onchange = () => {
    const destType = document.getElementById('cm-destType').value;
    const wrap = document.getElementById('cm-toWrap');
    if (destType === 'Patient') {
      wrap.innerHTML = '<label>Destination</label><input value="Patient (direct ship)" disabled /><input type="hidden" id="cm-to" value="Patient" />';
    } else {
      wrap.innerHTML = `<label>To Pharmacy</label><select id="cm-to">${LOCATIONS.map(l=>`<option>${l}</option>`).join('')}</select><div class="hint">Picking a pharmacy will auto-list that location's open transfers below.</div>`;
      document.getElementById('cm-to').onchange = renderUI;
    }
    renderUI();
  };
  document.getElementById('cm-to').onchange = renderUI;
  document.getElementById('cm-antBefore').onchange = renderUI;
  document.getElementById('cm-antClear').onclick = () => { document.getElementById('cm-antBefore').value = ''; renderUI(); };
  document.getElementById('cmSave').onclick = () => {
    const picks = [...document.querySelectorAll('.cm-t:checked')].map(c => +c.value);
    if (!picks.length) { alert('Select at least one transfer.'); return; }
    // No tracking entry here — the box always starts Pending. Worker enters the
    // BULK ID into WorldShip's Customer Reference, and the FedEx auto-match cron
    // populates the tracking number + flips the linked transfers to Shipped later.
    const destType = document.getElementById('cm-destType').value;
    const toLoc = document.getElementById('cm-to').value;
    const shipDate = todayLocal();
    const s = {
      id: nextId(),
      fromLocation: document.getElementById('cm-from').value,
      toLocation: toLoc,
      destinationType: destType,
      carrier: document.getElementById('cm-carrier').value,
      trackingNumber: '', labelGenerated: false,
      status: 'Pending',
      shipDate: null,
      deliveredDate: null, receivedDate: null, receivedBy: null,
      transferIds: picks,
      // Bulk shipments to a pharmacy get a printable BULK-* ID + packing slip
      bulkShipmentId: destType === 'Pharmacy' ? generateBulkShipmentId(toLoc, shipDate) : null,
      isBulk: destType === 'Pharmacy',
      createdAt: new Date().toISOString(), createdBy: CURRENT_USER.name,
      unpacked: {}, damagePhotos: []
    };
    SHIPMENTS.unshift(s);
    apiSaveShipment(s);
    // Fire email notification to the receiving location (or fill location for patient ships)
    const shippedTransfers = picks.map(id => TRANSFERS.find(x => x.id === id)).filter(Boolean);
    fetch('/api/send-shipment-notification', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shipment: s, transfers: shippedTransfers })
    }).catch(e => console.warn('notification failed', e));
    close();
    if (s.isBulk) {
      alert(
        `Bulk shipment ${s.bulkShipmentId} created with ${picks.length} transfer(s).\n\n` +
        `📋 When you're ready to ship, open the shipment and click "Print Packing Slip".\n\n` +
        `When creating the FedEx label in WorldShip, enter\n\n` +
        `        ${s.bulkShipmentId}\n\n` +
        `into the Customer Reference field. The app will auto-pull the tracking number once FedEx scans the package.`
      );
    } else {
      alert('Shipment created.\n\nNotification email sent.');
    }
    render();
  };
  renderUI();
}

// EOD shipping flow: append more transfers to a Pending bulk shipment.
// Eligible transfers are the same set the create-shipment picker uses, minus
// ones already in any non-Canceled shipment (including this one). Pharmacy
// destinations are restricted to the matching origin pharmacy of the shipment.
function openAddTransfersToShipment(shipmentId) {
  const s = SHIPMENTS.find(x => x.id === shipmentId);
  if (!s) return;
  const alreadyInThis = new Set(s.transferIds);
  const eligible = visibleTransfers().filter(t => {
    if (alreadyInThis.has(t.id)) return false;
    if (SHIPMENTS.some(other => other.transferIds.includes(t.id) && other.status !== 'Canceled')) return false;
    if (t.status !== 'In Progress') return false;
    if (t.canceledAt && !t.cancelAcknowledged) return false;
    if (s.destinationType === 'Pharmacy') {
      if (t.shipTo !== 'Pharmacy') return false;
      if (t.originLocation === s.toLocation) return true;
      if (t.pickupAtPharmacy && t.pickupLocation === s.toLocation) return true;
      return false;
    }
    return t.shipTo === 'Patient';
  }).sort((a, b) => (a.patientName || '').localeCompare(b.patientName || ''));

  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="addOverlay"><div class="modal" style="max-width:620px">
    <div class="modal-header"><div><div class="modal-title">Add Transfers to ${escapeHtml(s.bulkShipmentId || ('Shipment ' + s.id))}</div><div class="item-sub">${escapeHtml(s.fromLocation)} → ${escapeHtml(s.toLocation)}</div></div><button class="modal-close" id="addClose">&times;</button></div>
    <div class="modal-body">
      ${eligible.length === 0 ? `<div class="empty"><h3>No eligible transfers</h3><p>No open ${s.destinationType === 'Pharmacy' ? 'transfers headed to ' + escapeHtml(s.toLocation) : 'patient ship transfers'} are available to add right now.</p></div>` : `
      <div class="item-sub" style="margin-bottom:8px">Check the transfers to add. Each transfer can only be in one Pending shipment at a time.</div>
      <div style="max-height:380px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:6px">
        ${eligible.map(t => `<div class="checkbox-row" style="padding:10px;border-bottom:1px solid var(--gray-100)">
          <input type="checkbox" class="add-t" value="${t.id}" />
          <div style="flex:1">
            <strong>${escapeHtml(t.patientName)}</strong> <span class="badge ${STATUS_BADGE[t.status]}" style="font-size:10px">${t.status}</span>${t.coldItem?'<span class="badge badge-cold">Cold</span>':''}
            <div class="item-sub">${t.items.length} Rx · ${escapeHtml(t.items.map(i=>i.drug).join(', ').slice(0,80))}</div>
            <div class="item-sub">Transfer date: ${fmtDate(t.createdAt)}</div>
          </div>
        </div>`).join('')}
      </div>
      <div style="margin-top:6px"><a href="#" id="add-selectAll" style="font-size:12px;color:var(--primary)">Select all</a></div>`}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="addCancel">Cancel</button>
      ${eligible.length > 0 ? '<button class="btn btn-primary" id="addSave">Add to Shipment</button>' : ''}
    </div>
  </div></div>`;

  const back = () => openShipment(shipmentId);
  document.getElementById('addClose').onclick = back;
  document.getElementById('addCancel').onclick = back;
  document.getElementById('addOverlay').onclick = e => { if (e.target.id === 'addOverlay') back(); };
  const sa = document.getElementById('add-selectAll');
  if (sa) sa.onclick = e => { e.preventDefault(); document.querySelectorAll('.add-t').forEach(c => c.checked = true); };
  const saveBtn = document.getElementById('addSave');
  if (saveBtn) saveBtn.onclick = () => {
    const picks = [...document.querySelectorAll('.add-t:checked')].map(c => +c.value);
    if (!picks.length) { alert('Pick at least one transfer to add.'); return; }
    s.transferIds = [...s.transferIds, ...picks];
    apiUpdateShipment(s);
    openShipment(shipmentId);
  };
}

function openShipment(id) {
  const s = SHIPMENTS.find(x => x.id === id);
  if (!s) return;
  if (!s.unpacked) s.unpacked = {};
  if (!s.damagePhotos) s.damagePhotos = [];
  const root = document.getElementById('modalRoot');
  const manifest = s.transferIds.map(tid => TRANSFERS.find(t => t.id === tid)).filter(Boolean);
  const allItems = manifest.flatMap(t => t.items.map(i => ({t, i})));
  const isReceiver = (s.toLocation === CURRENT_USER.location || CURRENT_USER.role === 'admin') && s.status !== 'Received';
  // EOD shipping workflow: when the box is still Pending (no tracking yet), the originating
  // pharmacy can add/remove transfers throughout the day and print the packing slip at EOD.
  const isPendingBulk = s.isBulk && s.status === 'Pending';
  const canEditPending = isPendingBulk && (s.fromLocation === CURRENT_USER.location || CURRENT_USER.role === 'admin');
  const unpackedCount = allItems.filter(({i}) => s.unpacked[i.id]).length;
  const allUnpacked = allItems.length > 0 && unpackedCount === allItems.length;
  const printBtnLabel = isPendingBulk ? '🖨 Print Packing Slip' : '🖨 Reprint Packing Slip';

  root.innerHTML = `<div class="modal-overlay" id="smOverlay"><div class="modal">
    <div class="modal-header"><div><div class="modal-title">${s.bulkShipmentId?escapeHtml(s.bulkShipmentId):'Shipment ' + escapeHtml(s.trackingNumber)}</div><div class="item-sub">${escapeHtml(s.fromLocation)} → ${escapeHtml(s.toLocation)} · ${escapeHtml(s.carrier)}${s.bulkShipmentId?` · Tracking ${escapeHtml(s.trackingNumber||'(pending)')}`:''}</div></div><div style="display:flex;gap:8px;align-items:center">${s.isBulk?`<button class="btn btn-secondary btn-sm" id="reprintSlip">${printBtnLabel}</button>`:''}<button class="modal-close" id="smClose">&times;</button></div></div>
    <div class="modal-body">
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
        <span class="badge ${SHIP_STATUS_BADGE[s.status]}">${s.status}</span>
        <div><strong>Ship:</strong> ${fmtDate(s.shipDate)}</div>
        <div><strong>Delivered:</strong> ${fmtDate(s.deliveredDate)}</div>
        <div><strong>Received:</strong> ${fmtDate(s.receivedDate)}${s.receivedBy?` by ${escapeHtml(s.receivedBy)}`:''}</div>
        ${isReceiver?`<div style="flex:1"></div><span class="pill-warn">📦 Headed to your location — unpack below</span>`:''}
      </div>

      ${canEditPending ? `
      <div style="background:var(--primary-bg);border:1px solid var(--primary-light);padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;font-size:13px">
        <strong>Pending box — keep adding orders throughout the day.</strong> Click <em>Print Packing Slip</em> at end of day. Tracking will auto-pull from FedEx once you scan in WorldShip.
      </div>` : ''}

      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="section-title" style="margin:0">Manifest (${manifest.length} transfer${manifest.length!==1?'s':''}, ${allItems.length} Rx)${isReceiver?` — ${unpackedCount}/${allItems.length} unpacked`:''}</div>
        ${canEditPending ? `<button class="btn btn-primary btn-sm" id="sm-addTransfers">+ Add transfers</button>` : ''}
      </div>
      ${isReceiver && s.status === 'In Transit' ? `
      <div style="background:var(--warning-bg);border:1px solid var(--warning);padding:12px 14px;border-radius:var(--radius);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><strong>Package in transit.</strong> Once the box arrives at your pharmacy, click <em>"Arrived at my pharmacy"</em> to start unpacking.</div>
        <button class="btn btn-primary btn-sm" id="sm-arrived">📦 Arrived at my pharmacy</button>
      </div>` : ''}

      ${manifest.map(t => `<div class="item-row">
        <div class="item-head">
          <div><strong>${escapeHtml(t.patientName)}</strong> <span class="item-sub">· DOB ${fmtDate(t.patientDOB)}</span></div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-sm" data-open-t="${t.id}">Open transfer</button>
            ${canEditPending ? `<button class="btn btn-secondary btn-sm" data-rm-t="${t.id}" title="Remove from this shipment" style="color:var(--danger)">× Remove</button>` : ''}
          </div>
        </div>
        ${t.items.map(i => isReceiver && s.status === 'Delivered'
          ? `<div class="checkbox-row" style="padding:6px 4px;border-bottom:1px solid var(--gray-100)">
               <input type="checkbox" data-unpack="${i.id}" ${s.unpacked[i.id]?'checked':''} />
               <div style="flex:1"><strong>${escapeHtml(i.drug)}</strong> <span class="item-sub">· ${escapeHtml(i.qty||'')} · Rx ${escapeHtml(i.rxNumber||'—')}</span></div>
             </div>`
          : `<div style="font-size:13px;padding:4px 0">• ${escapeHtml(i.drug)} — ${escapeHtml(i.qty||'')} · Rx ${escapeHtml(i.rxNumber||'—')}</div>`
        ).join('')}
      </div>`).join('')}

      ${isReceiver && s.status === 'Delivered'?`
      <div class="section" style="padding-top:14px;border-top:1px solid var(--gray-200)">
        <div class="section-title">📷 Scan Rx barcode (optional)</div>
        <input id="sm-scan" placeholder="Focus here and scan to auto-check items" style="width:100%;padding:9px;border:1px solid var(--gray-300);border-radius:6px;font-family:monospace" />
        <div class="item-sub" id="sm-scanHint"></div>
      </div>
      <div class="section">
        <div class="section-title">Damage / Condition Photos (optional)</div>
        <input type="file" accept="image/*" capture="environment" multiple id="sm-photo" />
        ${s.damagePhotos.length?`<div class="photo-strip">${s.damagePhotos.map((p,idx)=>`<div class="photo-thumb" style="background-image:url('${p.dataUrl}')"><button class="rm" data-rmphoto="${idx}">×</button></div>`).join('')}</div>`:''}
      </div>`:''}
    </div>
    <div class="modal-footer">
      ${canEditPending ? '<button class="btn btn-secondary" id="sm-cancel" style="color:var(--danger);border-color:var(--danger)">🗑 Cancel Shipment</button>' : ''}

      <button class="btn btn-secondary" id="smCloseBtn">Close</button>
      ${isReceiver && s.status === 'Delivered'?`<button class="btn ${allUnpacked?'btn-primary':'btn-secondary'}" id="sm-receive" ${!allUnpacked?'disabled style="opacity:.5;cursor:not-allowed"':''}>Mark Package Received (all Rx checked)</button>`:''}
    </div>
  </div></div>`;

  const close = () => root.innerHTML = '';
  document.getElementById('smClose').onclick = close;
  document.getElementById('smCloseBtn').onclick = close;
  const cancelBtn = document.getElementById('sm-cancel');
  if (cancelBtn) cancelBtn.onclick = () => {
    if (!confirm(`Cancel shipment ${s.bulkShipmentId || s.id}?\n\nThe ${s.transferIds.length} transfer(s) in this box will be released and become available to add to a new shipment. This can't be undone.`)) return;
    apiDeleteShipment(s.id);
    const idx = SHIPMENTS.indexOf(s);
    if (idx !== -1) SHIPMENTS.splice(idx, 1);
    close();
    render();
  };
  const reprintBtn = document.getElementById('reprintSlip');
  if (reprintBtn) reprintBtn.onclick = () => printPackingSlip(s);
  document.getElementById('smOverlay').onclick = e => { if (e.target.id === 'smOverlay') close(); };
  root.querySelectorAll('[data-open-t]').forEach(b => b.onclick = () => { close(); openTransfer(+b.dataset['openT']); });
  root.querySelectorAll('[data-rm-t]').forEach(b => b.onclick = () => {
    const tid = +b.dataset['rmT'];
    if (!confirm('Remove this transfer from the shipment? It can be added back later.')) return;
    s.transferIds = s.transferIds.filter(id => id !== tid);
    apiUpdateShipment(s);
    openShipment(s.id);
  });
  const addBtn = document.getElementById('sm-addTransfers');
  if (addBtn) addBtn.onclick = () => openAddTransfersToShipment(s.id);
  root.querySelectorAll('[data-unpack]').forEach(cb => cb.onchange = e => { s.unpacked[+cb.dataset.unpack] = e.target.checked; apiUpdateShipment(s); openShipment(s.id); });
  const arrived = document.getElementById('sm-arrived');
  if (arrived) arrived.onclick = () => {
    s.status = 'Delivered'; s.deliveredDate = todayLocal();
    apiUpdateShipment(s);
    openShipment(s.id);
  };
  const rec = document.getElementById('sm-receive');
  if (rec) rec.onclick = () => {
    s.status = 'Received'; s.receivedDate = todayLocal(); s.receivedBy = CURRENT_USER.name;
    apiUpdateShipment(s);
    // Cascade Received status + receipt info to every transfer in the package
    s.transferIds.forEach(id => {
      const t = TRANSFERS.find(x => x.id === id);
      if (t) {
        t.status = 'Received';
        t.dateReceivedByPatient = s.receivedDate;
        t.receivedBy = CURRENT_USER.name;
        apiUpdateTransfer(t);
        logAudit('mark_received', 'transfer', t.id, { shipmentId: s.id });
      }
    });
    close();
    alert(`Marked received — ${s.transferIds.length} transfer${s.transferIds.length===1?'':'s'} updated.`);
    render();
  };
  const photoEl = document.getElementById('sm-photo');
  if (photoEl) photoEl.onchange = () => {
    [...photoEl.files].forEach(file => {
      const rd = new FileReader();
      rd.onload = ev => { s.damagePhotos.push({ name: file.name, dataUrl: ev.target.result, uploadedBy: CURRENT_USER.name, ts: new Date().toISOString() }); apiUpdateShipment(s); openShipment(s.id); };
      rd.readAsDataURL(file);
    });
  };
  root.querySelectorAll('[data-rmphoto]').forEach(b => b.onclick = () => { s.damagePhotos.splice(+b.dataset.rmphoto, 1); apiUpdateShipment(s); openShipment(s.id); });
  const scanInput = document.getElementById('sm-scan');
  if (scanInput) {
    scanInput.focus();
    scanInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = scanInput.value.trim();
      if (!q) return;
      let hit = false;
      allItems.forEach(({i}) => { if (i.rxNumber === q) { s.unpacked[i.id] = true; hit = true; } });
      document.getElementById('sm-scanHint').textContent = hit ? `✔ Matched "${q}"` : `✗ No Rx # match for "${q}"`;
      document.getElementById('sm-scanHint').style.color = hit ? 'var(--success)' : 'var(--danger)';
      scanInput.value = '';
      if (hit) openShipment(s.id);
    });
  }
}

// =====================================================================
// Bulk upload + review queue
// Drafts live in Azure Table Storage (location-scoped) so everyone at the
// uploader's pharmacy can see + work on the queue. Page images get uploaded
// to Blob Storage so they persist + are visible across users.
// =====================================================================

// Upload a base64 blob to /api/blobs. Returns the blob name (NOT the URL).
async function uploadBlob(base64, contentType, prefix) {
  try {
    const r = await fetch('/api/blobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: base64, contentType, prefix })
    });
    if (!r.ok) throw new Error('Upload failed: ' + r.status);
    const data = await r.json();
    return data.name;
  } catch (e) { console.warn('uploadBlob failed', e); return null; }
}

// Build a URL the browser can use to fetch a stored blob.
// Note: don't URL-encode the slash in the name — the function route is catch-all
// ({*name}) and matches the literal slashes between prefix and filename. Encoding
// the slash as %2F breaks Azure Functions route extraction. Other URL-unsafe chars
// shouldn't appear in our server-generated blob names (timestamp + hex + ext).
function blobUrl(name) { return location.origin + '/api/blobs/' + String(name).split('/').map(encodeURIComponent).join('/'); }

// Save / load / delete bulk drafts via the backend. Drafts are scoped by location;
// users at the same pharmacy see each other's queue.
async function apiSaveBulkDraft(b) {
  try {
    const r = await fetch('/api/bulk-drafts', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-user-email': (CURRENT_USER && CURRENT_USER.email) || '' },
      body: JSON.stringify(b)
    });
    if (!r.ok) throw new Error('Save failed: ' + r.status);
  } catch (e) { console.warn('apiSaveBulkDraft failed', e); }
}
async function apiUpdateBulkDraft(b) {
  try {
    await fetch('/api/bulk-drafts/' + encodeURIComponent(b.id), {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-user-email': (CURRENT_USER && CURRENT_USER.email) || '' },
      body: JSON.stringify(b)
    });
  } catch (e) { console.warn('apiUpdateBulkDraft failed', e); }
}
async function apiDeleteBulkDraft(id) {
  try { await fetch('/api/bulk-drafts/' + encodeURIComponent(id), { method: 'DELETE' }); }
  catch (e) { console.warn('apiDeleteBulkDraft failed', e); }
}
async function apiLoadBulkDrafts() {
  try {
    const loc = (CURRENT_USER && CURRENT_USER.role !== 'admin') ? (CURRENT_USER.location || '') : '';
    const url = loc ? '/api/bulk-drafts?location=' + encodeURIComponent(loc) : '/api/bulk-drafts';
    const r = await fetch(url);
    if (!r.ok) throw new Error('Load failed: ' + r.status);
    const data = await r.json();
    return data.drafts || [];
  } catch (e) { console.warn('apiLoadBulkDrafts failed', e); return []; }
}

// Persist the entire queue (any-time helper for the existing mutation points)
async function saveBulkQueue() {
  // Save each draft individually so partial failures don't lose data
  for (const b of (state.bulkQueue || [])) {
    await apiUpdateBulkDraft(b);
  }
}
// Compatibility shim — older code calls this on init
function loadBulkQueueSync() {
  // Returns empty; the async load is kicked off in renderBulkUpload
  return state.bulkQueue || [];
}
function bulkDraftStatus(b) {
  if (b.parseError) return 'failed';
  const d = b.draft;
  if (!d.patientName || !d.pkSheets.length) return 'partial';
  // Items considered "complete" if at least one row has an Rx# or drug
  if (!d.items.some(i => i.rxNumber || i.drug)) return 'partial';
  return 'ok';
}
function bulkDraftMissing(b) {
  const m = [];
  const d = b.draft;
  if (!d.patientName) m.push('patient name');
  if (!d.pkSheets.length) m.push('PK sheet upload');
  if (!d.items.some(i => i.rxNumber || i.drug)) m.push('at least one Rx');
  if (d.billing === 'CreditCard' && !d.ccOnFileInPaladin && !d.ccForm) m.push('CC auth form (or check on-file)');
  return m;
}

            return `<tr ${b.dupGroup?'style="background:var(--info-bg)"':''}>
              <td>${badge}</td>
              <td><strong>${escapeHtml(d.patientName||'(no name)')}</strong>${b.dupGroup?`<div class="item-sub" style="color:var(--info)">Group ${b.dupGroup} — possible same patient</div>`:''}</td>
              <td>${escapeHtml(firstItem.rxNumber||'—')}${d.items.length>1?` <span class="item-sub">+${d.items.length-1}</span>`:''}</td>
              <td>${escapeHtml(firstItem.drug||'—')}</td>
              <td>${escapeHtml(d.originLocation)} → ${escapeHtml(d.fillLocation)}</td>
              <td>${escapeHtml(d.shipTo)}</td>
              <td><span class="item-sub" style="font-size:11px">${escapeHtml((b.sourceFile||'').slice(0,30))}${(b.sourceFile||'').length>30?'…':''}</span></td>
              <td style="white-space:nowrap">
                <button class="btn btn-secondary btn-sm" data-edit="${b.id}">Edit</button>
                ${s==='ok'?`<button class="btn btn-primary btn-sm" data-approve="${b.id}">Approve</button>`:''}
                <button class="btn btn-secondary btn-sm" data-reject="${b.id}" title="Remove from queue">✗</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div></div>
    `}
  `;
  document.getElementById('modeSingle').onclick = () => { state.newMode = 'single'; renderNewForm(); };
  document.getElementById('modeBulk').onclick = () => { state.newMode = 'bulk'; renderNewForm(); };
  document.getElementById('bulk-pick').onchange = e => processBulkFiles([...e.target.files]);

  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { state.bulkEditingId = +b.dataset.edit; renderNewForm(); });
  root.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => {
    const id = +b.dataset.reject;
    state.bulkQueue = state.bulkQueue.filter(x => x.id !== id);
    apiDeleteBulkDraft(id);
    renderNewForm();
  });
  root.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approveBulkDraft(+b.dataset.approve));
  const approveAll = document.getElementById('bulk-approveAll');
  if (approveAll) approveAll.onclick = () => {
    const ready = state.bulkQueue.filter(b => bulkDraftStatus(b) === 'ok');
    ready.forEach(b => approveBulkDraft(b.id, true));
    saveBulkQueue();
    alert(`Approved ${ready.length} transfer(s) into the tracker.`);
    renderNewForm();
    render();
  };
  const clearAll = document.getElementById('bulk-clearAll');
  if (clearAll) clearAll.onclick = async () => {
    if (state.bulkQueue.length && !confirm(`Clear all ${state.bulkQueue.length} pending drafts? Nothing will be saved.`)) return;
    const ids = state.bulkQueue.map(b => b.id);
    state.bulkQueue = [];
    for (const id of ids) await apiDeleteBulkDraft(id);
    renderNewForm();
  };
}

// Extract text from a PDF page-by-page. Returns [{ pageNum, text }] or null if pdf.js
// is unavailable / the file isn't a parseable PDF.
async function extractPdfTextPerPage(file) {
  if (!window.pdfjsLib || !file) return null;
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      pages.push({ pageNum: p, text: tc.items.map(i => i.str).join(' ') });
    }
    return pages;
  } catch (e) { console.warn('extractPdfTextPerPage failed', e); return null; }
}

// Rasterize a PDF page to a base64 PNG. Used as input to the Vision OCR endpoint when
// pdf.js text extraction returns nothing (i.e., the PDF is image-only / scanned).
// Scale 1.5 gives ~110 DPI — good enough for OCR accuracy without blowing up the payload.
// Re-uses a pdf document handle (passed in) to avoid re-parsing the whole file per page.
async function rasterizePdfPageToBase64(pdf, pageNum, scale = 1.5) {
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const dataUrl = canvas.toDataURL('image/png');
  return dataUrl.split(',')[1]; // strip "data:image/png;base64,"
}

// Call the backend OCR endpoint with a base64 PNG and return parsed fields.
async function ocrParsePage(base64Png) {
  const r = await fetch('/api/parse-transfer-vision', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: base64Png, mediaType: 'image/png' })
  });
  if (!r.ok) {
    const data = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
    throw new Error(data.error || 'OCR failed');
  }
  return r.json();
}

// Group pages of a PDF into transfers. We try several markers because pdf.js text
// extraction can be quirky — sometimes words run together ("PATIENTRxTRANSFER") and
// sometimes there's whitespace + page-break noise between them.
// A page that has any of these markers starts a new transfer:
//   - "PATIENT Rx TRANSFER INFORMATION" or variants
//   - "TRANSFER INFORMATION"
//   - "For patient:" header (every transfer info page has this)
// Pages without markers are attached as hard-copy/order-form pages to the prior transfer.
function pageIsTransferStart(text) {
  if (!text) return false;
  return /TRANSFER\s*INFORMATION/i.test(text)
      || /For\s*patient\s*:/i.test(text);
}
function groupPdfPagesIntoTransfers(pages) {
  const groups = [];
  let current = null;
  pages.forEach(p => {
    if (pageIsTransferStart(p.text)) {
      if (current) groups.push(current);
      current = { transferPage: p, hardCopyPages: [] };
    } else if (current) {
      current.hardCopyPages.push(p);
    }
  });
  if (current) groups.push(current);
  // Diagnostic logging when detection fails. Patient text is not logged — only
  // structural counts — so this is safe to leave on in production.
  if (groups.length === 0) {
    console.log('PDF text extraction: no transfer markers found', { pages: pages.length, charsPerPage: pages.map(p => (p.text||'').length) });
  }
  return groups;
}

async function processBulkFiles(rawFiles) {
  const hint = document.getElementById('bulk-pickHint');
  if (hint) hint.textContent = `Processing ${rawFiles.length} file(s)…`;
  let _bulkId = (state.bulkQueue || []).reduce((m,b) => Math.max(m, b.id), 1000);
  const newDrafts = [];
  // Bulk-level defaults applied to every draft created in this batch
  const bulkFill = (document.getElementById('bulk-fillLocation') || {}).value || '';
  const bulkAntShip = (document.getElementById('bulk-anticipatedShip') || {}).value || '';
  const applyBulkDefaults = (draft) => {
    if (bulkFill) draft.fillLocation = bulkFill;
    if (bulkAntShip) draft.anticipatedShipDate = bulkAntShip;
  };
  for (const file of rawFiles) {
    if (!/\.pdf$/i.test(file.name)) {
      // Non-PDF: keep the old single-draft behavior
      const draft = freshDraft();
      applyBulkDefaults(draft);
      draft.pkSheets = [{ name: file.name, size: file.size, type: file.type }];
      newDrafts.push({ id: ++_bulkId, draft, sourceFile: file.name, parseError: 'Not a PDF — auto-parse not supported for this file type.', parsed: null });
      continue;
    }

    const pages = await extractPdfTextPerPage(file);
    if (!pages || pages.length === 0) {
      const draft = freshDraft();
      applyBulkDefaults(draft);
      draft.pkSheets = [{ name: file.name, size: file.size, type: file.type }];
      newDrafts.push({ id: ++_bulkId, draft, sourceFile: file.name, parseError: 'Could not read PDF text — may be image-only.', parsed: null });
      continue;
    }

    const groups = groupPdfPagesIntoTransfers(pages);

    if (groups.length === 0) {
      // pdf.js couldn't find markers (image-only PDF or unrecognized layout) — try OCR fallback.
      // We rasterize each page to PNG and send to /api/parse-transfer-vision (Azure AI Doc Intel).
      if (hint) hint.textContent = `Pdf has no extractable text — running OCR on ${pages.length} page(s)…`;
      // Open the PDF ONCE so we don't re-parse on every page
      let pdf = null;
      try {
        const buf = await file.arrayBuffer();
        pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      } catch (e) { console.warn('Could not open PDF for rasterization', e); }
      const ocrPages = [];
      const ocrErrors = [];
      if (pdf) {
        // Pace requests to stay safely under Doc Intel rate limits.
        const PACING_MS = 500;
        for (let p = 1; p <= pages.length; p++) {
          if (hint) hint.textContent = `OCR page ${p} of ${pages.length}…`;
          try {
            const base64 = await rasterizePdfPageToBase64(pdf, p);
            // Upload to blob storage IN PARALLEL with OCR call (Promise.all) so users at the
            // same location can view pages even before approval. Blob name persists with the draft.
            const [blobName, result] = await Promise.all([
              uploadBlob(base64, 'image/png', 'pages'),
              ocrParsePage(base64)
            ]);
            ocrPages.push({
              pageNum: p,
              blobName,
              _pngDataUrl: 'data:image/png;base64,' + base64, // in-memory fallback for instant render
              ...result
            });
            // Diagnostic log — counts only, no patient text or Rx data, to avoid PHI in
            // browser console / dev tools / screen-share recordings.
            console.log(`OCR page ${p}: isTransferSheet=${result.isTransferSheet}`, {
              hasPatientName: !!result.patientName,
              hasRxNumber: !!result.rxNumber,
              signals: result._signals,
              rawCharCount: (result.rawText || '').length
            });
          } catch (e) {
            console.warn('OCR failed for page ' + p + ':', e.message || e);
            ocrErrors.push(`page ${p}: ${e.message || e}`);
          }
          if (p < pages.length) await new Promise(r => setTimeout(r, PACING_MS));
        }
      }
      if (ocrPages.length > 0) {
        // Group OCR'd pages into transfers using the same logic, but on the OCR text + isTransferSheet flag
        const ocrGroups = [];
        let current = null;
        ocrPages.forEach(p => {
          if (p.isTransferSheet) {
            if (current) ocrGroups.push(current);
            current = { transferPage: p, hardCopyPages: [] };
          } else if (current) {
            current.hardCopyPages.push(p);
          }
        });
        if (current) ocrGroups.push(current);
        if (ocrGroups.length > 0) {
          ocrGroups.forEach((g, idx) => {
            const draft = freshDraft();
            applyBulkDefaults(draft);
            const transferPageRange = `page ${g.transferPage.pageNum}`;
            const hardCopyPageRange = g.hardCopyPages.length ? `pages ${g.hardCopyPages.map(p => p.pageNum).join(',')}` : null;
            draft.pkSheets = [{ name: `${file.name} [${transferPageRange}, OCR]`, size: file.size, type: file.type }];
            if (hardCopyPageRange) draft.hardCopies = [{ name: `${file.name} [${hardCopyPageRange}, OCR]`, size: file.size, type: file.type }];
            const f = g.transferPage;
            if (f.patientName) draft.patientName = f.patientName;
            if (f.patientDOB) draft.patientDOB = f.patientDOB;
            if (f.shipAddr1) draft.shipAddr1 = f.shipAddr1;
            if (f.shipCity) draft.shipCity = f.shipCity;
            if (f.shipState) draft.shipState = f.shipState;
            if (f.shipZip) draft.shipZip = f.shipZip;
            const first = draft.items[0];
            if (f.rxNumber) first.rxNumber = f.rxNumber;
            if (f.drug) first.drug = f.drug;
            if (f.qty) first.qty = f.qty;
            // Page images: store BOTH the blob name (permanent, viewable by anyone) AND the
            // in-memory dataUrl (used for instant render before the blob is fetched).
            const pagePngs = [g.transferPage, ...g.hardCopyPages]
              .filter(p => p._pngDataUrl || p.blobName)
              .map(p => ({
                pageNum: p.pageNum,
                blobName: p.blobName || null,
                dataUrl: p._pngDataUrl || null,
                kind: p === g.transferPage ? 'transfer' : 'hardcopy'
              }));
            newDrafts.push({
              id: ++_bulkId, draft,
              sourceFile: `${file.name} (${idx+1}/${ocrGroups.length}, OCR)`,
              parseError: null, parsed: f,
              pageImages: pagePngs
            });
          });
          continue;
        }
        // OCR'd but still no transfer-sheet pages detected — fall through to single-draft error case
        const draft = freshDraft();
        applyBulkDefaults(draft);
        draft.pkSheets = [{ name: file.name + ' [OCR]', size: file.size, type: file.type }];
        newDrafts.push({ id: ++_bulkId, draft, sourceFile: file.name + ' (OCR)', parseError: 'OCR ran but no transfer header detected on any page.', parsed: null });
        continue;
      }
      // All OCR attempts failed (not configured / network / image too small / etc.)
      const totalChars = pages.reduce((n, p) => n + (p.text||'').length, 0);
      const errorSummary = ocrErrors.length ? ` First error: ${ocrErrors[0]}` : '';
      const reason = totalChars < 50
        ? `PDF is image-only and OCR failed on every page.${errorSummary}`
        : `No transfer header detected in ${pages.length} page(s). OCR fallback also failed.${errorSummary}`;
      const draft = freshDraft();
      applyBulkDefaults(draft);
      draft.pkSheets = [{ name: file.name, size: file.size, type: file.type }];
      newDrafts.push({ id: ++_bulkId, draft, sourceFile: file.name, parseError: reason, parsed: null });
      continue;
    }

    // Create one draft per detected transfer
    groups.forEach((g, idx) => {
      const draft = freshDraft();
      applyBulkDefaults(draft);
      const parsed = parseTransferSheet(g.transferPage.text);
      const transferPageRange = `page ${g.transferPage.pageNum}`;
      const hardCopyPageRange = g.hardCopyPages.length ? `pages ${g.hardCopyPages.map(p => p.pageNum).join(',')}` : null;
      draft.pkSheets = [{ name: `${file.name} [${transferPageRange}]`, size: file.size, type: file.type }];
      if (hardCopyPageRange) {
        draft.hardCopies = [{ name: `${file.name} [${hardCopyPageRange}]`, size: file.size, type: file.type }];
      }
      if (parsed) {
        if (parsed.patientName) draft.patientName = parsed.patientName;
        if (parsed.patientDOB) draft.patientDOB = parsed.patientDOB;
        if (parsed.shipAddr1) draft.shipAddr1 = parsed.shipAddr1;
        if (parsed.shipCity) draft.shipCity = parsed.shipCity;
        if (parsed.shipState) draft.shipState = parsed.shipState;
        if (parsed.shipZip) draft.shipZip = parsed.shipZip;
        const first = draft.items[0];
        if (parsed.rxNumber) first.rxNumber = parsed.rxNumber;
        if (parsed.drug) first.drug = parsed.drug;
        if (parsed.qty) first.qty = parsed.qty;
      }
      newDrafts.push({
        id: ++_bulkId,
        draft,
        sourceFile: `${file.name} (${idx+1}/${groups.length})`,
        parseError: parsed ? null : 'Transfer page found but fields could not be parsed.',
        parsed
      });
    });
  }
  // Detect same-patient/same-day groups within this batch
  const today = todayLocal();
  const groupKey = (d) => `${(d.patientName||'').toLowerCase().trim()}|${today}`;
  const groups = {};
  newDrafts.forEach(b => {
    const k = groupKey(b.draft);
    if (!b.draft.patientName) return;
    (groups[k] = groups[k] || []).push(b);
  });
  let nextGroup = (state.bulkQueue||[]).reduce((m,b) => Math.max(m, b.dupGroup||0), 0);
  Object.values(groups).forEach(grp => {
    if (grp.length > 1) {
      nextGroup++;
      grp.forEach(b => b.dupGroup = nextGroup);
    }
  });
  if (!state.bulkQueue) state.bulkQueue = [];
  state.bulkQueue.push(...newDrafts);
  // Persist each new draft to backend (shared queue for everyone at this location)
  for (const b of newDrafts) await apiSaveBulkDraft(b);
  // Prompt for merging within groups
  const newGroups = Object.values(groups).filter(g => g.length > 1);
  if (newGroups.length) {
    const msg = newGroups.map(g => `${g[0].draft.patientName} — ${g.length} sheets`).join('\n');
    if (confirm(`Found ${newGroups.length} possible same-patient/same-day group(s) in this batch:\n\n${msg}\n\nCombine each group into a single multi-Rx transfer?`)) {
      newGroups.forEach(g => {
        const keep = g[0];
        const extras = g.slice(1);
        extras.forEach(b => {
          // Move b's PK sheet + items into keep
          keep.draft.pkSheets.push(...b.draft.pkSheets);
          b.draft.items.forEach(it => {
            if (it.rxNumber || it.drug) keep.draft.items.push(it);
          });
          state.bulkQueue = state.bulkQueue.filter(x => x.id !== b.id);
        });
        // Clean trailing empty item rows
        keep.draft.items = keep.draft.items.filter((it, idx) => idx === 0 || it.rxNumber || it.drug);
      });
    }
  }
  renderNewForm();
}

function approveBulkDraft(id, skipAlert) {
  const b = state.bulkQueue.find(x => x.id === id);
  if (!b) return;
  if (bulkDraftStatus(b) !== 'ok') { alert('Draft has missing required fields. Edit and complete it first.'); return; }
  const t = {
    ...b.draft,
    id: nextId(),
    title: `${b.draft.patientName} — ${new Date().toLocaleDateString()}`,
    txEmailedDate: null, dateReceivedAtErie: null,
    patientStatus: 'Pending', dateShipped: null, trackingNumber: '', paid: 'Pending', dateReceivedByPatient: null,
    status: 'New',
    submittedBy: CURRENT_USER.name, assignedTo: null,
    createdAt: new Date().toISOString(),
    comments: []
  };
  // Carry the document blob references into the transfer so the receiving team can view them later
  if (b.pageImages && b.pageImages.length) {
    t.pageImages = b.pageImages.filter(p => p.blobName).map(p => ({ pageNum: p.pageNum, blobName: p.blobName, kind: p.kind }));
  }
  TRANSFERS.unshift(t);
  apiSaveTransfer(t);
  state.bulkQueue = state.bulkQueue.filter(x => x.id !== id);
  apiDeleteBulkDraft(id);
  if (!skipAlert) {
    alert(`Approved: ${t.patientName} added to transfers.`);
    renderNewForm();
    render();
  }
}

// Editor for a single bulk-queue draft. Point state.draft at the queue's draft object so
// the existing form binding code mutates the queue entry directly. Don't restore state.draft
// until the user clicks Back/Save — otherwise input handlers (which read state.draft at fire
// time) would mutate the wrong object.
function renderBulkEditor(b) {
  state.draft = b.draft;
  state.newMode = 'single';
  renderNewForm();
  state.newMode = 'bulk';
  const root = document.getElementById('view-new');
  const card = root.querySelector('.card');
  if (card) {
    const banner = document.createElement('div');
    banner.style.cssText = 'background:var(--warning-bg);border:1px solid var(--warning);padding:10px 14px;border-radius:6px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px';
    const missing = bulkDraftMissing(b);
    const hasImages = b.pageImages && b.pageImages.length > 0;
    banner.innerHTML = `
      <div>
        <strong>Editing bulk-upload draft</strong>
        <div class="item-sub">Source: ${escapeHtml(b.sourceFile)}${b.parseError?` · <span style="color:var(--danger)">${escapeHtml(b.parseError)}</span>`:''}</div>
        ${missing.length?`<div class="item-sub" style="color:var(--warning)">Missing: ${missing.join(', ')}</div>`:''}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${hasImages?`<button class="btn btn-secondary btn-sm" id="bulk-viewPages">📄 View attached pages (${b.pageImages.length})</button>`:''}
        <button class="btn btn-secondary btn-sm" id="bulk-back">← Back to queue</button>
      </div>
    `;
    card.parentNode.insertBefore(banner, card);
    const exitEdit = () => { apiUpdateBulkDraft(b); state.draft = null; state.bulkEditingId = null; renderNewForm(); };
    document.getElementById('bulk-back').onclick = exitEdit;
    const viewPagesBtn = document.getElementById('bulk-viewPages');
    if (viewPagesBtn) viewPagesBtn.onclick = () => openPageViewer(b);
    const submitBtn = document.getElementById('submitDraft');
    if (submitBtn) {
      submitBtn.textContent = 'Save & return to queue';
      submitBtn.onclick = exitEdit;
      // Two approve buttons: "Save & Approve" closes the editor, "Approve & Next" advances to the next draft
      const queueSnapshot = (state.bulkQueue || []).map(x => x.id);
      const currentIdx = queueSnapshot.indexOf(b.id);
      const hasNext = currentIdx >= 0 && currentIdx < queueSnapshot.length - 1;

      const makeApproveBtn = (label, advanceToNext) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.textContent = label;
        btn.style.marginRight = '8px';
        btn.onclick = () => {
          apiUpdateBulkDraft(b);
          if (bulkDraftStatus(b) !== 'ok') {
            const missing = bulkDraftMissing(b);
            alert(`Cannot approve — still missing: ${missing.join(', ')}`);
            return;
          }
          approveBulkDraft(b.id);
          // After approval, b.id is removed from the queue. The next draft (if any) sits at
          // currentIdx in the snapshot we took — find it now.
          if (advanceToNext && hasNext) {
            const nextId = queueSnapshot[currentIdx + 1];
            const stillExists = (state.bulkQueue || []).find(x => x.id === nextId);
            if (stillExists) {
              state.bulkEditingId = nextId;
              renderNewForm();
              return;
            }
          }
          state.draft = null; state.bulkEditingId = null;
          document.querySelector('.tab[data-tab=new]').click();
        };
        return btn;
      };
      if (hasNext) {
        const nextBtn = makeApproveBtn('Approve & Next →', true);
        submitBtn.parentNode.insertBefore(nextBtn, submitBtn);
      }
      const approveBtn = makeApproveBtn('Save & Approve', false);
      submitBtn.parentNode.insertBefore(approveBtn, submitBtn);
    }
    const resetBtn = document.getElementById('resetDraft');
    if (resetBtn) resetBtn.style.display = 'none';
  }
}
function renderRefillTab() {
  if (!state.refill) state.refill = { query: '', searchBy: 'patient', pickedId: null, includedItems: {}, editingDefaults: false };
  const root = document.getElementById('view-refill');
  const r = state.refill;
  const picked = r.pickedId ? TRANSFERS.find(t => t.id === r.pickedId) : null;

  if (picked) return renderRefillReview(picked);

  // Search phase
  const q = r.query.trim().toLowerCase();
  let matches = [];
  if (q.length >= 2) {
    matches = visibleTransfers().filter(t => {
      if (r.searchBy === 'patient') return (t.patientName||'').toLowerCase().includes(q);
      if (r.searchBy === 'originRx') return t.items.some(i => (i.rxNumber||'').toLowerCase().includes(q));
      if (r.searchBy === 'receivingRx') return t.items.some(i => (i.receivingRxNumber||'').toLowerCase().includes(q));

  root.innerHTML = `
    <div class="page-header"><div class="page-title">Refill an Existing Transfer</div></div>

      <div class="form-grid">
        <div class="form-group"><label>Search by</label>
          <select id="rf-by">
            <option value="patient" ${r.searchBy==='patient'?'selected':''}>Patient name</option>
            <option value="originRx" ${r.searchBy==='originRx'?'selected':''}>Origin Rx #</option>

      </div>
      <div style="margin-top:14px">
        ${q.length < 2 ? '<div class="item-sub">Type at least 2 characters to search.</div>' : matches.length === 0
          ? `<div class="empty"><h3>No matches</h3><p>No transfers found for "${escapeHtml(r.query)}" by ${r.searchBy === 'patient' ? 'patient' : 'Rx #'}.</p></div>`
          : `<table style="box-shadow:none;font-size:13px"><thead><tr><th>Patient</th><th>Origin → Fill</th><th>Drugs</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>
              ${matches.map(t => `<tr>
                <td><strong>${escapeHtml(t.patientName)}</strong>${t.transferType==='Refill'?' <span class="badge badge-verified" style="font-size:10px">Refill</span>':''}</td>
                <td>${escapeHtml(t.originLocation)} → ${escapeHtml(t.fillLocation)}</td>
                <td>${escapeHtml(t.items.map(i=>i.drug).filter(Boolean).join(', ').slice(0,80) || '(no drugs listed)')}</td>
                <td>${fmtDate(t.createdAt)}</td>
                <td><span class="badge ${STATUS_BADGE[t.status]}">${t.status}</span></td>
                <td><button class="btn btn-primary btn-sm" data-pick="${t.id}">Refill this →</button></td>
              </tr>`).join('')}
            </tbody></table>`}
      </div>
      <div style="margin-top:18px;padding:12px 14px;background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px"><strong>Can't find it?</strong> <span class="item-sub" style="text-transform:none;font-weight:400">Use this for refills of transfers that happened before the app existed. Temporary — once enough history is in here, just use search.</span></div>
        <button class="btn btn-secondary btn-sm" id="rf-manual">+ Enter Refill Manually</button>
      </div>
    </div></div>
  `;
  document.getElementById('rf-by').onchange = e => { r.searchBy = e.target.value; renderRefillTab(); };
  document.getElementById('rf-q').oninput = e => { r.query = e.target.value; renderRefillTab(); };
  root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    r.pickedId = +b.dataset.pick;
    r.includedItems = {};
    const t = TRANSFERS.find(x => x.id === r.pickedId);
    if (t) t.items.forEach(i => r.includedItems[i.id] = true);
    renderRefillTab();
  });
  document.getElementById('rf-manual').onclick = () => {
    state.draft = freshDraft();
    state.draft.transferType = 'Refill';
    state.draft.legacyRefill = true;
    state.draft.priorPharmacy = '';
    state.draft.priorRxNumber = '';
    state.draft.priorTransferDate = '';
    state.draft.priorTransferNote = '';
    document.querySelector('.tab[data-tab=new]').click();
  };
}

function renderRefillReview(t) {
  const root = document.getElementById('view-refill');
  const r = state.refill;
  const editing = r.editingDefaults;

  if (!r.defaults) r.defaults = {

  root.innerHTML = `

          <div class="form-group full"><label>Address Line 2</label><input data-def="shipAddr2" value="${escapeHtml(def.shipAddr2)}" /></div>
          <div class="form-group"><label>City</label><input data-def="shipCity" value="${escapeHtml(def.shipCity)}" /></div>
          <div class="form-group"><label>State / Zip</label><div style="display:flex;gap:6px"><input data-def="shipState" value="${escapeHtml(def.shipState)}" style="width:60px" /><input data-def="shipZip" value="${escapeHtml(def.shipZip)}" /></div></div>
          <div class="form-group"><div class="checkbox-row"><input type="checkbox" data-def="coldItem" ${def.coldItem?'checked':''} /><label>Cold item</label></div></div>
          <div class="form-group"><div class="checkbox-row"><input type="checkbox" data-def="ccOnFileInPaladin" ${def.ccOnFileInPaladin?'checked':''} /><label>Credit card on file</label></div></div>
        </div>
      ` : `
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px 24px;font-size:13px;line-height:1.7">
          <div><strong>Origin → Fill:</strong> ${escapeHtml(def.originLocation)} → ${escapeHtml(def.fillLocation)}</div>
          <div><strong>Ship To:</strong> ${escapeHtml(def.shipTo)}</div>
          <div><strong>Billing:</strong> ${escapeHtml(billingLabel(def.billing))}${def.ccOnFileInPaladin?' (CC on file)':''}</div>
          <div><strong>Cold:</strong> ${def.coldItem?'Yes':'No'}</div>

      ${t.items.map(i => `
        <div class="checkbox-row" style="padding:10px;border:1px solid var(--gray-200);border-radius:6px;margin-bottom:6px">

    renderRefillTab();
  });

    // Build the draft from source + edited defaults + only included items
    const draft = draftFromRefill(t);
    Object.assign(draft, {
      originLocation: def.originLocation, fillLocation: def.fillLocation,
      shipTo: def.shipTo, coldItem: def.coldItem,
      shipAddr1: def.shipAddr1, shipAddr2: def.shipAddr2, shipCity: def.shipCity, shipState: def.shipState, shipZip: def.shipZip,
      billing: def.billing, ccOnFileInPaladin: def.ccOnFileInPaladin
    });
    const keepIds = new Set(Object.entries(r.includedItems).filter(([,v])=>v).map(([k])=>+k));
    // draft.items currently has fresh IDs; we need to map source IDs → which to keep.
    // Same Rx (it's a refill) so keep the origin and receiving Rx numbers from the source.
    draft.items = t.items.filter(i => keepIds.has(i.id)).map(i => ({
      id: nextId(),

    state.refill = null;
    document.querySelector('.tab[data-tab=new]').click();
  };
