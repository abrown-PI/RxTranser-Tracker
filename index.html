    <div class="card"><div class="card-header">Teams Webhooks (per location) <span class="item-sub" id="tw-status" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div><div class="card-body">
      <p class="item-sub" style="margin-bottom:10px">When a question is asked on a transfer, the app posts to the webhook configured for the receiving location(s). URLs are stored server-side and never returned to the browser — type/paste them here once, then save.</p>
      <table style="box-shadow:none;font-size:13px"><thead><tr><th style="width:160px">Location</th><th>Webhook URL</th><th style="width:120px">Status</th></tr></thead><tbody>
        ${LOCATIONS.map(l => `<tr>
          <td><strong>${escapeHtml(l)}</strong></td>
          <td><input id="tw-${escapeHtml(l).replace(/\s+/g,'_')}" data-loc="${escapeHtml(l)}" type="password" placeholder="https://...webhook.office.com/... (paste full URL)" style="width:100%;padding:6px 8px;border:1px solid var(--gray-300);border-radius:4px;font-family:monospace;font-size:12px" autocomplete="off" /></td>
          <td><span class="item-sub tw-state" data-loc-state="${escapeHtml(l)}"></span></td>
        </tr>`).join('')}
      </tbody></table>
      <div style="margin-top:10px"><button class="btn btn-primary btn-sm" id="tw-save">Save webhook URLs</button> <span class="item-sub" id="tw-saveResult" style="margin-left:10px"></span></div>
    </div></div>

    <div class="card"><div class="card-header">Audit Log <span class="item-sub" id="audit-status" style="font-weight:400;text-transform:none;letter-spacing:0">— who accessed/modified what, and when</span></div><div class="card-body">
      <p class="item-sub" style="margin-bottom:10px">Append-only record of transfer access and changes. Useful for HIPAA audits and investigating who saw or modified a particular transfer. Click any row to inspect details.</p>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px">
        <div><label class="hint" style="display:block">Filter by user</label><input id="audit-fUser" placeholder="name or email" style="padding:6px 10px;border:1px solid var(--gray-300);border-radius:4px;width:200px" /></div>
        <div><label class="hint" style="display:block">Filter by action</label>
          <select id="audit-fAction" style="padding:6px 10px;border:1px solid var(--gray-300);border-radius:4px">
            <option value="">All actions</option>
            <option value="view_transfer">View transfer</option>
            <option value="create_transfer">Create transfer</option>
            <option value="edit_transfer">Edit transfer</option>
            <option value="delete_transfer">Delete transfer</option>
            <option value="status_change">Status change</option>
            <option value="sign_in">Sign in</option>
          </select>
        </div>
        <div><label class="hint" style="display:block">Transfer ID</label><input id="audit-fEntity" placeholder="e.g. 20019" style="padding:6px 10px;border:1px solid var(--gray-300);border-radius:4px;width:120px" /></div>
        <button class="btn btn-secondary btn-sm" id="audit-refresh">↻ Refresh</button>
        <button class="btn btn-secondary btn-sm" id="audit-export">📥 Export CSV</button>
      </div>
      <div id="audit-table" style="font-size:13px"><div class="item-sub">Loading…</div></div>
    </div></div>
  `;
  // Unified Users & Access — combines 365 users (/api/users), local accounts (/api/local-users),
  // and admin email list (/api/settings.adminEmails) into one table.
  let _users365 = [];
  let _localUsers = [];
  let _adminEmailsSet = new Set();

  const renderUnifiedUsers = () => {
    const root = document.getElementById('unified-users');
    if (!root) return;
    const rows = [];
    _users365.forEach(u => {
      const isAdmin = _adminEmailsSet.has((u.email||'').toLowerCase());
      // Effective role: admin overrides whatever's stored
      const role = isAdmin ? 'admin' : (u.role || 'tech');
      rows.push({ kind: '365', key: u.email, name: u.name, location: u.location, role, last: u.lastSignInAt, isAdmin });
    });
    _localUsers.forEach(u => {
      rows.push({ kind: 'local', key: u.username, name: u.name, location: u.location, role: u.role || 'tech', last: u.lastLoginAt, isLocal: true });
    });
    if (rows.length === 0) {
      root.innerHTML = '<div class="item-sub" style="padding:14px;text-align:center;font-style:italic">No users yet. Add a 365 admin below, or create a local account.</div>';
      return;
    }
    root.innerHTML = `<table style="box-shadow:none;font-size:13px"><thead><tr>
      <th style="width:60px">Type</th><th>Name</th><th>Email / Username</th><th>Location</th><th>Role</th><th>Last Sign-in</th><th></th>
    </tr></thead><tbody>${rows.map((r,idx) => `<tr>
      <td><span class="badge ${r.kind==='365'?'badge-verified':'badge-progress'}" style="font-size:10px">${r.kind==='365'?'365':'Local'}</span></td>
      <td><input data-row="${idx}" data-k="name" value="${escapeHtml(r.name||'')}" style="width:100%;padding:4px 6px;border:1px solid var(--gray-300);border-radius:3px;font-weight:600" /></td>
      <td><span style="font-family:monospace;font-size:12px">${escapeHtml(r.key||'')}</span></td>
      <td><select data-row="${idx}" data-k="location">${LOCATIONS.map(l=>`<option ${l===r.location?'selected':''}>${l}</option>`).join('')}</select></td>
      <td><select data-row="${idx}" data-k="role"><option ${r.role==='admin'?'selected':''}>admin</option><option ${r.role==='manager'?'selected':''}>manager</option><option ${r.role==='tech'?'selected':''}>tech</option></select></td>
      <td>${r.last ? new Date(r.last).toLocaleString() : '<span class="item-sub">never</span>'}</td>
      <td style="white-space:nowrap">${r.kind==='local' ? `<button class="btn btn-secondary btn-sm" data-reset-pin="${idx}">Reset PIN</button> ` : ''}<button class="btn btn-secondary btn-sm" data-rm-row="${idx}">Remove</button></td>
    </tr>`).join('')}</tbody></table>`;
    // Wire edits
    root.querySelectorAll('[data-row]').forEach(el => el.onchange = async () => {
      const r = rows[+el.dataset.row];
      const k = el.dataset.k;
      const v = el.value;
      if (r.kind === '365') {
        if (k === 'role') {
          // Toggle admin emails list based on role choice
          const email = (r.key||'').toLowerCase();
          if (v === 'admin') _adminEmailsSet.add(email); else _adminEmailsSet.delete(email);
          await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminEmails: [..._adminEmailsSet] }) });
          // Also save the non-admin role choice
          if (v !== 'admin') await fetch('/api/users/' + encodeURIComponent(r.key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: v }) });
        } else {
          await fetch('/api/users/' + encodeURIComponent(r.key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [k]: v }) });
        }
      } else {
        // Local user
        await fetch('/api/local-users/x/' + encodeURIComponent(r.key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [k]: v }) });
      }
      loadAllUsers();
    });
    root.querySelectorAll('[data-rm-row]').forEach(b => b.onclick = async () => {
      const r = rows[+b.dataset.rmRow];
      if (!confirm(`Remove ${r.name || r.key}?`)) return;
      if (r.kind === '365') {
        await fetch('/api/users/' + encodeURIComponent(r.key), { method: 'DELETE' });
        _adminEmailsSet.delete((r.key||'').toLowerCase());
        await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminEmails: [..._adminEmailsSet] }) });
      } else {
        await fetch('/api/local-users/x/' + encodeURIComponent(r.key), { method: 'DELETE' });
      }
      loadAllUsers();
    });
    root.querySelectorAll('[data-reset-pin]').forEach(b => b.onclick = async () => {
      const r = rows[+b.dataset.resetPin];
      const pin = prompt(`New PIN for "${r.key}" (4+ chars):`);
      if (!pin || pin.length < 4) return;
      await fetch('/api/local-users/x/' + encodeURIComponent(r.key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
      alert('PIN updated.');
    });
  };

  const loadAllUsers = async () => {
    try {
      const [u365R, luR, settingsR] = await Promise.all([
        fetch('/api/users').then(r => r.json()).catch(() => ({ users: [] })),
        fetch('/api/local-users').then(r => r.json()).catch(() => ({ users: [] })),
        fetch('/api/settings').then(r => r.json()).catch(() => ({ adminEmails: [] }))
      ]);
      _users365 = u365R.users || [];
      _localUsers = luR.users || [];
      _adminEmailsSet = new Set((settingsR.adminEmails || []).map(e => e.toLowerCase()));
      _adminEmails = [..._adminEmailsSet];
      renderUnifiedUsers();
    } catch (e) { console.error('loadAllUsers', e); }
  };
  loadAllUsers();

  // Add 365 user (by email, pre-authorize role)
  const aeAdd = document.getElementById('ae-add');
  if (aeAdd) aeAdd.onclick = async () => {
    const email = (document.getElementById('ae-new').value || '').trim().toLowerCase();
    const role = document.getElementById('ae-role').value;
    const result = document.getElementById('ae-result');
    if (!/^.+@.+\..+$/.test(email)) { result.innerHTML = '<span style="color:var(--danger)">Invalid email</span>'; return; }
    result.innerHTML = '<span class="item-sub">Adding…</span>';
    try {
      // Add a placeholder user record (will get filled in on first sign-in)
      await fetch('/api/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, name: email, role: role === 'admin' ? 'tech' : role, location: '' }) });
      if (role === 'admin') {
        _adminEmailsSet.add(email);
        await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminEmails: [..._adminEmailsSet] }) });
      }
      result.innerHTML = '<span style="color:var(--success)">✓ Added</span>';
      document.getElementById('ae-new').value = '';
      loadAllUsers();
    } catch (e) { result.innerHTML = '<span style="color:var(--danger)">' + escapeHtml(e.message) + '</span>'; }
  };

  // Create local account
  const luCreate = document.getElementById('lu-create');
  if (luCreate) luCreate.onclick = async () => {
    const body = {
      username: document.getElementById('lu-username').value.trim().toLowerCase(),
      name: document.getElementById('lu-name').value.trim(),
      pin: document.getElementById('lu-pin').value.trim(),
      location: document.getElementById('lu-location').value,
      role: document.getElementById('lu-role').value
    };
    const result = document.getElementById('lu-result');
    if (!body.username || !body.pin) { result.innerHTML = '<span style="color:var(--danger)">Username and PIN required</span>'; return; }
    if (body.pin.length < 4) { result.innerHTML = '<span style="color:var(--danger)">PIN must be 4+ chars</span>'; return; }
    result.innerHTML = '<span class="item-sub">Creating…</span>';
    try {
      const r = await fetch('/api/local-users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) { result.innerHTML = `<span style="color:var(--danger)">${escapeHtml(data.error||'Failed')}</span>`; return; }
      result.innerHTML = '<span style="color:var(--success)">✓ Created</span>';
      ['lu-username','lu-name','lu-pin'].forEach(id => document.getElementById(id).value = '');
      loadAllUsers();
    } catch (e) { result.innerHTML = `<span style="color:var(--danger)">${escapeHtml(e.message)}</span>`; }
  };
  root.querySelectorAll('[data-fi]').forEach(el => el.onchange = () => { FORMULAS[+el.dataset.fi][el.dataset.k] = el.value; });
  // Debounced save of pharmacy addresses to /api/settings so edits persist
  let _paSaveTimer = null;
  const persistPharmacyAddresses = () => {
    clearTimeout(_paSaveTimer);
    _paSaveTimer = setTimeout(() => {
      fetch('/api/settings', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pharmacyAddresses: PHARMACY_ADDRESSES })
      }).catch(() => {});
    }, 600);
  };
  root.querySelectorAll('[data-pa]').forEach(el => el.onchange = () => {
    const loc = el.dataset.pa, k = el.dataset.k;
    if (!PHARMACY_ADDRESSES[loc]) PHARMACY_ADDRESSES[loc] = { addr1:'', addr2:'', city:loc, state:'', zip:'' };
    PHARMACY_ADDRESSES[loc][k] = el.value;
    persistPharmacyAddresses();
  });
  // Multi-day receiving checkboxes — each toggle rebuilds the shippingDays array
  // for that location by collecting all currently-checked day boxes in that row.
  root.querySelectorAll('[data-paday]').forEach(el => el.onchange = () => {
    const loc = el.dataset.paday;
    if (!PHARMACY_ADDRESSES[loc]) PHARMACY_ADDRESSES[loc] = { addr1:'', addr2:'', city:loc, state:'', zip:'' };
    const checked = [...root.querySelectorAll(`[data-paday="${loc}"]:checked`)].map(c => +c.dataset.day).sort();
    PHARMACY_ADDRESSES[loc].shippingDays = checked;
    delete PHARMACY_ADDRESSES[loc].shippingDay; // retire legacy single-day field
    persistPharmacyAddresses();
    renderAdmin(); // refresh the row styling to reflect new selection
  });
  root.querySelectorAll('[data-rmf]').forEach(b => b.onclick = () => { FORMULAS.splice(+b.dataset.rmf, 1); renderAdmin(); });
  document.getElementById('addFormulaBtn').onclick = () => {
    const name = prompt('Formula name?'); if (!name) return;
    const loc = prompt('Location? (one of: ' + LOCATIONS.join(', ') + ')', CURRENT_USER.location);
    if (!LOCATIONS.includes(loc)) { alert('Invalid location'); return; }
    const link = prompt('Link (SharePoint URL, optional):') || '';
    FORMULAS.push({ id: nextId(), name, location: loc, link, fileName: '', createdBy: CURRENT_USER.name, createdAt: new Date().toISOString() });
    renderAdmin();
  };
  // Document Templates — preview buttons open sample versions with placeholder data
  root.querySelectorAll('[data-doc-preview]').forEach(btn => {
    btn.onclick = () => {
      const sampleTransfer = {
        id: 'SAMPLE-1234',
        patientName: 'Sample Patient',
        patientDOB: '1980-01-15',
        items: [{ drug: 'Estradiol 0.5mg', qty: '30', rxNumber: '123456' }]
      };
      const sampleShipment = {
        id: 'SAMPLE',
        bulkShipmentId: 'BULK-SAMPLE-001',
        fromLocation: CURRENT_USER.location || 'Erie',
        toLocation: 'Seminole',
        carrier: 'FedEx',
        trackingNumber: '794612345678',
        shipDate: todayLocal(),
        transferIds: [1,2,3]
      };
      // Add sample transfers to the in-memory list temporarily so printPackingSlip can find them
      const sampleTransfers = [
        { id: 1, patientName: 'Jane Doe',   patientDOB: '1972-04-08', coldItem: false, items: [{ drug: 'Estradiol 0.5mg cream', qty: '60g', rxNumber: '100001', receivingRxNumber: '200001' }] },
        { id: 2, patientName: 'John Smith', patientDOB: '1965-11-22', coldItem: true,  items: [{ drug: 'Testosterone 200mg/ml', qty: '10ml', rxNumber: '100002', receivingRxNumber: '200002' }] },
        { id: 3, patientName: 'Mary Jones', patientDOB: '1988-07-30', coldItem: false, items: [{ drug: 'Progesterone 100mg', qty: '90', rxNumber: '100003', receivingRxNumber: '200003' }] }
      ];
      const kind = btn.dataset.docPreview;
      if (kind === 'cc-print') {
        printCCAuthForm(sampleTransfer, { mode: 'print', preview: true });
      } else if (kind === 'cc-fill') {
        printCCAuthForm(sampleTransfer, { mode: 'fill', preview: true });
      } else if (kind === 'packing') {
        // Temporarily inject samples into TRANSFERS so printPackingSlip's lookup works
        const saved = TRANSFERS.slice();
        TRANSFERS.push(...sampleTransfers);
        try { printPackingSlip(sampleShipment, { preview: true }); }
        finally { TRANSFERS.length = 0; TRANSFERS.push(...saved); }
      }
    };
  });

  // Audit log viewer — load entries, wire filter/refresh/export
  let _auditEntries = [];
  const auditTable = document.getElementById('audit-table');
  const auditStatus = document.getElementById('audit-status');
  const fUser = document.getElementById('audit-fUser');
  const fAction = document.getElementById('audit-fAction');
  const fEntity = document.getElementById('audit-fEntity');
  const ACTION_LABEL = {
    view_transfer: '👁 Viewed', create_transfer: '➕ Created', edit_transfer: '✏️ Edited',
    delete_transfer: '🗑 Deleted', status_change: '🔄 Status changed', sign_in: '🔐 Signed in'
  };
  function renderAuditTable() {
    const q = (fUser.value || '').trim().toLowerCase();
    const action = fAction.value;
    const entity = (fEntity.value || '').trim();
    const filtered = _auditEntries.filter(e => {
      if (action && e.action !== action) return false;
      if (entity && String(e.entityId) !== entity) return false;
      if (q) {
        const hay = ((e.actor||'') + ' ' + (e.actorEmail||'')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    if (filtered.length === 0) {
      auditTable.innerHTML = '<div class="empty" style="padding:20px"><h3>No matching entries</h3><p>Try clearing filters or refreshing.</p></div>';
      return;
    }
    auditTable.innerHTML = `<table style="box-shadow:none;font-size:12px"><thead><tr>
      <th style="width:160px">When</th><th>User</th><th style="width:140px">Action</th><th>Entity</th><th>Details</th>
    </tr></thead><tbody>
      ${filtered.map(e => {
        let details = '';
        if (e.details) {
          try { const obj = JSON.parse(e.details); details = Object.entries(obj).map(([k,v]) => `<code style="font-size:11px">${escapeHtml(k)}=${escapeHtml(String(v))}</code>`).join(' '); }
          catch { details = `<code style="font-size:11px">${escapeHtml(e.details.slice(0,200))}</code>`; }
        }
        return `<tr>
          <td>${new Date(e.ts).toLocaleString()}</td>
          <td><strong>${escapeHtml(e.actor||'—')}</strong><div class="item-sub" style="font-size:10px">${escapeHtml(e.actorEmail||'')}</div></td>
          <td>${escapeHtml(ACTION_LABEL[e.action] || e.action)}</td>
          <td><code style="font-size:11px">${escapeHtml(e.entityType||'')}${e.entityId?':'+escapeHtml(e.entityId):''}</code></td>
          <td>${details}</td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  }
  async function loadAudit() {
    auditTable.innerHTML = '<div class="item-sub" style="padding:14px">Loading…</div>';
    try {
      const r = await fetch('/api/audit?limit=500');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      _auditEntries = data.entries || [];
      auditStatus.textContent = ` — ${_auditEntries.length} entries loaded`;
      renderAuditTable();
    } catch (e) {
      auditTable.innerHTML = `<div class="item-sub" style="color:var(--danger);padding:14px">Failed to load audit log: ${escapeHtml(e.message)}</div>`;
    }
  }
  [fUser, fAction, fEntity].forEach(el => el.oninput = el.onchange = renderAuditTable);
  document.getElementById('audit-refresh').onclick = loadAudit;
  document.getElementById('audit-export').onclick = () => {
    const rows = [['Timestamp','Actor','Email','Action','Entity Type','Entity ID','Details']];
    _auditEntries.forEach(e => rows.push([e.ts, e.actor, e.actorEmail, e.action, e.entityType, e.entityId, e.details||'']));
    const csv = rows.map(r => r.map(v => '"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `audit-log-${todayLocal()}.csv`;
    a.click();
  };
  loadAudit();

  // Teams webhooks + email notifications — populate fields from settings
  (async () => {
    try {
      const r = await fetch('/api/settings');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      document.getElementById('tw-status').textContent = '— loaded';
      const cfg = data.teamsWebhooksConfigured || {};
      root.querySelectorAll('[data-loc-state]').forEach(el => {
        const loc = el.dataset.locState;
        el.innerHTML = cfg[loc] ? '<span style="color:var(--success)">● configured</span>' : '<span style="color:var(--gray-400)">○ not set</span>';
      });
      // Daily summary always-CC recipients
      const dsBox = document.getElementById('dsRecipients');
      if (dsBox) dsBox.value = (data.dailySummaryRecipients || []).join('\n');
      // Per-location emails — may be array (new) or string (legacy)
      const locEmails = data.locationEmails || {};
      root.querySelectorAll('[data-le]').forEach(el => {
        const v = locEmails[el.dataset.le];
        el.value = Array.isArray(v) ? v.join('\n') : (v || '');
      });
    } catch (e) {
      document.getElementById('tw-status').textContent = '— load failed (' + e.message + ')';
    }
  })();

  // Save daily summary recipients
  const dsSave = document.getElementById('dsSave');
  if (dsSave) dsSave.onclick = async () => {
    const result = document.getElementById('dsResult');
    const list = (document.getElementById('dsRecipients').value || '')
      .split(/[\n,;]+/).map(s => s.trim().toLowerCase()).filter(s => /.+@.+\..+/.test(s));
    result.innerHTML = '<span class="item-sub">Saving…</span>';
    try {
      const r = await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dailySummaryRecipients: list }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      result.innerHTML = `<span style="color:var(--success)">✓ Saved ${list.length} recipient${list.length===1?'':'s'}</span>`;
    } catch (e) { result.innerHTML = `<span style="color:var(--danger)">${escapeHtml(e.message)}</span>`; }
  };

  // Save per-location emails — backend will parse comma/newline separated into array
  const leSave = document.getElementById('leSave');
  if (leSave) leSave.onclick = async () => {
    const result = document.getElementById('leResult');
    const locationEmails = {};
    root.querySelectorAll('[data-le]').forEach(el => {
      const lines = el.value.split(/[,\n;]+/).map(s => s.trim()).filter(s => /.+@.+\..+/.test(s));
      locationEmails[el.dataset.le] = lines; // empty array clears
    });
    result.innerHTML = '<span class="item-sub">Saving…</span>';
    try {
      const r = await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ locationEmails }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const totalAddrs = Object.values(locationEmails).reduce((n,a) => n + a.length, 0);
      result.innerHTML = `<span style="color:var(--success)">✓ Saved (${totalAddrs} address${totalAddrs===1?'':'es'})</span>`;
    } catch (e) { result.innerHTML = `<span style="color:var(--danger)">${escapeHtml(e.message)}</span>`; }
  };

  // Test send daily summary now
  const dsTest = document.getElementById('dsTest');
  if (dsTest) dsTest.onclick = async () => {
    const result = document.getElementById('dsTestResult');
    result.innerHTML = '<span class="item-sub">Sending…</span>';
    try {
      const r = await fetch('/api/send-daily-summary', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
      const data = await r.json();
      if (!r.ok) { result.innerHTML = `<span style="color:var(--danger)">${escapeHtml(data.error || 'Failed')}</span>`; return; }
      result.innerHTML = `<span style="color:var(--success)">✓ Sent to ${data.recipients.join(', ')}</span>`;
    } catch (e) { result.innerHTML = `<span style="color:var(--danger)">${escapeHtml(e.message)}</span>`; }
  };
  document.getElementById('tw-save').onclick = async () => {
    const teamsWebhooks = {};
    root.querySelectorAll('[data-loc]').forEach(el => {
      const v = el.value.trim();
      if (v) teamsWebhooks[el.dataset.loc] = v;
    });
    const result = document.getElementById('tw-saveResult');
    result.innerHTML = '<span class="item-sub">Saving…</span>';
    try {
      const r = await fetch('/api/settings', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teamsWebhooks })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const cfg = data.teamsWebhooksConfigured || {};
      result.innerHTML = '<span style="color:var(--success)">✓ Saved</span>';
      root.querySelectorAll('[data-loc-state]').forEach(el => {
        const loc = el.dataset.locState;
        el.innerHTML = cfg[loc] ? '<span style="color:var(--success)">● configured</span>' : '<span style="color:var(--gray-400)">○ not set</span>';
      });
      // Clear the password fields so the URLs aren't kept in the DOM after save
      root.querySelectorAll('[data-loc]').forEach(el => { el.value = ''; });
    } catch (e) { result.innerHTML = '<span style="color:var(--danger)">Save failed: ' + escapeHtml(e.message) + '</span>'; }
  };
}

// =====================================================================
// New transfer form
// =====================================================================
function renderNewForm() {
  const root = document.getElementById('view-new');
  if (!state.newMode) state.newMode = 'single';
  if (state.newMode === 'bulk') return renderBulkUpload();
  if (!state.draft) state.draft = freshDraft();
  const d = state.draft;
  const isEditing = !!state.editingTransferId;
  const refillSource = d.refillOfId ? TRANSFERS.find(x => x.id === d.refillOfId) : null;
  root.innerHTML = `
    <div class="page-header">
      <div class="page-title">${isEditing ? `Edit Transfer — ${escapeHtml(d.patientName||'(unnamed)')}` : (d.transferType === 'Refill' ? 'Refill Transfer Request' : 'New Transfer Request')}</div>
      ${isEditing ? `<button class="btn btn-secondary btn-sm" id="cancelEdit">Cancel edit</button>` : `
      <div style="display:flex;gap:0;border:1px solid var(--gray-300);border-radius:6px;overflow:hidden">
        <button class="${state.newMode==='single'?'btn btn-primary':'btn btn-secondary'}" id="modeSingle" style="border-radius:0;border:0">Single Transfer</button>
        <button class="${state.newMode==='bulk'?'btn btn-primary':'btn btn-secondary'}" id="modeBulk" style="border-radius:0;border:0">Bulk Upload</button>
      </div>`}
    </div>
    <div class="card"><div class="card-body">
      ${refillSource ? `<div style="background:var(--primary-bg);border:1px solid var(--primary-light);padding:10px 14px;border-radius:6px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px"><strong>Refill of:</strong> ${escapeHtml(refillSource.patientName)} · ${escapeHtml(refillSource.items.map(i=>i.drug).filter(Boolean).join(', ').slice(0,80))} · originally submitted ${fmtDate(refillSource.createdAt)}</div>
        <button class="btn btn-secondary btn-sm" id="clearRefill">Clear refill link</button>
      </div>` : ''}
      <div style="background:var(--info-bg);border:1px solid var(--info);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px;line-height:1.5">
        <strong style="color:var(--info)">Save paper:</strong> Enter all patient, shipping, and billing info below — no need for the paper Patient Approval form anymore.
        <strong>The only time you'll need paper</strong> is the Credit Card Authorization (when billing = Credit Card and the card is NOT on file). The CC form prints a single page that the patient signs and you scan back in.
      </div>
      ${d.transferType === 'Refill' ? `<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--gray-200);font-size:13px"><span style="font-weight:600;color:var(--gray-700)">Transfer Type:</span> <span class="badge badge-verified">Refill</span>${d.legacyRefill?' <span class="badge" style="background:var(--warning-bg);color:var(--warning);font-size:10px">Manual / Legacy</span>':''}<span class="hint" style="margin-left:auto">Refills don't require a hard copy scan.</span></div>` : ''}
      ${(d.transferType === 'Refill' && !d.refillOfId) ? `<div class="section" style="background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:6px;padding:12px 14px;margin-bottom:14px">
        <div class="section-title" style="margin-top:0">Prior Transfer Info <span class="hint" style="text-transform:none;font-weight:400">— optional, for context. Used because the original transfer isn't in the app yet.</span></div>
        <div class="form-grid">
          <div class="form-group"><label>Prior Origin Pharmacy</label><input id="f-priorPharmacy" value="${escapeHtml(d.priorPharmacy||'')}" placeholder="e.g. Erie, Greenville" /></div>
          <div class="form-group"><label>Prior Rx Number</label><input id="f-priorRxNumber" value="${escapeHtml(d.priorRxNumber||'')}" placeholder="Original Rx #" /></div>
          <div class="form-group"><label>Prior Transfer Date</label><input type="date" id="f-priorTransferDate" value="${escapeHtml(d.priorTransferDate||'')}" /></div>
          <div class="form-group full"><label>Notes</label><input id="f-priorTransferNote" value="${escapeHtml(d.priorTransferNote||'')}" placeholder="Anything else worth recording about the original transfer" /></div>
        </div>
      </div>` : ''}
      <div id="f-pickupBox" style="background:var(--primary-bg);border:1px solid var(--primary-light);border-radius:6px;padding:12px 16px;margin-bottom:14px">
        <div class="checkbox-row">
          <input type="checkbox" id="f-pickupAt" ${d.pickupAtPharmacy?'checked':''} />
          <label for="f-pickupAt"><strong>📍 Prescriptions will be picked up at another pharmacy (Non-transfer)</strong></label>
        </div>
        <div class="hint" style="margin-top:4px;text-transform:none;font-weight:400">Only use when the order is originating from the filling pharmacy and shipping to another pharmacy for patient pickup — not a true transfer.</div>
        <div id="f-pickupFields" style="display:${d.pickupAtPharmacy?'':'none'};margin-top:10px">
          <div class="form-grid">
            <div class="form-group"><label>Pickup pharmacy</label><select id="f-pickupLoc"><option value="">— pick destination —</option>${LOCATIONS.map(l=>`<option ${l===d.pickupLocation?'selected':''}>${l}</option>`).join('')}</select><div class="hint">This pharmacy will see the order on their list</div></div>
            <div class="form-group"><div class="checkbox-row"><input type="checkbox" id="f-bulkPickup" ${d.isBulkPickup?'checked':''} /><label for="f-bulkPickup"><strong>📦 Bulk pickup order</strong></label></div><div class="hint">No per-patient detail — just a script count and short description</div></div>
          </div>
          <div id="f-bulkFields" style="display:${d.isBulkPickup?'':'none'};margin-top:6px;background:white;border:1px dashed var(--primary);border-radius:6px;padding:10px 14px">
            <div class="form-grid">
              <div class="form-group"><label>Number of scripts</label><input type="number" id="f-bulkCount" value="${escapeHtml(String(d.bulkScriptCount||''))}" min="1" placeholder="e.g. 12" /></div>
              <div class="form-group full"><label>Description / notes</label><input id="f-bulkDesc" value="${escapeHtml(d.bulkDescription||'')}" placeholder="e.g. Weekly batch of compounds for Seminole pickup customers" /></div>
            </div>
            <div class="hint" style="margin-top:4px">When checked, the Patient + Items sections below are not required.</div>
          </div>
        </div>
      </div>
      <div class="section-title">Patient</div>
      <div class="form-grid">
        <div class="form-group"><label>Patient Name</label><input id="f-patientName" value="${escapeHtml(d.patientName)}" /></div>
        <div class="form-group"><label>DOB</label><input type="date" id="f-patientDOB" value="${escapeHtml(d.patientDOB)}" /></div>
        <div class="form-group full"><label>Allergies</label><input id="f-patientAllergies" value="${escapeHtml(d.patientAllergies)}" placeholder="NKA if none" /></div>
      </div>

// =====================================================================
// PDF text extraction + transfer-sheet parser
// =====================================================================
// Read a PDF File and return the concatenated text from all pages.
// Returns null if pdf.js is unavailable or the file is image-only / non-PDF.
async function extractPdfText(file) {
  if (!window.pdfjsLib || !file) return null;
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      pages.push(tc.items.map(i => i.str).join(' '));
    }
    return pages.join('\n');
  } catch (e) {
    console.warn('PDF text extraction failed', e);
    return null;
  }
}

// Parse a PK transfer sheet text dump into the structured fields we care about.
// The sheet has consistent labels ("Patient :", "Rx number :", "Drug :", etc.) so we use
// label-anchored regex. Any field that doesn't match is left null and the user fills it in.
function parseTransferSheet(text) {
  if (!text) return null;
  // Normalize whitespace and labels
  const T = text.replace(/ /g, ' ').replace(/\s+/g, ' ');
  const grab = (re) => { const m = T.match(re); return m ? m[1].trim() : null; };
  // Patient — "Patient :" + name (LAST, FIRST style). Stop at next label.
  const patientName = grab(/Patient\s*:\s*([A-Z][A-Z ,\.'\-]+?)(?=\s+(?:Patient Phone|Patient DOB|Patient Address|Doctor|Drug|Rx number|Store|Person|Pharmacy information|Date|First fill|Last fill|DAW|Quantity|Refills|Instructions|Transferred By|$))/i);
  const patientDOBRaw = grab(/Patient DOB\s*:\s*([0-9\/\-]+)/i);
  // Convert MM/DD/YYYY -> YYYY-MM-DD for date input
  const patientDOB = patientDOBRaw ? (() => {
    const m = patientDOBRaw.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (!m) return null;
    let [, mm, dd, yy] = m;
    if (yy.length === 2) yy = (+yy > 50 ? '19' : '20') + yy;
    return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
  })() : null;
  // Patient Address — usually two lines: street, then city/state/zip. Capture until next labeled field.
  const patientAddrBlock = grab(/Patient Address\s*:\s*(.*?)(?=\s+(?:Drug|DAW|Doctor|Rx number|Patient Phone|Store|Person|Pharmacy information|Date|First fill|Last fill|Quantity|Refills|Instructions|Transferred By|$))/i);
  let shipAddr1='', shipCity='', shipState='', shipZip='';
  if (patientAddrBlock) {
    // Split into street vs "CITY, ST ZIP". The city/state/zip pattern is the strongest anchor.
    const csz = patientAddrBlock.match(/([A-Za-z\.' \-]+?),\s*([A-Z]{2})\s+(\d{5}(?:-\d{4})?)\s*$/);
    if (csz) {
      shipCity = csz[1].trim();
      shipState = csz[2].trim();
      shipZip = csz[3].trim();
      shipAddr1 = patientAddrBlock.replace(csz[0], '').trim();
    } else {
      shipAddr1 = patientAddrBlock.trim();
    }
  }
  const rxNumber = grab(/Rx number\s*:\s*(\S+)/i);
  const drug = grab(/Drug\s*:\s*(.*?)(?=\s+(?:DAW|Instructions|Doctor|Date Written|First fill|Quantity|Refills|Patient|Rx number|Store|Person|Pharmacy information|Transferred By|$))/i);
  const qtyRaw = grab(/Date Written\s*:\s*\S+\s+Qty\s*:\s*(\d+)/i) || grab(/Qty\s*:\s*(\d+)/i);
  const qty = qtyRaw;
  return { patientName, patientDOB, shipAddr1, shipCity, shipState, shipZip, rxNumber, drug, qty };
}

// Iterate over uploaded PK transfer sheet files, parse each, and apply the recognized
// fields to the current draft. Patient info comes from the first sheet that has it.
// Rx/drug/qty per file become one item per file (so a 2-PDF upload becomes 2 Rx rows).
async function autoFillFromTransferSheets(files) {
  let applied = 0, parsedFiles = 0;
  const parsedItems = [];
  let patientFilled = false;
  const d = state.draft;
  for (const file of files) {
    if (!/\.pdf$/i.test(file.name)) continue;
    const text = await extractPdfText(file);
    if (!text) continue;
    const f = parseTransferSheet(text);
    if (!f) continue;
    parsedFiles++;
    // Apply patient-level fields only once (first sheet wins)
    if (!patientFilled) {
      if (f.patientName && !d.patientName) { d.patientName = f.patientName; applied++; }
      if (f.patientDOB && !d.patientDOB) { d.patientDOB = f.patientDOB; applied++; }
      // Auto-fill patient address for both direct-to-patient ship and Delivery-Lancaster
      // (Lancaster delivery still goes to the patient's home — Lancaster is just the carrier).
      // For Pharmacy ship-to, the address comes from PHARMACY_ADDRESSES auto-fill instead.
      if (d.shipTo === 'Patient' || d.shipTo === 'Delivery-Lancaster') {
        if (f.shipAddr1 && !d.shipAddr1) { d.shipAddr1 = f.shipAddr1; applied++; }
        if (f.shipCity && !d.shipCity) { d.shipCity = f.shipCity; applied++; }
        if (f.shipState && !d.shipState) { d.shipState = f.shipState; applied++; }
        if (f.shipZip && !d.shipZip) { d.shipZip = f.shipZip; applied++; }
      }
      patientFilled = true;
    }
    if (f.rxNumber || f.drug || f.qty) parsedItems.push({ rxNumber: f.rxNumber || '', drug: f.drug || '', qty: f.qty || '' });
  }
  // Apply parsed items: fill the first empty Rx row, then add new rows for the rest
  parsedItems.forEach((pi) => {
    const empty = d.items.find(i => !i.rxNumber && !i.drug && !i.qty);
    if (empty) {
      if (pi.rxNumber) { empty.rxNumber = pi.rxNumber; applied++; }
      if (pi.drug) { empty.drug = pi.drug; applied++; }
      if (pi.qty) { empty.qty = pi.qty; applied++; }
    } else {
      const item = freshItem();
      item.rxNumber = pi.rxNumber; item.drug = pi.drug; item.qty = pi.qty;
      d.items.push(item);
      if (pi.rxNumber) applied++;
      if (pi.drug) applied++;
      if (pi.qty) applied++;
    }
  });
  // Refresh the form fields that may have been mutated
  ['patientName','patientDOB','shipAddr1','shipCity','shipState','shipZip'].forEach(k => {
    const el = document.getElementById('f-' + k);
    if (el && d[k] != null) el.value = d[k];
  });
  renderDraftItems();
  return { count: applied, parsedFiles };
}

    originLocation: CURRENT_USER.location, fillLocation: 'Erie',
    shipTo: 'Pharmacy', deliveryCharge: '',
    shipAddr1: '', shipAddr2: '', shipCity: '', shipState: '', shipZip: '',
    billing: 'HealNow', ccOnFileInPaladin: false, ccForm: null, patientPrice: '',
    coldItem: false,
    tempAddress: false, tempThroughDate: '',
    appointmentDate: '',
    anticipatedShipDate: '',
    pickupAtPharmacy: false, pickupLocation: '',
    isBulkPickup: false, bulkScriptCount: '', bulkDescription: '',
    pkSheets: [], formula: null, hardCopies: [],

// Build a new draft pre-filled from an existing transfer (refill workflow).
// Files are intentionally NOT carried over — fresh PK sheet uploads each refill.
function draftFromRefill(source) {
  return {
    transferType: 'Refill',
    refillOfId: source.id,
    patientName: source.patientName,
    patientDOB: source.patientDOB || '',
    patientAllergies: source.patientAllergies || 'NKA',
    originLocation: source.originLocation,
    fillLocation: source.fillLocation,
    shipTo: source.shipTo,
    deliveryCharge: source.deliveryCharge || '',
    shipAddr1: source.shipAddr1 || '', shipAddr2: source.shipAddr2 || '',
    shipCity: source.shipCity || '', shipState: source.shipState || '', shipZip: source.shipZip || '',
    billing: source.billing,
    ccOnFileInPaladin: !!source.ccOnFileInPaladin,
    ccForm: null,
    patientPrice: source.patientPrice || '',
    coldItem: !!source.coldItem,
    anticipatedShipDate: '',
    // Carry over docs from the source transfer — same prescription, same paperwork.
    // User can replace/remove on the form if anything changed.
    pkSheets: (source.pkSheets || []).slice(),
    hardCopies: (source.hardCopies || []).slice(),
    formula: source.formula || null,
    // Same prescription = same Rx numbers. User can override on the form if needed.
    items: source.items.map(i => ({
      id: nextId(),
      drug: i.drug, qty: i.qty,
      rxNumber: i.rxNumber || '',
      receivingRxNumber: i.receivingRxNumber || '',
      receiptAttached: false,
      doctorName: i.doctorName, doctorAddr: i.doctorAddr,
      doctorPhone: i.doctorPhone, doctorDEA: i.doctorDEA,
      notes: ''
    }))
  };
}
function freshItem() { return { id: nextId(), drug: '', qty: '', rxNumber: '', receivingRxNumber: '', receiptAttached: false, doctorName: '', doctorAddr: '', doctorPhone: '', doctorDEA: '', txFormVerified: false, notes: '' }; }

// Source spelling preserved verbatim from the master spreadsheet (note the
// SDV/MDV strength formatting inconsistency is intentional — matches labels).
const PRELOADED_DRUGS = [

  'TIRZEPATIDE/B12 SDV (MONTH #2) INJECTABLE 11.2MG/0.5MG/ML',

// Convert pharmacy-specific drug names to the canonical form. Currently handles
// Florida's "N. METHYLCOBALAMIN/(TIRZEPATIDE|SEMAGLUTIDE) ... (MDV|SDV)" pattern,
// where the leading list number N is the patient's titration month and the
// MDV/SDV designation picks the family. Maps to the matching entry in
// PRELOADED_DRUGS by month + vial type; vial-size detail ("1.5ML VIAL", "2ML
// VIAL") is intentionally dropped — the canonical name doesn't include it.
//
// Conservative: only converts when the pattern matches AND a canonical entry
// exists. Anything that doesn't match (other drugs, oral meds, hand-typed
// freeform names) passes through untouched.
function canonicalizeDrugName(raw) {
  if (!raw) return raw;
  const s = String(raw);
  // Florida-style "N. METHYLCOBALAMIN/(TIRZEPATIDE|SEMAGLUTIDE) ... (MDV|SDV)"
  // → matching canonical entry by month + vial type.
  const m = s.match(/^\s*(\d+)\s*[\.\)\:\-]\s*METHYLCOBALAMIN\s*\/\s*(TIRZEPATIDE|SEMAGLUTIDE)\b.*?\b(MDV|SDV)\b/i);
  if (m) {
    const month = parseInt(m[1], 10);
    const drug = m[2].toUpperCase();
    const vial = m[3].toUpperCase();
    const prefix = `${drug}/B12 ${vial} (MONTH #${month})`;
    const canonical = PRELOADED_DRUGS.find(d => d.toUpperCase().startsWith(prefix.toUpperCase()));
    if (canonical) return canonical;
  }
  // Injection-kit shorthand — "inj kit - tirz", "Injection kit - sema", etc.
  // Only converts when the drug family is identifiable; bare "Injection kit"
  // with no drug suffix is left alone for a human to clarify.
  const k = s.match(/^\s*inj(?:ection)?\s*kit\b.*?\b(tirz|sema)/i);
  if (k) {
    return /^tirz/i.test(k[1]) ? 'Injection Kit - Tirzepatide' : 'Injection Kit - Semaglutide';
  }
  return raw;
}

// Unique drug names seen across every transfer in the system, alphabetized.
// Powers the autocomplete on the Rx drug input so users don't have to retype
// drugs the system already knows about — especially useful for manual refills
// of legacy transfers, where there's no original transfer record to inherit from.
// Always includes the canonical PRELOADED_DRUGS list above so common compounds
// are pickable even before they show up in a transfer.
//
// Cleaning rules — same drug should show up once regardless of how it was
// originally captured:
//   • Strip leading numbered-list prefixes like "1.", "2)", "3:" — OCR'd
//     transfer sheets number each Rx, but those numbers aren't part of the
//     drug name and would otherwise multiply every drug across the dropdown.
//   • Drop zero-width / BOM characters — invisible chars from copy-paste
//     would otherwise look like duplicates of an existing entry.
//   • Collapse internal whitespace + trim — so "Drug  X" and "Drug X" merge.
//   • Lower-cased key for dedupe, but the first-seen cleaned casing is kept
//     for display so we don't ALL-CAP everything.
function getKnownDrugs() {
  const seen = new Map(); // normalized key -> cleaned display value
  // Seed with canonical names first so they always appear, and so a matching
  // transfer-derived entry won't add a near-duplicate with different casing.
  PRELOADED_DRUGS.forEach(d => {
    const key = d.toLowerCase().replace(/\s+/g, ' ').trim();
    if (key && !seen.has(key)) seen.set(key, d);
  });
  TRANSFERS.forEach(t => (t.items || []).forEach(i => {
    const raw = (i.drug || '').trim();
    if (!raw) return;
    const cleaned = raw
      .replace(/[​-‍﻿]/g, '')
      .replace(/^\s*\d+\s*[\.\)\:\-]\s*/, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!cleaned) return;
    const key = cleaned.toLowerCase();
    if (!seen.has(key)) seen.set(key, cleaned);
  }));
  return [...seen.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
}

function renderDraftItems() {
  const wrap = document.getElementById('itemsEditor');
  const count = state.draft.items.length;
  const totalBox = document.getElementById('itemsTotalCount');
  if (totalBox) totalBox.textContent = count;
  // Datalist of drugs already in the system. Native <datalist> gives us free-text
  // input plus dropdown suggestions with zero JS — the browser auto-filters as the
  // user types and accepts anything not in the list.
  const knownDrugs = getKnownDrugs();
  const drugDatalist = `<datalist id="known-drugs">${knownDrugs.map(d => `<option value="${escapeHtml(d)}"></option>`).join('')}</datalist>`;
  wrap.innerHTML = drugDatalist + state.draft.items.map((it, idx) => `
    <div class="item-row">
      <div class="item-head">
        <div class="item-title">Rx ${idx+1}</div>
        ${count>1?`<button class="btn btn-secondary btn-sm" data-rm="${idx}">Remove</button>`:''}
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Origin Rx #</label><input data-k="rxNumber" data-idx="${idx}" value="${escapeHtml(it.rxNumber)}" placeholder="From sending pharmacy" /></div>
        <div class="form-group"><label>Receiving Rx # <span class="hint" style="text-transform:none;font-weight:400">(fill location)</span></label><input data-k="receivingRxNumber" data-idx="${idx}" value="${escapeHtml(it.receivingRxNumber||'')}" placeholder="Assigned at Erie" /></div>
        <div class="form-group"><label>Drug / Strength</label><input data-k="drug" data-idx="${idx}" list="known-drugs" value="${escapeHtml(it.drug)}" placeholder="${knownDrugs.length ? 'Start typing or pick from list' : 'Auto-filled from transfer sheet if PDF'}" autocomplete="off" /></div>
        <div class="form-group"><label>Qty / Days Supply</label><input data-k="qty" data-idx="${idx}" value="${escapeHtml(it.qty)}" /></div>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-k]').forEach(el => {
    el.addEventListener('input', e => {
      const idx = +el.dataset.idx, k = el.dataset.k;
      state.draft.items[idx][k] = el.type === 'checkbox' ? el.checked : el.value;
    });
  });
  wrap.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    state.draft.items.splice(+b.dataset.rm, 1); renderDraftItems();
  }));
}

function bindDraftInputs() {
  const fields = ['patientName','patientDOB','patientAllergies','originLocation','fillLocation','shipTo','deliveryCharge','shipAddr1','shipAddr2','shipCity','shipState','shipZip','billing','anticipatedShipDate','transferNotes','priorPharmacy','priorRxNumber','priorTransferDate','priorTransferNote','patientPrice'];
  fields.forEach(f => { const el = document.getElementById('f-'+f); if (el) el.addEventListener('input', () => state.draft[f] = el.value); });

  // Ship-to-Pharmacy auto-fill: when user picks Pharmacy or changes origin, fill ship address from origin pharmacy
  const fillPharmacyAddress = () => {
    // Two cases populate the ship address from a pharmacy:
    //   1) Ship To = Pharmacy (regular transfer back to origin)
    //   2) Pickup at another pharmacy is on (regardless of shipTo) — destination is pickup
    const usePickup = !!(state.draft.pickupAtPharmacy && state.draft.pickupLocation);
    if (state.draft.shipTo !== 'Pharmacy' && !usePickup) { recalcAntShip(); return; }
    const destLoc = usePickup ? state.draft.pickupLocation : state.draft.originLocation;
    const addr = PHARMACY_ADDRESSES[destLoc];
    if (!addr) { recalcAntShip(); return; }
    state.draft.shipAddr1 = addr.addr1 || '';
    state.draft.shipAddr2 = addr.addr2 || '';
    state.draft.shipCity = addr.city || '';
    state.draft.shipState = addr.state || '';
    state.draft.shipZip = addr.zip || '';
    ['shipAddr1','shipAddr2','shipCity','shipState','shipZip'].forEach(f => { const el = document.getElementById('f-'+f); if (el) el.value = state.draft[f]; });
    recalcAntShip();
  };

  // Recalculate the anticipated ship date whenever shipTo / origin / appointment changes.
  // Logic:
  //   Ship-to-Pharmacy + appt date: next destination shipping day at or before (appt - 2 days)
  //   Ship-to-Pharmacy + no appt:   next destination shipping day from today
  //   Ship-to-Patient + appt date:  appt date - 2 days (typical 2-day FedEx)
  //   Ship-to-Patient + no appt:    today + 1 day
  // Always overwrites — the field is auto-managed. User can still type a manual value
  // but it will be replaced on the next relevant change.
  function recalcAntShip() {
    const d = state.draft;
    const apptISO = d.appointmentDate || '';
    const apptDate = apptISO ? new Date(apptISO + 'T12:00:00') : null;
    const noteEl = document.getElementById('f-antShipNote');
    if (noteEl) noteEl.textContent = '';
    // Auto-calc the anticipated ship date ONLY when the user has explicitly set a
    // future-appointment date — that's still useful because we work backward from
    // the appointment to figure out when the box needs to leave.
    // Without an appointment, the team prefers to leave the field blank at
    // creation and enter the date later at print time (see batchPrintTransfers /
    // the per-transfer print path).
    if (!apptDate) return;
    let target = null;
    const TWO_DAYS = 2 * 86400000;
    const usePickup = !!(d.pickupAtPharmacy && d.pickupLocation);
    if (d.shipTo === 'Pharmacy' || usePickup) {
      const destLoc = usePickup ? d.pickupLocation : d.originLocation;
      const addr = PHARMACY_ADDRESSES[destLoc] || {};
      const days = getShippingDays(addr);
      if (days.length === 0) {
        if (noteEl) noteEl.textContent = `(no receiving day set for ${destLoc || 'destination'} — set it in Admin → Pharmacy Mailing Addresses)`;
        return;
      }
      target = latestShippingDayAtOrBefore(addr, new Date(apptDate.getTime() - TWO_DAYS));
    } else if (d.shipTo === 'Patient') {
      target = new Date(apptDate.getTime() - TWO_DAYS);
    }
    if (!target) return;
    const iso = toDateISO(target);
    d.anticipatedShipDate = iso;
    const el = document.getElementById('f-antShip');
    if (el) el.value = iso;
  }
  const shipToSel = document.getElementById('f-shipTo');
  if (shipToSel) shipToSel.addEventListener('change', fillPharmacyAddress);
  const originSel2 = document.getElementById('f-originLocation');
  if (originSel2) originSel2.addEventListener('change', fillPharmacyAddress);
  ['coldItem','ccPaladin'].forEach(f => { const el = document.getElementById('f-'+f); if (el) el.addEventListener('change', () => { state.draft[f==='ccPaladin'?'ccOnFileInPaladin':f] = el.checked; }); });
  // Temporary address toggle (only shown when shipTo=Patient). Reveals a date field
  // and adds a warning banner so the receiving pharmacy knows not to update perms.
  const tempBox = document.getElementById('f-tempAddrBox');
  const tempFields = document.getElementById('f-tempAddrFields');
  const tempChk = document.getElementById('f-tempAddr');
  const tempDate = document.getElementById('f-tempThrough');
  if (shipToSel) shipToSel.addEventListener('change', () => {
    if (tempBox) tempBox.style.display = shipToSel.value === 'Patient' ? '' : 'none';
    if (shipToSel.value !== 'Patient') { state.draft.tempAddress = false; if (tempChk) tempChk.checked = false; if (tempFields) tempFields.style.display = 'none'; }
  });
  if (tempChk) tempChk.addEventListener('change', () => {
    state.draft.tempAddress = tempChk.checked;
    if (tempFields) tempFields.style.display = tempChk.checked ? '' : 'none';
  });
  if (tempDate) tempDate.addEventListener('change', () => { state.draft.tempThroughDate = tempDate.value; });

  // Future appointment date: checkbox enables the date input; date change triggers recalc
  const apptChk = document.getElementById('f-isAppt');
  const apptDateEl = document.getElementById('f-apptDate');
  if (apptChk) apptChk.addEventListener('change', () => {
    if (apptDateEl) apptDateEl.disabled = !apptChk.checked;
    if (!apptChk.checked) { state.draft.appointmentDate = ''; if (apptDateEl) apptDateEl.value = ''; }
    recalcAntShip();
  });
  if (apptDateEl) apptDateEl.addEventListener('change', () => {
    state.draft.appointmentDate = apptDateEl.value;
    recalcAntShip();
  });
  // Recalc on shipTo or origin change (in addition to the address auto-fill)
  if (shipToSel) shipToSel.addEventListener('change', recalcAntShip);
  if (originSel2) originSel2.addEventListener('change', recalcAntShip);

  // Pickup-at-other-pharmacy section
  const pickupBox = document.getElementById('f-pickupBox');
  const pickupChk = document.getElementById('f-pickupAt');
  const pickupFields = document.getElementById('f-pickupFields');
  const pickupLocSel = document.getElementById('f-pickupLoc');
  const bulkChk = document.getElementById('f-bulkPickup');
  const bulkFields = document.getElementById('f-bulkFields');
  const bulkCountEl = document.getElementById('f-bulkCount');
  const bulkDescEl = document.getElementById('f-bulkDesc');
  // Pickup box is always visible — it's its own top-level toggle independent of shipTo
  if (pickupChk) pickupChk.addEventListener('change', () => {
    state.draft.pickupAtPharmacy = pickupChk.checked;
    if (pickupFields) pickupFields.style.display = pickupChk.checked ? '' : 'none';
    if (!pickupChk.checked) {
      state.draft.isBulkPickup = false;
      if (bulkChk) bulkChk.checked = false;
      if (bulkFields) bulkFields.style.display = 'none';
    }
    fillPharmacyAddress(); // re-pull address based on new destination
  });
  if (pickupLocSel) pickupLocSel.addEventListener('change', () => {
    state.draft.pickupLocation = pickupLocSel.value;
    fillPharmacyAddress();
  });
  if (bulkChk) bulkChk.addEventListener('change', () => {
    state.draft.isBulkPickup = bulkChk.checked;
    if (bulkFields) bulkFields.style.display = bulkChk.checked ? '' : 'none';
  });
  if (bulkCountEl) bulkCountEl.addEventListener('input', () => { state.draft.bulkScriptCount = bulkCountEl.value; });
  if (bulkDescEl) bulkDescEl.addEventListener('input', () => { state.draft.bulkDescription = bulkDescEl.value; });

  // Run once on form open so the date is populated on a fresh draft
  recalcAntShip();

  // Show/hide CC form upload based on billing
  const billingSel = document.getElementById('f-billing');
  const ccBox = document.getElementById('f-ccFormBox');
  if (billingSel && ccBox) billingSel.addEventListener('change', () => { ccBox.style.display = billingSel.value === 'CreditCard' ? '' : 'none'; });
  const printCCBtn = document.getElementById('f-printCCForm');
  if (printCCBtn) printCCBtn.addEventListener('click', () => printCCAuthForm(state.draft, { mode: 'print' }));
  const fillCCBtn = document.getElementById('f-fillCCForm');
  if (fillCCBtn) fillCCBtn.addEventListener('click', () => printCCAuthForm(state.draft, { mode: 'fill' }));

  // Helper: read a File into base64 (strips the data: prefix)
  const readBase64 = (file) => new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = () => resolve((rd.result || '').split(',')[1] || '');
    rd.onerror = () => reject(new Error('Read failed'));
    rd.readAsDataURL(file);
  });

  const ccForm = document.getElementById('f-ccForm');
  if (ccForm) ccForm.addEventListener('change', async () => {
    const file = ccForm.files[0];
    const lbl = document.getElementById('f-ccForm-name');
    if (!file) { state.draft.ccForm = null; if (lbl) lbl.textContent = ''; return; }
    if (lbl) lbl.textContent = `Uploading ${file.name}…`;
    try {
      const base64 = await readBase64(file);
      const blobName = await uploadBlob(base64, file.type || 'application/octet-stream', 'ccauth');
      state.draft.ccForm = {
        name: file.name, size: file.size, type: file.type,
        blobName: blobName || null
      };
      if (lbl) lbl.textContent = `${file.name} (${(file.size/1024).toFixed(0)} KB)`;
    } catch (e) {
      console.error('CC form upload failed', e);
      if (lbl) lbl.textContent = `Upload failed: ${e.message}`;
    }
  });

  // Multi-file uploads: PK sheets and hard copies — upload to blob storage so the
  // documents are actually retrievable and previewable later.
  [['pkSheet','pkSheets','pksheets'],['hardCopy','hardCopies','hardcopies']].forEach(([elId,key,prefix]) => {
    const el = document.getElementById('f-'+elId);
    if (!el) return;
    el.addEventListener('change', async () => {
      const rawFiles = [...el.files];
      const lbl = document.getElementById('f-'+elId+'-name');
      if (lbl) lbl.textContent = `Uploading ${rawFiles.length} file(s)…`;
      const uploaded = [];
      for (const f of rawFiles) {
        try {
          const base64 = await readBase64(f);
          const blobName = await uploadBlob(base64, f.type || 'application/octet-stream', prefix);
          uploaded.push({ name: f.name, size: f.size, type: f.type, blobName: blobName || null });
        } catch (e) {
          console.warn('Upload failed for', f.name, e);
          uploaded.push({ name: f.name, size: f.size, type: f.type, blobName: null });
        }
      }
      state.draft[key] = uploaded;
      if (lbl) lbl.textContent = uploaded.map(f => `${f.name} (${(f.size/1024).toFixed(0)} KB)${f.blobName?'':' ⚠ upload failed'}`).join(', ');
      // PK transfer sheet auto-parse: try each uploaded PDF and apply matched fields to the draft
      if (key === 'pkSheets' && rawFiles.length) {
        if (lbl) lbl.innerHTML = lbl.innerHTML + ' <span style="color:var(--primary)">· Reading sheet…</span>';
        const applied = await autoFillFromTransferSheets(rawFiles);
        if (lbl) {
          lbl.textContent = uploaded.map(f => `${f.name} (${(f.size/1024).toFixed(0)} KB)${f.blobName?'':' ⚠ upload failed'}`).join(', ');
          if (applied.count > 0) lbl.innerHTML += ` <span style="color:var(--success)">· ✓ Auto-filled ${applied.count} field${applied.count>1?'s':''} from ${applied.parsedFiles} sheet${applied.parsedFiles>1?'s':''}</span>`;
          else lbl.innerHTML += ' <span style="color:var(--gray-500)">· Could not auto-fill (image PDF or unrecognized layout — enter manually)</span>';
        }
      }
      // If this transfer was originally created via bulk OCR, the "View N attached pages"
      // viewer reads from draft.pageImages (per-page PNGs) instead of pkSheets. Replacing
      // a PK sheet must also rebuild the transfer-kind page images, or that viewer keeps
      // showing the old content. Hard-copy page images are preserved.
      if (key === 'pkSheets'
          && Array.isArray(state.draft.pageImages)
          && state.draft.pageImages.some(p => p.kind === 'transfer')) {
        const pdfFile = rawFiles.find(f => /\.pdf$/i.test(f.name));
        if (pdfFile) {
          if (lbl) lbl.innerHTML += ' <span style="color:var(--primary)">· Rebuilding page images…</span>';
          try {
            const buf = await pdfFile.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            const newTransferPages = [];
            for (let p = 1; p <= pdf.numPages; p++) {
              const base64 = await rasterizePdfPageToBase64(pdf, p);
              const blobName = await uploadBlob(base64, 'image/png', 'pages');
              if (blobName) newTransferPages.push({ pageNum: p, blobName, kind: 'transfer' });
            }
            const hardcopyPages = state.draft.pageImages.filter(p => p.kind === 'hardcopy');
            // Transfer pages first (1..N), then hardcopy pages renumbered to continue.
            state.draft.pageImages = [
              ...newTransferPages,
              ...hardcopyPages.map((p, i) => ({ ...p, pageNum: newTransferPages.length + i + 1 }))
            ];
            if (lbl) lbl.innerHTML += ` <span style="color:var(--success)">· ✓ ${newTransferPages.length} page image${newTransferPages.length>1?'s':''} rebuilt</span>`;
          } catch (e) {
            console.warn('Failed to rebuild page images for replaced PK sheet', e);
            if (lbl) lbl.innerHTML += ' <span style="color:var(--danger)">· ⚠ Could not rebuild page images — viewer may show old content</span>';
          }
        } else {
          // Non-PDF replacement (e.g. a JPG) — we can't rasterize pages, but we still
          // need to drop the stale transfer-kind entries so the viewer doesn't show old data.
          state.draft.pageImages = state.draft.pageImages
            .filter(p => p.kind !== 'transfer')
            .map((p, i) => ({ ...p, pageNum: i + 1 }));
        }
      }
    });
  });

  // Formula mode toggle + inputs (none / library / upload)
  const libBox = document.getElementById('formulaLibraryBox');
  const upBox = document.getElementById('formulaUploadBox');
  document.querySelectorAll('input[name=formulaMode]').forEach(r => r.onchange = e => {
    const mode = e.target.value;
    libBox.style.display = mode === 'library' ? '' : 'none';
    upBox.style.display = mode === 'upload' ? '' : 'none';
    state.draft.formula = null;
  });
  // initial display
  const initialMode = state.draft.formula ? (state.draft.formula.fromLibrary ? 'library' : 'upload') : 'none';
  libBox.style.display = initialMode === 'library' ? '' : 'none';
  upBox.style.display = initialMode === 'upload' ? '' : 'none';

  const libSel = document.getElementById('f-formulaLibrary');
  libSel.onchange = () => {
    const f = FORMULAS.find(x => x.id === +libSel.value);
    state.draft.formula = f ? { fromLibrary: true, libraryId: f.id, name: f.name, link: f.link, fileName: f.fileName } : null;
  };
  const upEl = document.getElementById('f-formula');
  upEl.onchange = () => {
    const file = upEl.files[0];
    if (!file) { state.draft.formula = null; return; }
    state.draft.formula = { fromLibrary: false, name: file.name, size: file.size, type: file.type, saveToLibrary: document.getElementById('f-formulaSaveLib').checked };
    document.getElementById('f-formula-name').textContent = `${file.name} (${(file.size/1024).toFixed(0)} KB)`;
  };
  document.getElementById('f-formulaSaveLib').onchange = e => { if (state.draft.formula && !state.draft.formula.fromLibrary) state.draft.formula.saveToLibrary = e.target.checked; };

  // re-render formula library options when origin location changes
  const origSel = document.getElementById('f-originLocation');
  if (origSel) origSel.addEventListener('change', () => { state.draft.formula = null; renderNewForm(); });
}

function submitDraft() {
  const d = state.draft;
  const missing = [];
  if (d.isBulkPickup) {
    // Bulk pickup orders skip per-patient detail. Only require count + destination.
    if (!d.pickupLocation) missing.push('Pickup pharmacy');
    if (!d.bulkScriptCount || +d.bulkScriptCount < 1) missing.push('Number of scripts');
  } else {
    if (!d.patientName) missing.push('Patient name');
    // PK Transfer Sheet is only required on brand-new transfers — refills (whether
    // chained to an in-app original via refillOfId or entered manually as a legacy
    // refill) inherit the paperwork from the original prescription, so the sheet is
    // not required at submission.
    if (d.transferType !== 'Refill' && (!d.pkSheets || !d.pkSheets.length)) {
      missing.push('At least one PK Transfer Sheet upload');
    }
  }
  if (d.billing === 'CreditCard' && !d.ccOnFileInPaladin && !d.ccForm) missing.push('Signed Credit Card Authorization Form (or check "Credit card on file")');
  if (missing.length) { alert('Required fields missing:\n\n• ' + missing.join('\n• ')); return; }

  // Canonicalize drug names — turns Florida's "N. METHYLCOBALAMIN/..." and
  // injection-kit shorthand into the canonical PRELOADED_DRUGS form before save.
  (d.items || []).forEach(it => { it.drug = canonicalizeDrugName(it.drug); });

  // Edit mode: update the existing transfer in place
  if (state.editingTransferId) {
    const existing = TRANSFERS.find(x => x.id === state.editingTransferId);
    if (!existing) { alert('Original transfer not found.'); return; }
    // Capture the prior anticipated ship date so we can notify origin if it shifted
    const oldAntShipDate = existing.anticipatedShipDate || '';
    // Merge: preserve fields we don't edit in this form (status, tracking, dates, comments)
    Object.assign(existing, {
      transferType: d.transferType, refillOfId: d.refillOfId, legacyRefill: !!d.legacyRefill,
      priorPharmacy: d.priorPharmacy || '', priorRxNumber: d.priorRxNumber || '',
      priorTransferDate: d.priorTransferDate || '', priorTransferNote: d.priorTransferNote || '',
      patientName: d.patientName, patientDOB: d.patientDOB, patientAllergies: d.patientAllergies,
      originLocation: d.originLocation, fillLocation: d.fillLocation,
      shipTo: d.shipTo, deliveryCharge: d.deliveryCharge,
      shipAddr1: d.shipAddr1, shipAddr2: d.shipAddr2, shipCity: d.shipCity, shipState: d.shipState, shipZip: d.shipZip,
      billing: d.billing, ccOnFileInPaladin: d.ccOnFileInPaladin, ccForm: d.ccForm,
      patientPrice: d.patientPrice || '',
      coldItem: d.coldItem, anticipatedShipDate: d.anticipatedShipDate,
      tempAddress: !!d.tempAddress, tempThroughDate: d.tempThroughDate || '',
      appointmentDate: d.appointmentDate || '',
      pickupAtPharmacy: !!d.pickupAtPharmacy, pickupLocation: d.pickupLocation || '',
      isBulkPickup: !!d.isBulkPickup, bulkScriptCount: d.bulkScriptCount || '', bulkDescription: d.bulkDescription || '',
      pkSheets: d.pkSheets, formula: d.formula, hardCopies: d.hardCopies,
      pageImages: d.pageImages,
      items: d.items, transferNotes: d.transferNotes,
      lastEditedBy: CURRENT_USER.name, lastEditedAt: new Date().toISOString()
    });
    apiUpdateTransfer(existing);
    logAudit('edit_transfer', 'transfer', existing.id);
    // If the anticipated ship date changed AND the editor is not at the originating
    // pharmacy, the fill location is shifting the schedule — notify origin.
    if (oldAntShipDate !== existing.anticipatedShipDate) {
      notifyTeamsAntShipChange(existing, oldAntShipDate, existing.anticipatedShipDate);
    }
    state.draft = null; state.editingTransferId = null;
    alert('Transfer updated.');
    document.querySelector('.tab[data-tab=transfers]').click();
    return;
  }

  const t = {
    ...d,
    id: nextId(),
    title: `${d.patientName} — ${new Date().toLocaleDateString()}`,
    txEmailedDate: null, dateReceivedAtErie: null,
    patientStatus: 'Pending', dateShipped: null, trackingNumber: '', paid: 'Pending', dateReceivedByPatient: null,
    status: 'New',
    submittedBy: CURRENT_USER.name, assignedTo: null,
    createdAt: new Date().toISOString(),
    comments: []
  };
  // If uploading a new formula flagged to save to library, add it
  if (d.formula && !d.formula.fromLibrary && d.formula.saveToLibrary) {
    const savedName = prompt('Name this formula for the ' + d.originLocation + ' library:', d.formula.name.replace(/\.[^.]+$/,''));
    if (savedName) {
      FORMULAS.push({ id: nextId(), name: savedName, location: d.originLocation, link: '', fileName: d.formula.name, createdBy: CURRENT_USER.name, createdAt: new Date().toISOString() });
    }
  }
  TRANSFERS.unshift(t);
  apiSaveTransfer(t);
  logAudit('create_transfer', 'transfer', t.id, { transferType: t.transferType, originLocation: t.originLocation, fillLocation: t.fillLocation });
  state.draft = null;
  alert('Transfer submitted.');
  document.querySelector('.tab[data-tab=transfers]').click();
}

// Transfer detail modal
// =====================================================================
function openTransfer(id) {
  state.openTransferId = id;
  renderModal();
  logAudit('view_transfer', 'transfer', id);
}

// Fire-and-forget audit logger. Records: who, what, when, on which entity.
// Failures are swallowed so audit issues don't disrupt user actions.
function logAudit(action, entityType, entityId, details) {
  if (!CURRENT_USER || !CURRENT_USER.name) return;
  try {
    fetch('/api/audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        actor: CURRENT_USER.name,
        actorEmail: CURRENT_USER.email || '',
        action, entityType,
        entityId: String(entityId || ''),
        details: details || null
      })
    }).catch(() => {});
  } catch {}
}

// Jump straight into editing a transfer without first opening the detail modal.
// Loads a deep clone of the transfer into the draft, sets editingTransferId,
// and switches to the New Transfer tab (which doubles as the Edit form).
function editTransferDirectly(id) {
  const t = TRANSFERS.find(x => x.id === id);
  if (!t) return;
  state.draft = JSON.parse(JSON.stringify(t));
  state.editingTransferId = t.id;
  closeModal();
  document.querySelector('.tab[data-tab=new]').click();
}

// Quick popup for entering the Receiving Rx number(s). For single-Rx transfers it
// shows one focused input. For multi-Rx, one input per Rx (with drug names so the
// user knows which is which). Saves all at once.
function openReceivingRxModal(id) {
  const t = TRANSFERS.find(x => x.id === id);
  if (!t) return;
  // Only fill location (or admin) is supposed to set receiving Rx numbers
  if (CURRENT_USER.role !== 'admin' && CURRENT_USER.location !== t.fillLocation) {
    alert(`Only the fill location (${t.fillLocation}) or an admin can enter Receiving Rx numbers.`);
    return;
  }
  const root = document.getElementById('modalRoot');
  const items = t.items || [];
  const isSingle = items.length === 1;
  const rows = items.map((i, idx) => `
    <div style="display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--gray-200);border-radius:6px;margin-bottom:6px;background:var(--gray-50)">
      <div style="flex:1;font-size:13px">
        <strong>${escapeHtml(i.drug||'(no drug name)')}</strong>
        <div class="item-sub">${i.qty?escapeHtml(i.qty)+' · ':''}Origin Rx ${escapeHtml(i.rxNumber||'—')}</div>
      </div>
      <input
        type="text"
        data-rcvrx-input="${i.id}"
        value="${escapeHtml(i.receivingRxNumber||'')}"
        placeholder="Receiving Rx #"
        style="width:160px;padding:8px 10px;border:1px solid var(--gray-300);border-radius:4px;font-family:monospace;font-size:14px"
        ${isSingle && idx===0 ? 'autofocus' : ''}
      />
    </div>
  `).join('');
  root.innerHTML = `<div class="modal-overlay" id="rcvOverlay"><div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div>
        <div class="modal-title">Enter Receiving Rx Number${isSingle?'':'s'}</div>
        <div class="item-sub">${escapeHtml(t.patientName)} · Transfer ${t.id}</div>
      </div>
      <button class="modal-close" id="rcvClose">&times;</button>
    </div>
    <div class="modal-body">
      ${rows}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="rcvCancel">Cancel</button>
      <button class="btn btn-primary" id="rcvSave">Save</button>
    </div>
  </div></div>`;
  const close = () => {
    root.innerHTML = '';
    if (state.openTransferId) renderModal();
  };
  document.getElementById('rcvClose').onclick = close;
  document.getElementById('rcvCancel').onclick = close;
  document.getElementById('rcvOverlay').onclick = e => { if (e.target.id === 'rcvOverlay') close(); };
  // Focus the first input (autofocus attr is unreliable in dynamic content)
  const firstInput = root.querySelector('[data-rcvrx-input]');
  if (firstInput) { firstInput.focus(); firstInput.select(); }
  // Enter key submits when single Rx
  if (isSingle && firstInput) firstInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('rcvSave').click(); } });
  document.getElementById('rcvSave').onclick = () => {
    root.querySelectorAll('[data-rcvrx-input]').forEach(inp => {
      const itemId = +inp.dataset.rcvrxInput;
      const item = items.find(x => x.id === itemId);
      if (item) item.receivingRxNumber = inp.value.trim();
    });
    apiUpdateTransfer(t);
    close();
    renderTransfers();
  };
}

      onTransferCanceled(t);
    }
    t.status = newStatus;
    apiUpdateTransfer(t);
    logAudit('status_change', 'transfer', t.id, { from: oldStatus, to: newStatus });
    if (DELAY_STATUSES.includes(newStatus) && !DELAY_STATUSES.includes(oldStatus)) {
      notifyTeamsStatusDelay(t, oldStatus, newStatus);

  if (paidBtnEl) paidBtnEl.addEventListener('click', () => {
    t.paid = 'Paid';
    t.paidBy = CURRENT_USER.name;
    t.paidAt = new Date().toISOString();
    apiUpdateTransfer(t);
    logAudit('mark_paid', 'transfer', t.id);
    renderModal();
  });
  const unpaidBtnEl = document.getElementById('unpaidBtn');
  if (unpaidBtnEl) unpaidBtnEl.addEventListener('click', () => {
    if (!confirm('Undo paid status?')) return;
    t.paid = 'Pending';
    t.paidBy = null;
    t.paidAt = null;
    apiUpdateTransfer(t);
    logAudit('undo_paid', 'transfer', t.id);
    renderModal();
  });
  document.querySelectorAll('[data-cc-print]').forEach(b => b.onclick = () => {
    if (!t.ccForm) { alert('No CC form attached.'); return; }
    printDocs([{ transferId: t.id, patientName: t.patientName, transferMeta: `${t.originLocation} → ${t.fillLocation}`, title: `Credit Card Auth — ${t.patientName}`, name: t.ccForm.name, type: t.ccForm.type, dataUrl: t.ccForm.dataUrl }]);

  if (printBlankCCBtn) printBlankCCBtn.addEventListener('click', () => printCCAuthForm(t));
  document.getElementById('refillBtn').addEventListener('click', () => {
    state.draft = draftFromRefill(t);
    closeModal();
    document.querySelector('.tab[data-tab=new]').click();

  document.querySelectorAll('[data-open-transfer]').forEach(b => b.addEventListener('click', () => {
