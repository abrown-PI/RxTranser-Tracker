function onTransferCanceled(t) {
  t.canceledAt = new Date().toISOString();
  t.canceledBy = CURRENT_USER.name;
  t.cancelAcknowledged = false;
  // Stub: in production this fires the Teams/email notification — no PHI logged
  console.log('[Notify] Transfer canceled — would send alert', { transferId: t.id });
}

function renderActionItems() {
  const root = document.getElementById('view-actions');
  const canceled = visibleTransfers().filter(t => t.status === 'Canceled' && !t.cancelAcknowledged)
    .sort((a,b) => new Date(b.canceledAt||b.createdAt) - new Date(a.canceledAt||a.createdAt));
  const acknowledged = visibleTransfers().filter(t => t.status === 'Canceled' && t.cancelAcknowledged)
    .sort((a,b) => new Date(b.acknowledgedAt||0) - new Date(a.acknowledgedAt||0)).slice(0, 20);

  // Delivered shipments that haven't been checked in yet (incoming only).
  const TWENTY_FOUR_H = 24 * 3600000;
  const myLoc = CURRENT_USER.location;
  const todayISO = todayLocal();
  const deliveredToReceive = visibleShipments().filter(s =>
    s.toLocation === myLoc
    && s.status === 'Delivered'
  ).sort((a,b) => new Date(a.deliveredDate||0) - new Date(b.deliveredDate||0));
  const overdueCheckIn = deliveredToReceive.filter(s => {
    const d = parseDateLocal(s.deliveredDate);
    return d && (Date.now() - d.getTime()) > TWENTY_FOUR_H;
  });

  // Transfers past their anticipated ship date and not yet Shipped/Delivered/Canceled
  const lateShipping = visibleTransfers().filter(t =>
    t.anticipatedShipDate
    && t.anticipatedShipDate.slice(0,10) < todayISO
    && !['Shipped','Delivered','Canceled'].includes(t.status)
  ).sort((a,b) => (a.anticipatedShipDate||'').localeCompare(b.anticipatedShipDate||''));

  // Transfers in Pending Clarification or Needs Formula — held up, need attention
  const held = visibleTransfers().filter(t =>
    DELAY_STATUSES.includes(t.status)
  ).sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||''));

  const totalPending = canceled.length + deliveredToReceive.length + lateShipping.length + held.length;

  root.innerHTML = `
    <div class="page-header"><div class="page-title">Action Items <span style="font-weight:400;color:var(--gray-500);font-size:14px">(${totalPending} pending)</span></div></div>
    <p style="color:var(--gray-600);margin-bottom:14px">Items that need attention before they fall through the cracks. Each card below is a different kind of action. Click an item to open it for the next step.</p>

    ${lateShipping.length ? `<div class="card"><div class="card-header">⏰ Past Anticipated Ship Date (${lateShipping.length})</div><div class="card-body">
      <p class="item-sub" style="margin-bottom:8px">Transfers whose anticipated ship date has passed but haven't shipped yet. Either get them out the door, push the date, or change status to Pending Clarification / Needs Formula if there's a holdup.</p>
      <table style="box-shadow:none"><thead><tr>
        <th>Patient</th><th>Origin → Fill</th><th>Status</th><th>Anticipated Ship</th><th>Days late</th><th></th>
      </tr></thead><tbody>
        ${lateShipping.map(t => {
          const daysLate = Math.floor((Date.parse(todayISO) - Date.parse(t.anticipatedShipDate.slice(0,10))) / 86400000);
          return `<tr style="background:var(--danger-bg)">
            <td><strong>${escapeHtml(t.patientName||'(bulk pickup)')}</strong></td>
            <td>${escapeHtml(t.originLocation)} → ${escapeHtml(t.fillLocation)}</td>
            <td><span class="badge ${STATUS_BADGE[t.status]}" style="font-size:10px">${t.status}</span></td>
            <td>${fmtDate(t.anticipatedShipDate)}</td>
            <td><strong style="color:var(--danger)">${daysLate}d</strong></td>
            <td><button class="btn btn-primary btn-sm" data-open-late="${t.id}">Open</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div></div>` : ''}

    ${held.length ? `<div class="card"><div class="card-header">⚠ Held — Needs Action (${held.length})</div><div class="card-body">
      <p class="item-sub" style="margin-bottom:8px">Transfers in <strong>Pending Clarification</strong> or <strong>Needs Formula</strong> status. The origin pharmacy has been notified via Teams; respond by editing the transfer and changing status back to In Progress once resolved.</p>
      <table style="box-shadow:none"><thead><tr>
        <th>Patient</th><th>Origin → Fill</th><th>Status</th><th>Since</th><th></th>
      </tr></thead><tbody>
        ${held.map(t => `<tr style="background:var(--warning-bg)">
          <td><strong>${escapeHtml(t.patientName||'(bulk pickup)')}</strong></td>
          <td>${escapeHtml(t.originLocation)} → ${escapeHtml(t.fillLocation)}</td>
          <td><span class="badge ${STATUS_BADGE[t.status]}" style="font-size:10px">${t.status}</span></td>
          <td>${fmtDate(t.createdAt)}</td>
          <td><button class="btn btn-primary btn-sm" data-open-held="${t.id}">Open</button></td>
        </tr>`).join('')}
      </tbody></table>
    </div></div>` : ''}

    <div class="card"><div class="card-header">📦 Delivered — Needs Check-In (${deliveredToReceive.length}${overdueCheckIn.length?` · <span style="color:var(--danger)">${overdueCheckIn.length} over 24h</span>`:''})</div><div class="card-body">
      ${deliveredToReceive.length === 0 ? `<div class="empty" style="padding:20px"><h3>🎉 No deliveries waiting</h3><p>All incoming shipments are either still in transit or already checked in.</p></div>` : `
      <p class="item-sub" style="margin-bottom:8px">FedEx says these are delivered to your pharmacy, but they haven't been checked in yet. Click <strong>Check In</strong> when the box is in your hands so we know the contents have been verified.</p>
      <table style="box-shadow:none"><thead><tr>
        <th>From → To</th><th>Tracking / BULK ID</th><th>Contents</th><th>Delivered</th><th>Age</th><th></th>
      </tr></thead><tbody>
        ${deliveredToReceive.map(s => {
          const delivered = parseDateLocal(s.deliveredDate);
          const ageMs = delivered ? Date.now() - delivered.getTime() : 0;
          const ageH = Math.floor(ageMs / 3600000);
          const ageStr = !delivered ? '—' : ageH < 24 ? `${ageH}h` : `${Math.floor(ageH/24)}d ${ageH%24}h`;
          const isOverdue = ageMs > TWENTY_FOUR_H;
          return `<tr style="background:${isOverdue?'var(--danger-bg)':'var(--warning-bg)'}">
            <td><strong>${escapeHtml(s.fromLocation)}</strong> → ${escapeHtml(s.toLocation)}</td>
            <td style="font-family:monospace;font-size:12px">${s.bulkShipmentId?`<div style="color:var(--primary-dark);font-weight:600">${escapeHtml(s.bulkShipmentId)}</div>`:''}${escapeHtml(s.trackingNumber||'—')}</td>
            <td>${(s.transferIds||[]).length} transfer${(s.transferIds||[]).length===1?'':'s'}</td>
            <td>${delivered?fmtDate(s.deliveredDate):'—'}</td>
            <td>${isOverdue?`<strong style="color:var(--danger)">⚠ ${ageStr}</strong>`:ageStr}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-secondary btn-sm" data-open-ship="${s.id}">Open</button>
              <button class="btn btn-primary btn-sm" data-checkin="${s.id}">📦 Check In</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody></table>`}
    </div></div>

    <div class="card"><div class="card-header">Canceled — Needs Acknowledgment (${canceled.length})</div><div class="card-body">
      ${canceled.length === 0 ? `<div class="empty"><h3>🎉 All clear</h3><p>No canceled transfers awaiting acknowledgment.</p></div>` : `
      <table style="box-shadow:none"><thead><tr>
        <th>Patient</th><th>Origin → Fill</th><th>Canceled By</th><th>When</th><th>Items</th><th></th>
      </tr></thead><tbody>
        ${canceled.map(t => `<tr style="background:var(--danger-bg)">
          <td><strong>${escapeHtml(t.patientName)}</strong>${t.coldItem?'<span class="badge badge-cold">Cold</span>':''}</td>
          <td>${escapeHtml(t.originLocation)} → ${escapeHtml(t.fillLocation)}</td>
          <td>${escapeHtml(t.canceledBy||'—')}</td>
          <td>${t.canceledAt?new Date(t.canceledAt).toLocaleString():'—'}</td>
          <td>${t.items.length} Rx — ${escapeHtml(t.items.map(i=>i.drug).filter(Boolean).join(', ').slice(0,80))}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-secondary btn-sm" data-open-ack="${t.id}">Open</button>
            <button class="btn btn-primary btn-sm" data-ack="${t.id}">Acknowledge</button>
          </td>
        </tr>`).join('')}
      </tbody></table>`}
    </div></div>

    ${acknowledged.length ? `<div class="card"><div class="card-header">Recently Acknowledged (${acknowledged.length})</div><div class="card-body">
      <table style="box-shadow:none"><thead><tr><th>Patient</th><th>Canceled</th><th>Acknowledged By</th><th>When</th></tr></thead><tbody>
        ${acknowledged.map(t => `<tr data-open="${t.id}" style="cursor:pointer">
          <td><strong>${escapeHtml(t.patientName)}</strong></td>
          <td>${t.canceledAt?new Date(t.canceledAt).toLocaleString():'—'}</td>
          <td>${escapeHtml(t.acknowledgedBy||'—')}</td>
          <td>${t.acknowledgedAt?new Date(t.acknowledgedAt).toLocaleString():'—'}</td>
        </tr>`).join('')}
      </tbody></table>
    </div></div>` : ''}
  `;
  root.querySelectorAll('[data-open-ack]').forEach(b => b.onclick = () => openTransfer(+b.dataset.openAck));
  root.querySelectorAll('[data-open-ship]').forEach(b => b.onclick = () => openShipment(+b.dataset.openShip));
  root.querySelectorAll('[data-checkin]').forEach(b => b.onclick = () => openShipment(+b.dataset.checkin));
  root.querySelectorAll('[data-open-late]').forEach(b => b.onclick = () => openTransfer(+b.dataset.openLate));
  root.querySelectorAll('[data-open-held]').forEach(b => b.onclick = () => openTransfer(+b.dataset.openHeld));
  root.querySelectorAll('[data-open]').forEach(tr => tr.onclick = () => openTransfer(+tr.dataset.open));
  root.querySelectorAll('[data-ack]').forEach(b => b.onclick = () => {
    const t = TRANSFERS.find(x => x.id === +b.dataset.ack);
    t.cancelAcknowledged = true;
    t.acknowledgedBy = CURRENT_USER.name;
    t.acknowledgedAt = new Date().toISOString();
    apiUpdateTransfer(t);
    renderActionItems();
    render();
  });
}

// =====================================================================
// FedEx integration — pull recent shipments and match by ship-to address
// =====================================================================
let _fedexStatusCache = null;
async function checkFedexConfigured() {
  if (_fedexStatusCache) return _fedexStatusCache;
  try {
    const r = await fetch('/api/fedex-status');
    if (!r.ok) return { configured: false, error: 'API endpoint not reachable' };
    _fedexStatusCache = await r.json();
    return _fedexStatusCache;
  } catch (e) {
    return { configured: false, error: 'Network error: ' + e.message };
  }
}

async function updateFedexStatusPill() {
  const el = document.getElementById('fedexStatusPill');
  if (!el) return;
  const s = await checkFedexConfigured();
  if (s.configured) {
    el.innerHTML = `<span style="color:var(--success)">● FedEx ${s.environment}</span>`;
  } else {
    el.innerHTML = `<span style="color:var(--gray-500)" title="${escapeHtml(s.error||s.missing&&s.missing.join(', ')||'Not configured')}">○ FedEx not configured</span>`;
  }
}

// Normalize an address for fuzzy match — uppercase, strip punctuation, collapse whitespace,
// drop the common "STREET → ST", "ROAD → RD" suffixes that vary between FedEx and our records.
function normalizeAddr(s) {
  if (!s) return '';
  return String(s).toUpperCase()
    .replace(/\bSTREET\b/g, 'ST').replace(/\bROAD\b/g, 'RD').replace(/\bAVENUE\b/g, 'AVE')
    .replace(/\bDRIVE\b/g, 'DR').replace(/\bBOULEVARD\b/g, 'BLVD').replace(/\bLANE\b/g, 'LN')
    .replace(/\bCIRCLE\b/g, 'CIR').replace(/\bCOURT\b/g, 'CT').replace(/\bPLACE\b/g, 'PL')
    .replace(/[.,#]/g, '').replace(/\s+/g, ' ').trim();
}
function lastNameOf(name) { if (!name) return ''; return name.split(',')[0].trim().toUpperCase(); }

// Score a potential match between a FedEx shipment and one of our transfers.
// Higher score = better match. Returns 0 if there's no plausible link.
function scoreMatch(fedexShip, transfer) {
  let score = 0;
  const r = fedexShip.recipient || {};
  const tLast = lastNameOf(transfer.patientName);
  const fLast = lastNameOf(r.name);
  // Recipient name match (last name)
  if (tLast && fLast && tLast === fLast) score += 50;
  // Ship-to address — pharmacy or patient
  if (transfer.shipTo === 'Pharmacy') {
    // For pharmacy ships, compare against PHARMACY_ADDRESSES[originLocation]
    const pa = PHARMACY_ADDRESSES[transfer.originLocation];
    if (pa) {
      if (normalizeAddr(pa.addr1) === normalizeAddr(r.addr1) && pa.zip && pa.zip === r.zip) score += 40;
      else if (pa.zip && pa.zip === r.zip) score += 20;
    }
  } else {
    // Patient ship — compare against transfer.shipAddr*
    if (transfer.shipAddr1 && r.addr1 && normalizeAddr(transfer.shipAddr1) === normalizeAddr(r.addr1)) score += 40;
    if (transfer.shipZip && r.zip && transfer.shipZip === r.zip) score += 10;
    if (transfer.shipCity && r.city && transfer.shipCity.toUpperCase() === r.city.toUpperCase()) score += 5;
  }
  // Date proximity — tighter window for pharmacy bulk ships (weekly), wider for patient
  const fDate = fedexShip.shipDate ? new Date(fedexShip.shipDate) : null;
  const tDate = transfer.createdAt ? new Date(transfer.createdAt) : null;
  if (fDate && tDate) {
    const daysOff = Math.abs(fDate - tDate) / 86400000;
    const window = transfer.shipTo === 'Pharmacy' ? 3 : 10;
    if (daysOff <= window) score += Math.max(0, 10 - daysOff);
  }
  return score;
}

function openFedexPullModal() {
  const root = document.getElementById('modalRoot');
  // Reference-based pull: query FedEx for the reference number of every open transfer w/o tracking
  const state = { loading: false, results: null, error: null, applied: [] };

  const openTransfers = TRANSFERS.filter(t => !['Delivered','Canceled'].includes(t.status) && !t.trackingNumber);

  const render = () => {
    root.innerHTML = `<div class="modal-overlay" id="fxOverlay"><div class="modal" style="max-width:760px">

        </div>
        <div style="font-size:13px;color:var(--gray-700);margin-bottom:12px">
          <strong>${openTransfers.length}</strong> open transfer${openTransfers.length===1?'':'s'} without tracking numbers will be queried.
        </div>
        <button class="btn btn-primary" id="fx-go" ${state.loading||openTransfers.length===0?'disabled style="opacity:.5"':''}>${state.loading?'Querying FedEx…':'Query FedEx now'}</button>
        ${state.error?`<div style="margin-top:14px;background:var(--danger-bg);border:1px solid var(--danger);padding:10px 14px;border-radius:6px;font-size:13px"><strong style="color:var(--danger)">Error:</strong> ${escapeHtml(state.error)}</div>`:''}
        ${state.results ? renderResults() : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="fxCancel">Close</button>
      </div>

    document.getElementById('fxClose').onclick = close;
    document.getElementById('fxCancel').onclick = close;
    document.getElementById('fxOverlay').onclick = e => { if (e.target.id === 'fxOverlay') close(); };
    document.getElementById('fx-go').onclick = pull;
  };

  const renderResults = () => {
    const found = state.results.filter(s => s.found);
    if (found.length === 0) return `<div style="margin-top:14px;background:var(--warning-bg);border:1px solid var(--warning);padding:10px 14px;border-radius:6px;font-size:13px">
      <strong>No matches found.</strong> Either staff didn't enter transfer IDs into WorldShip's Customer Reference field, or the shipments haven't been processed by FedEx yet. Try again later or check that references are being entered.
    </div>`;
    return `
      <div style="margin-top:14px;font-size:13px;color:var(--gray-700)">
        Found tracking for <strong>${found.length}</strong> of ${state.results.length} queried.${state.applied.length?` ${state.applied.length} applied successfully.`:''}
      </div>
      <table style="box-shadow:none;font-size:13px;margin-top:10px"><thead><tr>
        <th>Transfer</th><th>Reference</th><th>Tracking #</th><th>Ship Date</th>
      </tr></thead><tbody>
        ${found.map(s => {
          const t = TRANSFERS.find(x => String(x.id) === String(s.reference));
          return `<tr style="background:var(--success-bg)">
            <td><strong>${escapeHtml(t ? t.patientName : '(unknown)')}</strong></td>
            <td style="font-family:monospace">${escapeHtml(s.reference)}</td>
            <td style="font-family:monospace;font-size:12px">${escapeHtml(s.trackingNumber)}</td>
            <td>${fmtDate(s.shipDate)}</td>
          </tr>`;
        }).join('')}
      </tbody></table>
    `;
  };

  const pull = async () => {
    state.loading = true; state.error = null; state.results = null; render();
    try {
      const references = openTransfers.map(t => String(t.id));
      const r = await fetch('/api/fedex-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ references })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'FedEx query failed');
      state.results = data.shipments || [];
      // Apply found matches immediately (reference-by-reference lookup is unambiguous — no need to confirm)
      for (const s of state.results) {
        if (!s.found) continue;
        const t = TRANSFERS.find(x => String(x.id) === String(s.reference));
        if (!t) continue;
        t.trackingNumber = s.trackingNumber;
        if (s.shipDate) t.dateShipped = s.shipDate;
        if (!['Shipped','Delivered','Canceled'].includes(t.status)) t.status = 'Shipped';
        await apiUpdateTransfer(t);
        if (!SHIPMENTS.some(sh => sh.trackingNumber === s.trackingNumber)) {
          const newShip = {
            id: nextId(),
            fromLocation: t.fillLocation,
            toLocation: t.shipTo === 'Pharmacy' ? t.originLocation : 'Patient',
            destinationType: t.shipTo === 'Pharmacy' ? 'Pharmacy' : 'Patient',
            carrier: 'FedEx',
            trackingNumber: s.trackingNumber,
            labelGenerated: false,
            status: 'In Transit',
            shipDate: s.shipDate,
            deliveredDate: null, receivedDate: null, receivedBy: null,
            transferIds: [t.id],
            createdAt: new Date().toISOString(), createdBy: 'FedEx auto-match',
            unpacked: {}
          };
          SHIPMENTS.unshift(newShip);
          apiSaveShipment(newShip);
        }
        state.applied.push(s);
      }
    } catch (e) {
      state.error = e.message;
    }
    state.loading = false;
    render();
    if (state.applied.length) {
      // Re-render shipments tab in the background so the new statuses show up
      setTimeout(() => { if (typeof renderShipments === 'function' && state.tab === 'shipments') renderShipments(); }, 100);
    }
  };

  const close = () => { root.innerHTML = ''; };
  render();
};

// Auto-refresh tracking statuses every 15 minutes.
// Started once at app init. Each tick: only fires a FedEx call when the user is actually
// on the Shipments tab (no point burning API calls if nobody's looking).
function startFedexAutoRefresh() {
  setInterval(refreshActiveTracking, 15 * 60 * 1000);
}
async function refreshActiveTracking() {
  if (state.tab !== 'shipments') return;
  const cfg = await checkFedexConfigured();
  if (!cfg.configured) return;
  const numbers = [...new Set(SHIPMENTS
    .filter(s => s.trackingNumber && !['Received'].includes(s.status))
    .map(s => s.trackingNumber.replace(/\s+/g, '')))];
  if (!numbers.length) return;
  try {
    const r = await fetch('/api/fedex-track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trackingNumbers: numbers })
    });
    if (!r.ok) return;
    const data = await r.json();
    (data.results || []).forEach(res => {
      const s = SHIPMENTS.find(x => x.trackingNumber && x.trackingNumber.replace(/\s+/g,'') === res.trackingNumber);
      if (!s) return;
      // Map FedEx status codes to our internal shipment status set
      const code = (res.statusCode || '').toUpperCase();
      if (code === 'DL' || /DELIVER/i.test(res.status)) {
        s.status = 'Delivered';
        if (res.deliveryDate) s.deliveredDate = res.deliveryDate.slice(0,10);
        // Cascade to linked transfers
        s.transferIds.forEach(tid => {
          const t = TRANSFERS.find(x => x.id === tid);
          if (t && t.status !== 'Delivered') {
            t.status = 'Delivered';
            if (!t.dateReceivedByPatient) t.dateReceivedByPatient = s.deliveredDate;
            apiUpdateTransfer(t);
          }
        });
      } else if (code) {
        s.status = 'In Transit';
      }
      s.fedexLastStatus = res.status;
      s.fedexLastChecked = new Date().toISOString();
    });
    if (state.tab === 'shipments') renderShipments();
  } catch (e) { console.warn('FedEx refresh failed', e); }
}

// =====================================================================
// Persistence — read transfers from Table Storage on load, write on mutate
// =====================================================================
// All mutation calls go through these helpers so we keep the source of truth
// in the backend. If the API is unreachable, we surface the error but don't
// block the user (the in-memory copy continues to work for the session).
async function apiLoadTransfers() {
  try {
    const r = await fetch('/api/transfers');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const list = data.transfers || [];
    // Advance _nextId past any existing transfer ID. Without this, after a page
    // reload _nextId resets to 20000 and new transfers (incl. refills) collide
    // with already-stored IDs, producing EntityAlreadyExists from Azure Table Storage.
    list.forEach(t => { const n = Number(t.id); if (Number.isFinite(n) && n > _nextId) _nextId = n; });
    const VALID_SHIPTO = ['Pharmacy', 'Delivery-Lancaster', 'Patient'];
    list.forEach(t => {
      let needsSave = false;
      // Migrate legacy 'Ready to Ship' status → 'In Progress'.
      if (t.status === 'Ready to Ship') { t.status = 'In Progress'; needsSave = true; }
      // Heal corrupted shipTo values from the prior id-collision bug where the
      // form's f-shipTo select shared an id with the All-Transfers date filter,
      // so state.draft.shipTo got the date input's value (empty string or a date
      // string) and was saved into the transfer. Anything that isn't one of the
      // valid options indicates the bug bit this record. We can't know what the
      // user intended, so revert to the default 'Pharmacy'; the team can edit
      // any affected transfer to the right value.
      if (t.shipTo && !VALID_SHIPTO.includes(t.shipTo)) {
        console.warn('Healing corrupted shipTo on transfer', t.id, 'was:', JSON.stringify(t.shipTo));
        t.shipTo = 'Pharmacy';
        needsSave = true;
      }
      // Clean up bad FedEx auto-match data: when the tracking number equals the transfer
      // ID, that's the symptom of the prior FedEx Track API echo bug — FedEx returned the
      // reference back as if it were a tracking number, and we wrote it as the tracking
      // and flipped status to Shipped. Real FedEx tracking numbers are 10-22 digit strings
      // that should NEVER equal our short transfer IDs. Revert the bad records.
      const tn = String(t.trackingNumber || '').trim();
      const idStr = String(t.id);
      if (tn === idStr || (tn && !/^\d{10,22}$/.test(tn) && tn === idStr)) {
        t.trackingNumber = '';
        t.dateShipped = null;
        if (['Shipped','Delivered'].includes(t.status)) t.status = 'In Progress';
        t.fedexAutoMatched = false;
        delete t.fedexAutoMatchedAt;
        needsSave = true;
      }
      // Canonicalize legacy drug names to the agreed PRELOADED_DRUGS form.
      // Idempotent: already-canonical names pass through unchanged, so a
      // re-poll won't trigger another save.
      (t.items || []).forEach(it => {
        const canonical = canonicalizeDrugName(it.drug);
        if (canonical !== it.drug) { it.drug = canonical; needsSave = true; }
      });
      if (needsSave) apiUpdateTransfer(t);
    });
    return list;
  } catch (e) { console.error('Failed to load transfers from API', e); return null; }
}
async function apiSaveTransfer(t) {
  try {
    const r = await fetch('/api/transfers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(t)

    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + await r.text());

// Shipment persistence — mirrors the transfer helpers above. Used by

// Background sync — re-fetch transfers from the server every 30s so a change
// made by one user (new transfer, status update, document upload, etc.) shows
// up for everyone else without requiring a browser refresh. Pauses while the
// tab is hidden and fires immediately when it becomes visible again.
const TRANSFER_POLL_INTERVAL_MS = 30 * 1000;
let _transferPollTimer = null;
function startTransferAutoRefresh() {
  if (_transferPollTimer) return;
  _transferPollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') { pollRefreshTransfers(); pollRefreshShipments(); }
  }, TRANSFER_POLL_INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { pollRefreshTransfers(); pollRefreshShipments(); }
  });
}

// Mirror of pollRefreshTransfers for the shipments table. Pending shipments
// the shipping team builds throughout the day will appear in other tabs
// (or after a refresh) without anyone having to reload.
async function pollRefreshShipments() {
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;

  let loaded;
  try { loaded = await apiLoadShipments(); } catch { return; }
  if (!loaded) return;

  // Backend-derived shipments live alongside IIFE-derived ones. Only sync the
  // subset that's backend-owned; leave the historical seed rows alone.
  const backendIds = new Set(loaded.map(s => s.id));
  const before = JSON.stringify(SHIPMENTS.filter(s => backendIds.has(s.id)));
  const byId = new Map(SHIPMENTS.map(s => [s.id, s]));
  loaded.forEach(serverS => {
    const localS = byId.get(serverS.id);
    if (!localS) { SHIPMENTS.unshift(serverS); return; }
    Object.keys(localS).forEach(k => { if (!(k in serverS)) delete localS[k]; });
    Object.assign(localS, serverS);
  });
  // Skip auto-removal on poll: we can't reliably tell an IIFE-seeded row apart
  // from a backend row that was just deleted by another user. Stale rows will
  // clear on the next full page load. Trade-off accepted to keep this simple.
  const after = JSON.stringify(SHIPMENTS.filter(s => backendIds.has(s.id)));
  if (before === after) return;

  if (state.tab === 'shipments') renderShipments();
}
async function pollRefreshTransfers() {
  // Skip while the user is actively typing or editing — re-rendering would
  // wipe out in-progress input. They'll pick up changes on the next tick.
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (state.tab === 'new') return;
  if (state.editingTransferId) return;

  let loaded;
  try { loaded = await apiLoadTransfers(); } catch { return; }
  if (!loaded) return;
  // Defensive: an empty response while we have local data is almost certainly
  // a server blip, not a real "all transfers deleted". Skip rather than wipe.
  if (loaded.length === 0 && TRANSFERS.length > 0) return;

  const before = JSON.stringify(TRANSFERS);
  const byId = new Map(TRANSFERS.map(t => [t.id, t]));
  const seen = new Set();
  loaded.forEach(serverT => {
    seen.add(serverT.id);
    const localT = byId.get(serverT.id);
    if (!localT) { TRANSFERS.unshift(serverT); return; }
    // Update in place so any references held elsewhere stay valid.
    Object.keys(localT).forEach(k => { if (!(k in serverT)) delete localT[k]; });
    Object.assign(localT, serverT);
  });
  for (let i = TRANSFERS.length - 1; i >= 0; i--) {
    if (!seen.has(TRANSFERS[i].id)) TRANSFERS.splice(i, 1);
  }
  if (JSON.stringify(TRANSFERS) === before) return;

  render();
  if (state.openTransferId && TRANSFERS.some(t => t.id === state.openTransferId)) {
    renderModal();
  }
}

// =====================================================================
// Microsoft 365 / Entra ID sign-in via MSAL.js
// =====================================================================
// Client/Tenant IDs are PUBLIC (anyone signing in can see them); hardcoded for simplicity.
// If we ever need to rotate them, we'd change here + redeploy.
const AZURE_AD_CLIENT_ID = 'e07f58ca-4073-417b-99b7-8f4ca12a7fcd';
const AZURE_AD_TENANT_ID = '14c4fb10-085e-4ac6-a5b3-d49f57a97731';

let _msalInstance = null;
let _adminEmails = []; // cached after first /api/settings fetch

function getMsal() {
  if (_msalInstance) return _msalInstance;
  if (!window.msal) return null;
  _msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: AZURE_AD_CLIENT_ID,
      authority: 'https://login.microsoftonline.com/' + AZURE_AD_TENANT_ID,
      redirectUri: window.location.origin
    },
    // localStorage so the MSAL session is shared across browser tabs — clicking a link
    // in Teams (or an email) opens a new tab that's already signed in. sessionStorage
    // is per-tab, which forced a re-login every time a link was clicked.
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
  });
  return _msalInstance;
}

async function loadAdminEmails() {
  try {
    const r = await fetch('/api/settings');
    if (!r.ok) return [];
    const data = await r.json();
    _adminEmails = (data.adminEmails || []).map(e => e.toLowerCase());
    // Merge any persisted pharmacy addresses (incl. multi-day shippingDays) into the
    // in-memory PHARMACY_ADDRESSES object so admin edits survive page reloads.
    const persisted = data.pharmacyAddresses || {};
    Object.entries(persisted).forEach(([loc, addr]) => {
      if (!addr) return;
      PHARMACY_ADDRESSES[loc] = { ...(PHARMACY_ADDRESSES[loc] || {}), ...addr };
    });
    return _adminEmails;
  } catch { return []; }
}

// Apply a signed-in Microsoft account to CURRENT_USER. Looks up the user's assigned
// location from the backend (set by admin in Users & Access). Falls back to localStorage
// preference (if they manually switched via the dropdown), then to a sensible default.
async function applyMsalAccount(account) {
  const email = (account.username || '').toLowerCase();
  const name = account.name || account.username || 'User';
  const isAdmin = _adminEmails.includes(email);

  // Look up the user's assigned location from backend (source of truth)
  let backendLocation = null;
  try {
    const r = await fetch('/api/users');
    if (r.ok) {
      const data = await r.json();
      const backendUser = (data.users || []).find(u => (u.email || '').toLowerCase() === email);
      if (backendUser && backendUser.location) backendLocation = backendUser.location;
    }
  } catch { /* network error — fall through */ }

  const savedLocation = backendLocation
    || localStorage.getItem('userLocation_' + email)
    || 'Erie'; // last-ditch default for brand-new users with no admin-set location yet

  // Find or create the user in USERS so existing code that reads from USERS still works
  let user = USERS.find(u => (u.email || '').toLowerCase() === email);
  if (!user) {
    user = { name, email, location: savedLocation, role: isAdmin ? 'admin' : 'tech' };
    USERS.unshift(user);
  } else {
    user.name = name;
    user.role = isAdmin ? 'admin' : (user.role === 'manager' ? 'manager' : 'tech');
    user.location = savedLocation;
  }
  CURRENT_USER = user;
  loadDefaultView(); // restore the user's saved default filters if any
  // Best-effort persist user record + last sign-in time (non-blocking, never throws)
  try {
    fetch('/api/users', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, name, location: savedLocation, role: user.role, lastSignInAt: new Date().toISOString() })
    }).catch(() => {});
  } catch {}
  try { logAudit('sign_in', 'session', email, { method: 'msal' }); } catch {}
  // Swap UI — guard every DOM lookup so a missing element doesn't blow up the whole sign-in
  const signInArea = document.getElementById('signInArea');
  if (signInArea) signInArea.style.display = 'none';
  const signedInArea = document.getElementById('signedInArea');
  if (signedInArea) signedInArea.style.display = 'flex';
  const userInfo = document.getElementById('userInfo');
  if (userInfo) userInfo.textContent = `${user.name}`;
  // Location switcher (guarded)
  const locSel = document.getElementById('locationSwitcher');
  if (!locSel) return; // navbar not present? still treat sign-in as successful
  locSel.innerHTML = LOCATIONS.map(l => `<option value="${l}" ${l===user.location?'selected':''}>${l}</option>`).join('');
  locSel.onchange = () => {
    user.location = locSel.value;
    localStorage.setItem('userLocation_' + email, locSel.value);
    updateNextShipmentBanner();
    // Persist the change to backend so it survives across browsers + devices
    fetch('/api/users/' + encodeURIComponent(email), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location: locSel.value })
    }).catch(() => {});
    applyRoleVisibility(); render();
  };
  applyRoleVisibility();
  render();
}

// =====================================================================
// Idle timeout — auto sign-out after inactivity to limit PHI exposure
// =====================================================================
const IDLE_TIMEOUT_MIN = 30;     // Sign out after this many minutes idle
const IDLE_WARN_MIN = 28;        // Show warning starting at this many minutes
let _lastActivityTs = Date.now();
let _idleTimer = null;
let _idleWarnEl = null;

function bumpIdleActivity() {
  _lastActivityTs = Date.now();
  if (_idleWarnEl) { _idleWarnEl.remove(); _idleWarnEl = null; }
}

function startIdleTimer() {
  if (_idleTimer) return; // already running
  ['mousemove','keydown','click','scroll','touchstart'].forEach(evt =>
    window.addEventListener(evt, bumpIdleActivity, { passive: true })
  );
  bumpIdleActivity();
  _idleTimer = setInterval(() => {
    const elapsedMin = (Date.now() - _lastActivityTs) / 60000;
    if (elapsedMin >= IDLE_TIMEOUT_MIN) {
      doIdleSignOut();
    } else if (elapsedMin >= IDLE_WARN_MIN && !_idleWarnEl) {
      showIdleWarning(IDLE_TIMEOUT_MIN - elapsedMin);
    }
  }, 30000);
}

function showIdleWarning(minutesLeft) {
  _idleWarnEl = document.createElement('div');
  _idleWarnEl.style.cssText = 'position:fixed;top:60px;right:20px;background:#fffbeb;border:2px solid #d97706;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:9999;font-size:13px;max-width:340px';
  _idleWarnEl.innerHTML = `<strong style="color:#d97706">⚠ You'll be signed out soon</strong><div style="margin-top:6px">For security, this session will end in about ${Math.ceil(minutesLeft)} min of inactivity. Move your mouse or press a key to stay signed in.</div>`;
  document.body.appendChild(_idleWarnEl);
}

async function doIdleSignOut() {
  if (_idleTimer) { clearInterval(_idleTimer); _idleTimer = null; }
  if (_idleWarnEl) { _idleWarnEl.remove(); _idleWarnEl = null; }
  sessionStorage.removeItem('localUserHint');
  CURRENT_USER = USERS[0] || { name: '', email: '', role: 'tech', location: '' };
  const m = getMsal();
  if (m && CURRENT_USER && !CURRENT_USER.isLocal) {
    try { await m.logoutRedirect({ onRedirectNavigate: () => false }); } catch {}
  }
  // Reload to a clean state and force re-auth
  location.replace(location.origin + location.pathname);
}

async function doSignIn(m) {
  try {
    const res = await m.loginPopup({ scopes: ['User.Read'], prompt: 'select_account' });
    if (res && res.account) {
      await applyMsalAccount(res.account);
      hideAuthGate();
    }
  } catch (e) {
    console.warn('loginPopup failed, trying redirect', e);
    try { await m.loginRedirect({ scopes: ['User.Read'] }); }
    catch (e2) { alert('Sign-in failed: ' + e2.message); }
  }
}

// Apply a local (non-365) account as the signed-in user.
function applyLocalAccount(localUser) {

    name: localUser.name || localUser.username,
    email: localUser.email || (localUser.username + '@local'),
    location: localUser.location || 'Erie',
    role: localUser.role || 'tech',
    isLocal: true,
    username: localUser.username
  };
  // Add or replace in USERS
  const i = USERS.findIndex(u => u.email === user.email);
  if (i >= 0) USERS[i] = user; else USERS.unshift(user);

    applyRoleVisibility(); render();

  sessionStorage.setItem('localUserHint', JSON.stringify({ username: user.username, name: user.name, location: user.location, role: user.role, email: user.email }));
  applyRoleVisibility();

async function doLocalSignIn() {
  const username = (document.getElementById('gateUsername').value || '').trim();
  const pin = (document.getElementById('gatePin').value || '').trim();
  if (!username || !pin) return;
  const msg = document.getElementById('gateMsg');
  msg.textContent = 'Signing in…';
  try {

      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, pin })
    });

    if (!r.ok) { msg.innerHTML = `<span style="color:#fca5a5">${escapeHtml(data.error || 'Sign-in failed')}</span>`; return; }
    applyLocalAccount(data.user);
    hideAuthGate();

  } catch (e) {
    msg.innerHTML = `<span style="color:#fca5a5">Network error: ${escapeHtml(e.message)}</span>`;

async function initAuth() {
  // Hook up the local sign-in path first — it doesn't depend on MSAL loading
  document.getElementById('gateLocalBtn').onclick = showLocalSignInForm;
  document.getElementById('gateLocalBack').onclick = (e) => { e.preventDefault(); showPrimarySignIn(); };
  document.getElementById('gateLocalSubmit').onclick = doLocalSignIn;
  document.getElementById('gatePin').addEventListener('keydown', e => { if (e.key === 'Enter') doLocalSignIn(); });
  document.getElementById('gateUsername').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gatePin').focus(); });

  // Restore a local user across reloads if one was used
  const localHint = sessionStorage.getItem('localUserHint');
  if (localHint) {
    try { applyLocalAccount(JSON.parse(localHint)); hideAuthGate(); }
    catch {}
  }

  const m = getMsal();
  if (!m) {
    // MSAL didn't load — still allow local sign-in. Hide the Microsoft button, surface the message.
    showAuthGate('Microsoft sign-in unavailable. Use a local account or check your network.');
    document.getElementById('gateSignInBtn').style.display = 'none';
    return;
  }
  // CRITICAL: bind the sign-in button handlers FIRST, before any await.
  // If a later async op throws or hangs (slow /api/users, audit log POST, etc.) the
  // login screen would otherwise be visible but unclickable — the freeze users hit.
  document.getElementById('signInBtn').onclick = () => doSignIn(m);
  document.getElementById('gateSignInBtn').onclick = () => doSignIn(m);

  try { await m.initialize(); } catch (e) { console.warn('msal initialize failed', e); }
  try { await m.handleRedirectPromise(); } catch (e) { console.warn('handleRedirectPromise', e); }
  try { await loadAdminEmails(); } catch (e) { console.warn('loadAdminEmails failed', e); }
  const accounts = m.getAllAccounts();
  if (accounts.length > 0) {
    try { await applyMsalAccount(accounts[0]); hideAuthGate(); }
    catch (e) { console.warn('applyMsalAccount failed during auto sign-in — staying on auth gate', e); showAuthGate(); }
  } else if (!localHint) {
    showAuthGate();
  }
  document.getElementById('signOutBtn').onclick = async () => {
    sessionStorage.removeItem('localUserHint');
    if (CURRENT_USER && CURRENT_USER.isLocal) {
      // local sign-out — nothing server-side, just reset
      CURRENT_USER = USERS[0] || { name: '', email: '', role: 'tech', location: '' };
    } else {
      try { await m.logoutPopup(); }
      catch { await m.logoutRedirect(); }
    }
    document.getElementById('signedInArea').style.display = 'none';
    document.getElementById('signInArea').style.display = 'flex';
    showAuthGate();
    showPrimarySignIn();
  };
}

// Load persisted transfers from Table Storage and merge into the in-memory array, then re-render.
// Also handles ?transfer=ID deep-links (e.g. from Teams notifications) by opening the matching detail modal.
(async () => {
  const loaded = await apiLoadTransfers();
  if (loaded && loaded.length) {
    const existingIds = new Set(TRANSFERS.map(t => t.id));
    loaded.forEach(t => { if (!existingIds.has(t.id)) TRANSFERS.unshift(t); });
    render();
  }
  const params = new URLSearchParams(window.location.search);
  const tid = params.get('transfer');
  if (tid) {
    const t = TRANSFERS.find(x => String(x.id) === String(tid));
    if (t) openTransfer(t.id);
  }
})();

// Load persisted shipments from Table Storage and merge with the historical
// IIFE-derived ones. Backend wins for matching ids; we also dedupe by tracking
// number so a backend shipment that later picks up the same tracking as an
// IIFE shipment doesn't double-show in the Shipments tab.
(async () => {
  const loaded = await apiLoadShipments();
  if (loaded && loaded.length) {
    const existingIds = new Set(SHIPMENTS.map(s => s.id));
    const backendTracking = new Set(loaded.map(s => (s.trackingNumber || '').trim()).filter(Boolean));
    // Drop IIFE-derived rows that the backend now owns (matched by tracking number).
    for (let i = SHIPMENTS.length - 1; i >= 0; i--) {
      const tn = (SHIPMENTS[i].trackingNumber || '').trim();
      if (tn && backendTracking.has(tn) && !existingIds.has(SHIPMENTS[i].id)) {
        SHIPMENTS.splice(i, 1);
      }
    }
    loaded.forEach(s => { if (!existingIds.has(s.id)) SHIPMENTS.unshift(s); });
    render();
  }
})();

// Teams notification: status changed to Pending Clarification or Needs Formula.
// Pings the origin pharmacy so they know their order is held up.
async function notifyTeamsStatusDelay(transfer, oldStatus, newStatus) {
  if (!transfer.originLocation || transfer.originLocation === CURRENT_USER.location) return;
  const portalUrl = window.location.origin + window.location.pathname + '?transfer=' + encodeURIComponent(transfer.id);
  try {
    await fetch('/api/notify-teams', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        kind: 'status_delay',
        locations: [transfer.originLocation],
        transferId: transfer.id,
        patientName: transfer.patientName,
        drug: (transfer.items[0] && transfer.items[0].drug) || '',
        askedBy: CURRENT_USER.name,
        askedLocation: CURRENT_USER.location,
        oldStatus, newStatus,
        portalUrl
      })
    });
  } catch (e) { console.warn('Teams status notification failed', e); }
}

// Teams notification: anticipated ship date was changed by someone NOT at the
// originating pharmacy. Pings origin so they know shipping plans shifted.
async function notifyTeamsAntShipChange(transfer, oldDate, newDate) {
  if (!transfer.originLocation || transfer.originLocation === CURRENT_USER.location) return;
  if (!oldDate && !newDate) return;
  const portalUrl = window.location.origin + window.location.pathname + '?transfer=' + encodeURIComponent(transfer.id);

      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        kind: 'ant_ship_change',
        locations: [transfer.originLocation],
        transferId: transfer.id,
        patientName: transfer.patientName,
        drug: (transfer.items[0] && transfer.items[0].drug) || '',
        askedBy: CURRENT_USER.name,
        askedLocation: CURRENT_USER.location,
        oldDate: oldDate || '(unset)', newDate: newDate || '(unset)',
        portalUrl
      })
    });
  } catch (e) { console.warn('Teams ant-ship-change notification failed', e); }
}

// Teams notification: routes a question to the OTHER side(s) of the transfer.
async function notifyTeamsAboutQuestion(transfer, question) {
  const locations = new Set();
  // Notify the side(s) the asker is NOT at
  if (transfer.originLocation && transfer.originLocation !== CURRENT_USER.location) locations.add(transfer.originLocation);
  if (transfer.fillLocation && transfer.fillLocation !== CURRENT_USER.location) locations.add(transfer.fillLocation);
  if (locations.size === 0) {
    // Asker is at both origin and fill (rare) — notify both anyway
    if (transfer.originLocation) locations.add(transfer.originLocation);
    if (transfer.fillLocation) locations.add(transfer.fillLocation);
  }
  const portalUrl = window.location.origin + window.location.pathname + '?transfer=' + encodeURIComponent(transfer.id);
  try {
    const r = await fetch('/api/notify-teams', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        locations: [...locations],
        transferId: transfer.id,
        patientName: transfer.patientName,
        drug: (transfer.items[0] && transfer.items[0].drug) || '',
        askedBy: CURRENT_USER.name,
        askedLocation: CURRENT_USER.location,
        question,
        portalUrl
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    return data;
  } catch (e) { console.warn('Teams notification failed', e); return { sent: [], skipped: [], failed: [{ error: e.message }] }; }
}

// Opens a quick "Ask a Question" modal for a specific transfer. Posts a comment + notifies Teams.

    <div class="modal-body">
      <div class="form-group"><label>Your question</label><textarea id="aq-body" rows="4" placeholder="What do you need to know about this transfer?" style="width:100%;padding:9px;border:1px solid var(--gray-300);border-radius:6px;font-family:inherit;min-height:90px"></textarea></div>

      <button class="btn btn-secondary" id="aqCancel">Cancel</button>

  document.getElementById('aqOverlay').onclick = e => { if (e.target.id === 'aqOverlay') close(); };

    t.comments.push({
      id: nextId(), itemId: null, author: CURRENT_USER.name,

      setTimeout(close, 2000);
    } else if (result.failed && result.failed.length) {
      // Teams rejected the request — keep the modal open so we can see the error details
      const lines = result.failed.map(f => `<li><strong>${escapeHtml(f.location || '?')}:</strong> ${escapeHtml(f.error || 'unknown error')}</li>`).join('');
      resEl.innerHTML = `<div style="background:var(--danger-bg);border:1px solid var(--danger);padding:10px 12px;border-radius:6px;font-size:12px">
        <strong style="color:var(--danger)">⚠ Teams rejected the notification.</strong>
        <ul style="margin:6px 0 0;padding-left:18px">${lines}</ul>
        <div style="margin-top:8px">The question was still saved to the transfer's discussion.</div>
      </div>`;
    } else if (result.skipped && result.skipped.length) {
      resEl.innerHTML = `<div style="background:var(--warning-bg);border:1px solid var(--warning);padding:8px 12px;border-radius:6px;font-size:12px">Question saved to the transfer's discussion, but no Teams webhook configured for ${result.skipped.join(', ')}. Set up in Admin → Teams Webhooks.</div>`;
      setTimeout(close, 2000);
    } else {
      resEl.innerHTML = '<div class="item-sub">Question saved. (No Teams notification sent.)</div>';
      setTimeout(close, 2000);
    }
    render();
  };
}
</script>
</body>
</html>
