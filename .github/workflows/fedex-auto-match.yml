name: FedEx Auto-Match (every 3 hrs, 7a-8p ET window)

on:
  schedule:
    # 6 runs/day at 12, 15, 18, 21, 0, 1 UTC.
    # In EST (winter):  7am, 10am, 1pm, 4pm, 7pm, 8pm ET
    # In EDT (summer):  8am, 11am, 2pm, 5pm, 8pm, 9pm ET
    # Both calendars hit the 7a-8p ET window staff requested with one trailing late run.
    - cron: '0 12,15,18,21,0,1 * * *'
  workflow_dispatch: # also allow manual triggering from the Actions tab

jobs:
  auto-match:
    runs-on: ubuntu-latest
    steps:
      - name: Call FedEx auto-match endpoint
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://red-island-0bb34e510.7.azurestaticapps.net/api/fedex-auto-match" \
            -H "Content-Type: application/json" \
            -d '{"threshold": 80}')
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          echo "HTTP $status"
          echo "$body" | head -100
          if [ "$status" != "200" ]; then
            echo "::error::Auto-match endpoint returned $status"
            exit 1
          fi
